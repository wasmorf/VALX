<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VALX — Monte e ganhe</title>
<style>
  :root{
    --bg-deep:#080F14;
    --bg-panel:#111920;
    --bg-panel-2:#19222A;
    --line:#28323B;
    --crimson:#FF4655;
    --crimson-dim:#7A2430;
    --teal:#33DFC0;
    --gold:#E8B84B;
    --text:#F5F5F5;
    --muted:#6B7280;
    --glow-a:#17202A;
    --glow-b:#1B1216;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;touch-action:manipulation;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--glow-a) 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, var(--glow-b) 0%, transparent 55%),
      var(--bg-deep);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background 0.25s ease;
    touch-action:manipulation;
  }
  .headline{font-family:'Chakra Petch', sans-serif;}
  .mono{font-family:'JetBrains Mono', monospace;}

  #app{max-width:680px;margin:0 auto;padding:20px 16px 60px;}

  .angle{
    clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  }
  .angle-sm{
    clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }

  /* ---- top bar ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-top:6px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand:active{opacity:0.7;}
  .brand-mark{width:30px;height:30px;flex:none;color:var(--crimson);}
  .brand-text{display:flex;flex-direction:column;}
  .brand-name{font-family:'Chakra Petch';font-weight:700;font-size:19px;letter-spacing:0.5px;line-height:1;}
  .brand-name span{color:var(--crimson);}
  .phase-tag{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:2px;}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .lang-switch{display:flex;border:1px solid var(--line);}
  .lang-btn{
    font-family:'JetBrains Mono';font-size:10px;color:var(--muted);background:transparent;
    border:none;padding:6px 8px;cursor:pointer;letter-spacing:0.5px;
  }
  .lang-btn + .lang-btn{border-left:1px solid var(--line);}
  .lang-btn.active{background:var(--crimson);color:#fff;}

  /* ---- generic panel ---- */
  .panel{background:var(--bg-panel);border:1px solid var(--line);padding:22px;}
  .panel + .panel{margin-top:14px;}

  h1.hero{font-family:'Chakra Petch';font-size:30px;line-height:1.15;font-weight:700;margin:0 0 10px;}
  p.lead{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 20px;}

  button, .btn, .team-option, .diff-card, .mode-card, .history-item, a{touch-action:manipulation;}
  .btn{
    font-family:'Chakra Petch';font-weight:600;font-size:15px;
    background:var(--crimson);color:#fff;border:none;padding:13px 22px;
    cursor:pointer;letter-spacing:0.3px;
  }
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  /* ---- difficulty cards ---- */
  .diff-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:8px;}
  .diff-card{
    background:var(--bg-panel-2);border:1px solid var(--line);padding:16px;cursor:pointer;
    text-align:left;color:var(--text);
  }
  .diff-card.selected{border-color:var(--crimson);background:#20141A;}
  .diff-card h3{font-family:'Chakra Petch';margin:0 0 4px;font-size:16px;}
  .diff-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4;}
  .mode-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:8px;}
  .mode-card{
    background:var(--bg-panel-2);border:1px solid var(--line);padding:14px 16px;cursor:pointer;
    text-align:left;color:var(--text);display:flex;align-items:center;gap:14px;
    transition:border-color 0.15s, background 0.15s;
  }
  .mode-card:hover{border-color:var(--crimson);background:#1c1216;}
  .mode-card .mode-icon{
    flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    font-size:20px;background:var(--bg-panel);border:1px solid var(--line);border-radius:2px;
  }
  .mode-card .mode-text{flex:1;min-width:0;}
  .mode-card h3{font-family:'Chakra Petch';margin:0 0 2px;font-size:15px;}
  .mode-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.35;}
  .mode-card .mode-arrow{flex:none;color:var(--muted);font-size:18px;}

  /* ---- team select ---- */
  .team-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0;}
  .selecao-grid{display:grid;grid-template-columns:1fr;gap:8px;margin:18px 0;}
  .team-option{
    background:var(--bg-panel-2);border:1px solid var(--line);padding:14px 8px;
    text-align:center;cursor:pointer;color:var(--text);
    font-family:'Chakra Petch';font-weight:700;font-size:14px;letter-spacing:0.3px;
  }
  .team-option.selected{border-color:var(--crimson);background:#20141A;color:var(--crimson);}

  /* ---- coach select ---- */
  .coach-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;}
  .coach-option{
    background:var(--bg-panel-2);border:1px solid var(--line);padding:20px 8px;
    text-align:center;cursor:pointer;color:var(--text);
  }
  .coach-option .coach-name{font-family:'Chakra Petch';font-weight:700;font-size:15px;}
  .coach-option.selected{border-color:var(--crimson);background:#20141A;color:var(--crimson);}

  /* ---- roster slots ---- */
  .roster-strip{display:flex;gap:8px;margin-bottom:16px;}
  .slot{
    flex:1;min-width:0;height:64px;border:1px dashed var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'JetBrains Mono';font-size:8.5px;color:var(--muted);background:var(--bg-panel);
    text-align:center;padding:0 3px;letter-spacing:0.2px;text-transform:uppercase;
  }
  .slot.filled{border:1px solid var(--teal);background:#0E1F1B;color:var(--text);}
  .slot .slot-name{font-family:'Chakra Petch';font-size:12px;font-weight:600;text-align:center;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;}
  .slot .slot-role{color:var(--teal);margin-top:2px;}

  /* ---- draft candidate card ---- */
  .candidate{background:var(--bg-panel-2);border:1px solid var(--line);padding:20px;text-align:center;}
  .candidate-list{display:flex;flex-direction:column;gap:8px;}
  .candidate-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--bg-panel-2);border:1px solid var(--line);padding:12px 14px;
    cursor:pointer;color:var(--text);text-align:left;
  }
  .candidate-row:active{border-color:var(--crimson);}
  .candidate-row .cr-name{font-family:'Chakra Petch';font-weight:700;font-size:15px;}
  .candidate-row .cr-roles{color:var(--teal);font-family:'JetBrains Mono';font-size:10px;margin-top:2px;}
  .candidate-row .cr-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
  .candidate-row .cr-tag{
    background:var(--bg-panel);border:1px solid var(--line);color:var(--muted);
    font-family:'JetBrains Mono';font-size:9px;padding:2px 6px;text-transform:uppercase;
  }
  .candidate-row .cr-ovr{font-size:16px;color:var(--gold);flex:none;}
  .candidate-row.synergy-highlight, .candidate.synergy-highlight{border-color:var(--teal);background:#0E1F1B;}
  .cr-synergy{
    display:flex;align-items:center;gap:4px;margin-top:5px;
    font-family:'JetBrains Mono';font-size:9.5px;color:var(--teal);
  }
  .cand-name{font-family:'Chakra Petch';font-size:24px;font-weight:700;margin:2px 0;}
  .cand-meta{color:var(--muted);font-size:13px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .cand-meta .role-pill{color:var(--teal);border:1px solid var(--teal);border-radius:3px;padding:2px 7px;font-family:'JetBrains Mono';font-size:11px;}
  .tag-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 2px;}
  .tag-chip{
    background:var(--bg-panel);border:1px solid var(--line);color:var(--text);
    font-family:'JetBrains Mono';font-size:10px;padding:4px 8px;
    text-transform:uppercase;letter-spacing:0.3px;
  }
  .overall-badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);
    font-family:'Chakra Petch';font-size:20px;font-weight:700;margin:10px auto 4px;color:var(--gold);
  }
  .hidden-stats{color:var(--muted);font-size:13px;font-style:italic;padding:10px 0;}

  /* ---- pool counter ---- */
  .pool-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--muted);font-size:13px;font-family:'JetBrains Mono';}

  /* ---- match screen ---- */
  .vs-row{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;}
  .team-block{flex:1;min-width:0;text-align:center;}
  .team-name{font-family:'Chakra Petch';font-weight:700;font-size:15px;overflow-wrap:break-word;word-break:break-word;line-height:1.2;}
  .team-sub{color:var(--muted);font-size:11px;margin-top:2px;}
  .score{font-family:'Chakra Petch';font-size:44px;font-weight:700;letter-spacing:2px;}
  .score .sep{color:var(--muted);font-size:30px;margin:0 10px;}
  .vs-x{color:var(--muted);font-family:'JetBrains Mono';font-size:13px;padding:0 14px;}
  .round-log{
    font-family:'JetBrains Mono';font-size:11px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:4px;margin:16px 0;min-height:24px;
  }
  .round-log .r{width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:2px;font-size:10px;}
  .round-log .r.win{background:var(--crimson-dim);color:#fff;}
  .round-log .r.loss{background:#26313A;color:var(--muted);}

  /* ---- roster / KDA compare ---- */
  .roster-compare{display:flex;gap:10px;margin:16px 0;}
  .roster-col{flex:1;min-width:0;}
  .roster-col-title{
    font-family:'JetBrains Mono';font-size:10px;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;text-align:center;
    overflow-wrap:break-word;word-break:break-word;line-height:1.3;
  }
  .roster-player{
    display:flex;justify-content:space-between;align-items:baseline;gap:4px;
    padding:5px 0;border-bottom:1px solid var(--line);
  }
  .roster-player:last-child{border-bottom:none;}
  .roster-player .pname{
    font-family:'Chakra Petch';font-size:12px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .roster-player .pkda{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);flex:none;}

  .record-banner{
    background:linear-gradient(135deg, #241405, #1a0f04);
    border:1px solid var(--gold);color:var(--gold);
    font-family:'Chakra Petch';font-weight:600;font-size:13px;line-height:1.4;
    padding:12px 14px;margin:14px 0;text-align:center;
    box-shadow:0 0 16px rgba(232,184,75,0.25);
  }

  .result-banner{text-align:center;padding:14px 0;margin-bottom:6px;}
  .result-banner.win{color:var(--teal);}
  .result-banner.loss{color:var(--crimson);}
  .result-banner .label{font-family:'Chakra Petch';font-size:22px;font-weight:700;}


  /* ---- trophy screen ---- */
  .trophy-wrap{text-align:center;padding:20px 0;}
  .trophy-icon{font-size:64px;margin-bottom:6px;}
  .trophy-title{font-family:'Chakra Petch';font-size:28px;font-weight:700;color:var(--gold);margin:6px 0;}

  .final-roster{display:flex;flex-direction:column;gap:8px;margin:18px 0;}
  .fr-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg-panel-2);border:1px solid var(--line);padding:10px 14px;}
  .fr-item .n{font-family:'Chakra Petch';font-weight:600;font-size:14px;}
  .fr-item .r{color:var(--muted);font-size:12px;}
  .fr-item .o{font-family:'JetBrains Mono';color:var(--gold);}

  .mvp-card{
    background:linear-gradient(135deg, #241405, #1a0f04);
    border:1px solid var(--gold);padding:16px;text-align:center;margin:18px 0;
  }
  .mvp-card .mvp-eyebrow{font-family:'JetBrains Mono';font-size:10px;color:var(--gold);letter-spacing:1px;margin-bottom:6px;}
  .mvp-card .mvp-name{font-family:'Chakra Petch';font-size:20px;font-weight:700;color:#fff;}
  .mvp-card .mvp-role{color:var(--muted);font-size:12px;margin:2px 0 8px;}
  .mvp-card .mvp-kda{font-family:'JetBrains Mono';color:var(--gold);font-size:14px;}
  .mvp-tag{
    font-family:'JetBrains Mono';font-size:9px;color:var(--bg-deep);background:var(--gold);
    padding:2px 5px;margin-left:6px;border-radius:2px;letter-spacing:0.5px;vertical-align:middle;
  }

  /* ---- share buttons ---- */
  .share-row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .share-btn{
    display:flex;align-items:center;gap:7px;
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);
    font-family:'Chakra Petch';font-weight:600;font-size:13px;padding:10px 16px;
    cursor:pointer;
  }
  .share-btn:active{border-color:var(--crimson);}
  .share-btn svg{flex:none;}

  /* ---- journey / tournament path table ---- */
  .journey-table{margin:16px 0;border:1px solid var(--line);}
  .journey-row{
    display:flex;align-items:center;gap:8px;padding:9px 10px;
    border-bottom:1px solid var(--line);font-size:12px;
  }
  .journey-row:last-child{border-bottom:none;}
  .journey-row .jr-stage{flex:1.3;min-width:0;color:var(--muted);font-family:'JetBrains Mono';font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .journey-row .jr-opp{flex:1;min-width:0;font-family:'Chakra Petch';font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .journey-row .jr-score{flex:none;font-family:'JetBrains Mono';color:var(--text);}
  .journey-row .jr-result{flex:none;width:20px;text-align:center;font-family:'Chakra Petch';font-weight:700;font-size:12px;}
  .journey-row .jr-result.win{color:var(--teal);}
  .journey-row .jr-result.loss{color:var(--crimson);}

  .disclaimer{color:var(--muted);font-size:11px;line-height:1.5;margin-top:24px;text-align:center;}

  /* ---- rules screen ---- */
  .rules-btn-row{text-align:center;margin-top:10px;}
  .rules-link{
    background:none;border:none;color:var(--muted);font-family:'JetBrains Mono';
    font-size:11px;text-decoration:underline;letter-spacing:0.3px;cursor:pointer;padding:6px;
  }
  .rules-section{margin-bottom:22px;}
  .rules-section h3{
    font-family:'Chakra Petch';color:var(--crimson);font-size:15px;font-weight:700;
    margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);
    letter-spacing:0.3px;
  }
  .rules-section p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 8px;}
  .rules-section ul{color:var(--muted);font-size:13px;line-height:1.6;margin:6px 0;padding-left:20px;}
  .rules-section li{margin-bottom:5px;}
  .rules-section strong{color:var(--text);}
  .rules-good{color:var(--teal);font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.5px;margin:10px 0 4px;}
  .rules-bad{color:var(--crimson);font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.5px;margin:10px 0 4px;}

  /* ---- country flag (image + graceful text fallback if it fails to load) ---- */
  .flag-img{display:inline-block;vertical-align:middle;border-radius:1px;}
  .version-badge{
    position:fixed;bottom:6px;right:8px;
    font-family:'JetBrains Mono';font-size:9px;color:var(--muted);
    opacity:0.55;letter-spacing:0.3px;pointer-events:none;z-index:50;
  }
  .flag-fallback{
    display:none;vertical-align:middle;
    font-family:'JetBrains Mono';font-size:8.5px;font-weight:700;letter-spacing:0.3px;
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--muted);
    padding:1px 3px;border-radius:2px;line-height:1.3;
  }

  /* ---- campaign history ---- */
  .history-list{display:flex;flex-direction:column;gap:10px;}
  .history-item{background:var(--bg-panel-2);border:1px solid var(--line);padding:12px 14px;}
  .test-stats{background:var(--bg-panel-2);border:1px solid var(--line);padding:10px 14px;}
  .standings-table{background:var(--bg-panel-2);border:1px solid var(--line);}
  .standings-row{
    display:grid;grid-template-columns:28px 1fr 46px 56px 40px;align-items:center;gap:4px;
    padding:8px 10px;font-size:12px;border-bottom:1px solid var(--line);
  }
  .standings-row:last-child{border-bottom:none;}
  .standings-row.standings-header{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;}
  .standings-row.me{background:#20141A;}
  .standings-row.qualified .standings-pos{color:var(--teal);font-weight:700;}
  .standings-pos{font-family:'JetBrains Mono';}
  .standings-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Chakra Petch';font-weight:600;}
  .standings-pts{text-align:right;font-weight:700;}
  .standings-wl,.standings-rd{text-align:right;color:var(--muted);}
  .test-stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;gap:10px;}
  .test-stat-row:not(:last-child){border-bottom:1px solid var(--line);}
  .history-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .history-team{font-family:'Chakra Petch';font-weight:700;font-size:14px;}
  .history-date{color:var(--muted);font-size:10px;}
  .history-result{font-family:'Chakra Petch';font-weight:600;font-size:13px;margin-bottom:4px;}
  .history-meta{color:var(--muted);font-size:10.5px;}
  .footer-social{display:flex;justify-content:center;margin-top:20px;}
  .social-link{
    width:44px;height:44px;border-radius:11px;background:#0A0A0A;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#F5F5F5;
    text-decoration:none;transition:border-color .2s, transform .15s;cursor:pointer;
  }
  .social-link:hover{border-color:var(--crimson);transform:translateY(-1px);}
</style>
</head>
<body>
<div id="app"></div>
<div class="version-badge">Beta · 11/09/2026</div>

<script>
/* ---------------- DATA ---------------- */

// Pool de craques — ratings são estimativas de fã para fins de jogo, não estatísticas oficiais.
const POOL = [
  {name:"aspas", roles:["duelist"], overall:93, tags:["entry","mm","operator","clutch","campeao_mundial"]},
  {name:"Boostio", roles:["sentinel"], overall:86, tags:["igl","lurker","campeao_mundial"]},
  {name:"Shao", roles:["flex","initiator","controller","sentinel"], overall:86, tags:["utility","campeao_mundial","lurker"]},
  {name:"FNS", roles:["sentinel"], overall:92, tags:["igl","lurker","campeao_mundial"]},
  {name:"yay", roles:["flex","duelist","sentinel"], overall:93, tags:["operator","mm","clutch","campeao_mundial","lurker","entry","utility"]},
  {name:"Zellsis", roles:["flex","sentinel"], overall:88, tags:["igl","utility","campeao_mundial","lurker"]},
  {name:"Cryocells", roles:["flex","sentinel","duelist"], overall:90, tags:["mm","operator","clutch","campeao_mundial","lurker","entry","utility"]},
  {name:"Rb", roles:["flex","controller","initiator","duelist"], overall:92, tags:["clutch","utility","campeao_mundial","entry"]},
  {name:"BuZz", roles:["duelist"], overall:92, tags:["operator","entry","mm","clutch","campeao_mundial"]},
  {name:"MaKo", roles:["controller"], overall:91, tags:["utility","clutch","igl"]},
  {name:"Marved", roles:["controller"], overall:93, tags:["utility","clutch","campeao_mundial"]},
  {name:"zekken", roles:["duelist","flex"], overall:93, tags:["entry","mm","clutch","operator","campeao_mundial","utility"]},
  {name:"saadhak", roles:["flex","sentinel","initiator","controller"], overall:93, tags:["igl","utility","clutch","mm","campeao_mundial","lurker"]},
  {name:"xand", roles:["flex","duelist","initiator","sentinel"], overall:82, tags:["utility","igl","lurker","entry"]},
  {name:"heat", roles:["flex","duelist","sentinel"], overall:85, tags:["mm","clutch","lurker","entry","utility"]},

// Calcula a força de um time pra "Rumo à Ascensão": usa o elenco real + composição/química
// quando já pesquisamos esse time; senão cai pra força genérica (teamRegionRating).
// Monta o time completo (elenco+coach) de uma organização do Rumo à Ascensão — usa o elenco
// real se já tivermos pesquisado, senão monta um elenco genérico (sorteado do banco geral)
// só pra ter alguém pra calcular a força do time.
// Craques que já foram campeões Mundiais ou da Copa do Mundo NESSA campanha do Ascensão
// ganham um bônus de overall até o fim das 16 temporadas — representa o "peso" de já ter
// sido campeão. Não mexe no objeto original do banco (POOL), só numa cópia pro time atual.
// Campeão Regional dá um bônus menor que Campeão Mundial — quem ganhou os dois soma os dois.
const ASCENSAO_CHAMPION_BONUS = 3;
const ASCENSAO_REGIONAL_CHAMPION_BONUS = 1.5;
function ascensaoApplyChampionBonus(roster){
  const c = state.carreira;
  if(!c) return roster;
  const mundiais = new Set((c.campeoesMundiais||[]).map(n=>n.toLowerCase()));
  const regionais = new Set((c.campeoesRegionais||[]).map(n=>n.toLowerCase()));
  if(mundiais.size===0 && regionais.size===0) return roster;
  return roster.map(p=>{
    if(!p) return p;
    let bonus = 0;
    const nomeLower = p.name.toLowerCase();
    if(mundiais.has(nomeLower)) bonus += ASCENSAO_CHAMPION_BONUS;
    if(regionais.has(nomeLower)) bonus += ASCENSAO_REGIONAL_CHAMPION_BONUS;
    if(bonus>0) return {...p, overall: Math.min(99, p.overall + bonus)};
    return p;
  });
}
// Casamento bipartido genérico pra um subconjunto específico de funções (não precisa ser as
// 5 do SLOT_ORDER inteiro) — usado pra encaixar o personagem numa Seleção real ou elenco de org.
// Temporadas em que a Copa do Mundo acontece: a cada 3, a partir da 2ª (2,5,8,11,14...).
function isAscensaoWorldCupSeason(temporada){
  return temporada>=2 && (temporada-2)%3===0;
}
function assignRolesFrom(roles, players){
  const matchRole = {};
  function tryAssign(roleKey, visited){
    for(const p of players){
      if(!p.roles.includes(roleKey) || visited.has(p.name)) continue;
      visited.add(p.name);
      if(!(p.name in matchRole) || tryAssign(matchRole[p.name], visited)){
        matchRole[p.name] = roleKey;
        return true;
      }
    }
    return false;
  }
  const ok = roles.every(r=>tryAssign(r, new Set()));
  if(!ok) return null;
  return roles.map(r=>{
    const name = Object.keys(matchRole).find(n=>matchRole[n]===r);
    return players.find(p=>p.name===name);
  });
}
// Monta um roster de 5 encaixando o personagem numa das funções dele (a principal, se der,
// senão tenta as secundárias em ordem) — os outros 4 vêm do pool de craques reais passado.
// Quais qualidades são "essenciais" pra cada função — dão o bônus maior quando o craque tem.
const ASCENSAO_ESSENTIAL_QUALITIES = {
  duelist: ["entry","mm","clutch"],
  sentinel: ["lurker","mm","clutch"],
  controller: ["mm","clutch","utility"],
  initiator: ["utility","clutch"],
  flex: ["utility","clutch"],
};
// Qualidades "opcionais" — ajudam bem, mas não são essenciais (Operator no Duelista/Sentinela).
const ASCENSAO_OPTIONAL_QUALITIES = {
  duelist: ["operator"],
  sentinel: ["operator"],
};
// Funções em que o IGL ajuda mesmo não sendo "essencial" pra elas.
const ASCENSAO_IGL_GOOD_FUNCTIONS = ["initiator","flex","controller"];
// Funções em que o IGL não soma nada (nem ajuda nem atrapalha).
const ASCENSAO_IGL_NEUTRAL_FUNCTIONS = ["duelist","sentinel"];
// Calcula o overall do craque criado no Rumo à Ascensão — base 82. Cada qualidade soma um
// valor diferente dependendo se ela é essencial pra função escolhida ou não: essencial soma
// mais, opcional soma um pouco menos, mm sempre ajuda (mesmo fora da lista), IGL ajuda em
// Iniciador/Flex/Controlador mas não soma nada em Duelista/Sentinela — nenhuma qualidade
// nunca DIMINUI o overall, só ajuda mais, menos, ou nada.
function ascensaoCharacterOverall(){
  const c = state.carreira;
  let overall = 82;
  const essenciais = ASCENSAO_ESSENTIAL_QUALITIES[c.funcao] || [];
  const opcionais = ASCENSAO_OPTIONAL_QUALITIES[c.funcao] || [];
  c.qualidades.forEach(q=>{
    if(essenciais.includes(q)) overall += 3;
    else if(opcionais.includes(q)) overall += 2;
    else if(q==="mm") overall += 2;
    else if(q==="igl" && ASCENSAO_IGL_NEUTRAL_FUNCTIONS.includes(c.funcao)) overall += 0;
    else if(q==="igl" && ASCENSAO_IGL_GOOD_FUNCTIONS.includes(c.funcao)) overall += 2;
    else overall += 1;
  });
  overall += c.funcoesSecundarias.length * 1.5;
  return Math.min(93, Math.round(overall));
}
function buildTeamWithCharacter(realPlayers){
  const c = state.carreira;
  const characterRoles = [c.funcao, ...c.funcoesSecundarias];
  const characterOverall = ascensaoCharacterOverall();
  const characterPlayer = {name:c.nome, roles:characterRoles, overall:characterOverall, tags:c.qualidades, isCharacter:true, country:c.nacionalidade};
  for(const myRole of characterRoles){
    const remainingRoles = SLOT_ORDER.filter(rk=>rk!==myRole);
    const assigned = assignRolesFrom(remainingRoles, realPlayers);
    if(assigned){
      return SLOT_ORDER.map(rk=>{
        if(rk===myRole) return characterPlayer;
        return assigned[remainingRoles.indexOf(rk)];
      });
    }
  }
  return buildValidRoster(realPlayers); // não coube em nenhuma função — joga só com o time real
}
function buildAscensaoNationalTeam(){
  return ascensaoApplyChampionBonus(buildTeamWithCharacter(selecaoPlayerObjects(state.carreira.nacao)));

// Simula o "mercado de transferências" dos times adversários de uma região pra essa temporada
// — alguns times trocam um craque com outro time da região, tentando melhorar o elenco. Só
// mexe numa cópia local (não mexe no banco de dados de verdade, cada temporada é sorteada de
// novo). Retorna um mapa {nomeDoTime: [craques atualizados]} pra usar só nessa simulação.
// Igual o mercado de craques, só que pra técnicos: cada time só troca de HC se aparecer
// alguém melhor no mercado (usando o buff do técnico como "qualidade") — o técnico antigo só
// vira opção pros próximos times depois que o meu já foi substituído de verdade.
function simulateRegionalCoachTransfers(regiao, excludeOrg, transferenciasDeJogadores, usadosGlobalmenteCoach){
  const orgs = TEAM_REGIONS[regiao].filter(o=>o!==excludeOrg && ASCENSAO_TEAM_ROSTERS[o]);
  const coachCopies = {};
  orgs.forEach(org=>{ coachCopies[org] = ASCENSAO_TEAM_ROSTERS[org].coach; });
  function buffDe(nomeCoach){ return nomeCoach ? coachBuff(nomeCoach) : -1; }
  // Pontua um técnico candidato pra um time: o buff é a base, mas pesa também se o país dele
  // bate com a região do time (ou é vizinho), e sinergia com o elenco de jogadores do time.
  function pontuaCandidatoCoach(nomeCoach, orgAlvo){
    if(!nomeCoach) return -1;
    let pontos = buffDe(nomeCoach);
    const paisCoach = COACH_COUNTRY[nomeCoach.toLowerCase()];
    if(paisCoach){
      const regiaoDoPais = COUNTRY_TO_REGION[paisCoach];
      if(regiaoDoPais===regiao) pontos += 2;
      else if((ASCENSAO_REGION_PROXIMITY[regiao]||[]).includes(regiaoDoPais)) pontos += 1;
      const rosterDoTime = transferenciasDeJogadores && transferenciasDeJogadores[orgAlvo];
      if(rosterDoTime){
        const sinergia = rosterDoTime.filter(nomeJogador=>PLAYER_COUNTRY[nomeJogador.toLowerCase()]===paisCoach).length;
        pontos += sinergia;
      }
    }
    return pontos;
  }
  const RODADAS_DE_MERCADO = 3;
  for(let rodada=0; rodada<RODADAS_DE_MERCADO; rodada++){
    // Técnicos sem time (nunca escalados em nenhuma organização do jogo) também entram no
    // mercado como opção, igual os agentes livres de jogador.
    const jaEmAlgumTimeNoJogo = new Set(Object.values(ASCENSAO_TEAM_ROSTERS).filter(d=>d.coach).map(d=>d.coach.toLowerCase()));
    if(usadosGlobalmenteCoach) usadosGlobalmenteCoach.forEach(n=>jaEmAlgumTimeNoJogo.add(n.toLowerCase()));
    const agentesLivres = Object.keys(COACH_COUNTRY).filter(c=>!jaEmAlgumTimeNoJogo.has(c));
    // Todo time libera o próprio técnico ao mesmo tempo — o mercado já nasce com opção pra
    // todo time, sem depender de ninguém trocar primeiro.
    const meuOriginal = {};
    orgs.forEach(org=>{ meuOriginal[org] = coachCopies[org]; });
    let mercado = [...orgs.map(org=>meuOriginal[org]).filter(Boolean), ...agentesLivres];
    shuffle(orgs).forEach(org=>{
      const meuAntigo = meuOriginal[org];
      const opcoes = shuffle(mercado.filter(c=>c!==meuAntigo)).sort((a,b)=>pontuaCandidatoCoach(b,org)-pontuaCandidatoCoach(a,org));
      const contratado = opcoes.find(c=>pontuaCandidatoCoach(c,org) > pontuaCandidatoCoach(meuAntigo,org)) || null;
      if(contratado){
        coachCopies[org] = contratado;
        mercado = mercado.filter(c=>c!==contratado);
      } else if(mercado.includes(meuAntigo)){
        // ninguém levou meu técnico ainda — fica com o mesmo, sem risco.
        coachCopies[org] = meuAntigo;
        mercado = mercado.filter(c=>c!==meuAntigo);
      } else {
        // meu técnico original já foi levado por outro time antes de mim, e eu não achei
        // ninguém melhor — fico com quem sobrou no mercado (ou sem técnico, em último caso).
        const sobra = mercado[0] || null;
        coachCopies[org] = sobra;
        if(sobra) mercado = mercado.filter(c=>c!==sobra);
      }
    });
  }
  return coachCopies;
}
function simulateRegionalTransfers(regiao, excludeOrg, usadosGlobalmente){
  const orgs = TEAM_REGIONS[regiao].filter(o=>o!==excludeOrg && ASCENSAO_TEAM_ROSTERS[o]);
  const rosterCopies = {};
  orgs.forEach(org=>{ rosterCopies[org] = [...ASCENSAO_TEAM_ROSTERS[org].players]; });
  const roles = ["duelist","flex","initiator","controller","sentinel"];
  function overallDe(nome){
    if(!nome) return -1;

  }

  // com a região do time (ou é vizinho), e sinergia com quem já tá no elenco (mesmo país).
  function pontuaCandidato(nomeCandidato, restanteDoElenco){
    const p = POOL.find(x=>x.name.toLowerCase()===nomeCandidato.toLowerCase());
    let pontos = overallDe(nomeCandidato);
    if(!p) return pontos;
    const paisesCandidato = playerCountries(p.name);
    const regiaoDoPais = paisesCandidato.map(pc=>COUNTRY_TO_REGION[pc]).find(Boolean);
    if(regiaoDoPais===regiao) pontos += 2;
    else if((ASCENSAO_REGION_PROXIMITY[regiao]||[]).includes(regiaoDoPais)) pontos += 1;
    const sinergia = restanteDoElenco.filter(nomeColega=>{

    }).length;
    pontos += sinergia * 1.5;

  }
  // Agentes livres — craques do banco que hoje não estão escalados em nenhum time — também
  // entram no mercado como opção de contratação. Recalculado a cada rodada (ver abaixo) pra
  // não oferecer de novo quem já foi contratado numa rodada anterior dessa mesma simulação.
  // Roda o mercado várias rodadas na mesma temporada — cada time pode tentar melhorar mais de
  // uma posição do elenco, não só uma.
  const RODADAS_DE_MERCADO = 3;
  for(let rodada=0; rodada<RODADAS_DE_MERCADO; rodada++){
    const jaEmAlgumTimeAgora = new Set(Object.values(rosterCopies).flat().filter(Boolean).map(n=>n.toLowerCase()));
    if(usadosGlobalmente) usadosGlobalmente.forEach(n=>jaEmAlgumTimeAgora.add(n.toLowerCase()));
    // Agentes livres de verdade — craques do banco que não estão em NENHUM elenco fixo do jogo,
    // atribuídos a essa região pela nacionalidade deles (playerRegionKey não serve aqui, porque
    // ele só reconhece quem já tem time — por definição, um agente livre nunca teria região).
    const todosOsEscaladosNoJogo = new Set(Object.values(ASCENSAO_TEAM_ROSTERS).flatMap(d=>d.players.map(n=>n.toLowerCase())));
    const agentesLivresDaRegiao = POOL.filter(p=>{
      if(todosOsEscaladosNoJogo.has(p.name.toLowerCase())) return false;
      if(jaEmAlgumTimeAgora.has(p.name.toLowerCase())) return false;
      const pais = PLAYER_COUNTRY[p.name.toLowerCase()];
      return COUNTRY_TO_REGION[pais] === regiao;
    }).map(p=>p.name);
    // Passo 1: TODO time tira o craque mais fraco do próprio elenco ao mesmo tempo — fica uma
    // vaga temporária, e o craque vai pro mercado compartilhado (isso já resolve o "ninguém
    // consegue comprar primeiro porque o mercado começa vazio"). Agentes livres entram juntos.
    const vaga = {};
    let pool = [...agentesLivresDaRegiao];
    orgs.forEach(org=>{
      const elenco = rosterCopies[org].map((nome,idx)=>({nome, idx, overall:overallDe(nome)}));
      elenco.sort((a,b)=>a.overall-b.overall);
      vaga[org] = elenco[0];
      pool.push(elenco[0].nome);
      rosterCopies[org][vaga[org].idx] = null; // vaga temporária
    });
    // Passo 2: cada time (ordem aleatória) tenta contratar o MELHOR disponível no mercado
    // (de qualquer outro time ou agente livre), pesando nacionalidade/proximidade/sinergia.
    // Se não achar ninguém que sirva, o próprio craque volta pro time de origem.
    shuffle(orgs).forEach(org=>{
      const restanteDoElenco = rosterCopies[org].filter(Boolean);
      const opcoes = shuffle(pool.filter(n=>n!==vaga[org].nome)).sort((a,b)=>pontuaCandidato(b,restanteDoElenco)-pontuaCandidato(a,restanteDoElenco));
      let contratado = null;
      for(const candidato of opcoes){
        const tentativa = [...rosterCopies[org]];
        tentativa[vaga[org].idx] = candidato;
        const rosterObjs = tentativa.map(n=>n && POOL.find(p=>p.name.toLowerCase()===n.toLowerCase())).filter(Boolean);
        if(rosterObjs.length===5 && canCompleteRoster(roles, rosterObjs)){
          rosterCopies[org] = tentativa;
          contratado = candidato;
          break;
        }
      }
      if(contratado){
        pool = pool.filter(n=>n!==contratado);
      } else if(pool.includes(vaga[org].nome)){
        // ninguém comprou o meu craque liberado ainda — volta pro time de origem, sem risco.
        rosterCopies[org][vaga[org].idx] = vaga[org].nome;
        pool = pool.filter(n=>n!==vaga[org].nome);
      } else {
        // meu craque liberado JÁ foi comprado por outro time antes de mim, e eu não achei
        // ninguém no mercado que sirva — busco um reforço de emergência fora do mercado atual
        // (na região, excluindo quem já está escalado em qualquer time) pra não ficar com
        // buraco nem duplicar o craque que já foi embora de verdade.
        const jaEscalados = new Set(Object.values(rosterCopies).flat().filter(Boolean).map(n=>n.toLowerCase()));
        if(excludeOrg && ASCENSAO_TEAM_ROSTERS[excludeOrg]) ASCENSAO_TEAM_ROSTERS[excludeOrg].players.forEach(n=>jaEscalados.add(n.toLowerCase()));
        if(usadosGlobalmente) usadosGlobalmente.forEach(n=>jaEscalados.add(n.toLowerCase()));
        const emergencia = shuffle(POOL.filter(p=>!jaEscalados.has(p.name.toLowerCase())));
        for(const cand of emergencia){
          const tentativa = [...rosterCopies[org]];
          tentativa[vaga[org].idx] = cand.name;
          const rosterObjs = tentativa.map(n=>n && POOL.find(p=>p.name.toLowerCase()===n.toLowerCase())).filter(Boolean);
          if(rosterObjs.length===5 && canCompleteRoster(roles, rosterObjs)){
            rosterCopies[org] = tentativa;
            break;
          }
        }
      }
    });
  }
  return rosterCopies;
}

function chemistryBonus(roster, coachName){
  if(!roster || roster.length<2) return 0;
  const countryLists = roster.map(p=>playerCountries(p.name));
  const teamLists = roster.map(p=>PLAYER_TEAM[p.name.toLowerCase()] || []);
  function countExtraPairs(list){
    const counts = {};
    list.forEach(v=>{ counts[v]=(counts[v]||0)+1; });
    let extra = 0;
    Object.values(counts).forEach(n=>{ if(n>=2) extra += (n-1); }); // 2 juntos=+1, 3 juntos=+2, etc.
    return extra;
  }
  const countryPairs = countExtraPairs(countryLists.flat());
  const teamPairs = countExtraPairs(teamLists.flat());
  let coachBonus = 0;
  if(coachName){
    const ccList = [COACH_COUNTRY[coachName.toLowerCase()], COACH_RESIDENCE[coachName.toLowerCase()]].filter(Boolean);
    const ct = COACH_TEAM[coachName.toLowerCase()];
    if(ccList.length) coachBonus += roster.filter(p=>playerCountries(p.name).some(c=>ccList.includes(c))).length * 0.75;
    if(ct) coachBonus += roster.filter(p=>(PLAYER_TEAM[p.name.toLowerCase()]||[]).includes(ct)).length * 1.5;
  }
  return countryPairs*0.75 + teamPairs*1.5 + coachBonus; // já ter jogado junto pesa bem mais que só ser do mesmo país
}
// Técnico Campeão Mundial (está no COACH_TEAM) dá um bônus extra de +2, além do buff normal dele.
function coachBuff(coachName){
  let b = COACH_BUFFS[coachName] || 0;
  if(coachName && COACH_TEAM[coachName.toLowerCase()]) b += 2;
  if(state.difficulty==="ascensao" && state.carreira && coachName){
    const nomeLower = coachName.toLowerCase();
    if((state.carreira.campeoesMundiaisCoach||[]).some(n=>n.toLowerCase()===nomeLower)) b += ASCENSAO_CHAMPION_BONUS;
    if((state.carreira.campeoesRegionaisCoach||[]).some(n=>n.toLowerCase()===nomeLower)) b += ASCENSAO_REGIONAL_CHAMPION_BONUS;
  }
  return b;
}

// Resolve a bandeira certa de um craque — se for o personagem do Rumo à Ascensão, usa o país
// que ele escolheu na criação; senão, usa o país real do craque como sempre.
function playerFlag(p){
  if(p.isCharacter) return countryFlag(p.country);
  return countryFlag(PLAYER_COUNTRY[p.name.toLowerCase()]);
}
function countryFlag(code){
  if(!code) return "";
  const cc = code.toUpperCase();
  const svg = FLAG_SVG[cc];
  if(svg){
    return `<svg viewBox="0 0 30 20" width="16" height="11" class="flag-img" style="vertical-align:middle;border-radius:1px;">${svg}</svg>`;
  }
  return `<span class="flag-fallback" style="display:inline-block;">${cc}</span>`;
}

/* ---------------- COMPOSITION BUFFS/NERFS ---------------- */
// Acha o jogador que ocupa uma função no time. Se "isSlotted" (nosso próprio time, sempre
// organizado por SLOT_ORDER), usa a vaga exata; se não (times de IA, sem vaga fixa), pega o
// primeiro jogador do elenco que consegue jogar naquela função.
function findRolePlayer(roster, roleKey, isSlotted){
  if(!roster || !roster.length) return null;
  if(isSlotted){
    const idx = SLOT_ORDER.indexOf(roleKey);
    return roster[idx] || null;
  }
  return roster.find(p=>p.roles && p.roles.includes(roleKey)) || null;
}
function hasTag(p, tag){ return !!(p && p.tags && p.tags.includes(tag)); }

// Calcula o bônus/penalidade de composição do time, separado em ataque e defesa.
// Entry empurra mais no ataque; Operator empurra mais na defesa (conforme pedido).
function compositionBonus(roster, isSlotted){
  if(!roster || !roster.length) return {attack:0, defense:0};
  let attack = 0, defense = 0;

  const duelist = findRolePlayer(roster, "duelist", isSlotted);
  const sentinel = findRolePlayer(roster, "sentinel", isSlotted);
  const initiator = findRolePlayer(roster, "initiator", isSlotted);

  // Duelista + Iniciador na equipe -> buff de ataque
  if(duelist && initiator) attack += 2;

  // Duelista + Iniciador do MESMO país, ou que já foram campeões mundiais juntos (mesmo elenco
  // real) -> buff extra geral, em cima do buff normal de tê-los os dois no time.
  if(duelist && initiator){
    const dCountries = [PLAYER_COUNTRY[duelist.name.toLowerCase()], PLAYER_RESIDENCE[duelist.name.toLowerCase()]].filter(Boolean);
    const iCountries = [PLAYER_COUNTRY[initiator.name.toLowerCase()], PLAYER_RESIDENCE[initiator.name.toLowerCase()]].filter(Boolean);
    const sameCountry = dCountries.some(c=>iCountries.includes(c));
    const dTeams = PLAYER_TEAM[duelist.name.toLowerCase()] || [];
    const iTeams = PLAYER_TEAM[initiator.name.toLowerCase()] || [];
    const alreadyChampionsTogether = dTeams.some(tm=>iTeams.includes(tm));
    if(sameCountry || alreadyChampionsTogether){ attack += 2; defense += 2; }
    if(sameCountry && alreadyChampionsTogether){ attack += 1; defense += 1; } // os dois ao mesmo tempo: um pouco a mais
  }

  // Operator no Duelista/Sentinela: 1 usuário = buff na defesa; os 2 ao mesmo tempo = nerf geral
  const opUsers = [duelist, sentinel].filter(p=>hasTag(p,"operator")).length;
  if(opUsers===1) defense += 3;
  else if(opUsers===2){ attack -= 2; defense -= 2; }

  // 2+ jogadores com clutch = buff geral
  const clutchCount = roster.filter(p=>hasTag(p,"clutch")).length;
  if(clutchCount>=2){ attack += 2; defense += 2; }

  // IGL: nenhum = nerf sempre; mais de 1 = nerf, EXCETO em Seleções da Copa do Mundo (lá não pune)
  const iglCount = roster.filter(p=>hasTag(p,"igl")).length;
  const selecaoKey = rosterSelecaoKey(roster);
  if(iglCount===0){ attack -= 3; defense -= 3; }
  else if(iglCount>1 && !selecaoKey){ attack -= 2; defense -= 2; }

  // Seleção "mista" (combinada de vários países, tipo Finlândia/Suécia) leva um nerf leve —
  // o entrosamento de uma seleção de país único é sempre um pouco melhor.
  if(selecaoKey && selecaoKey.includes("/")){ attack -= 1.5; defense -= 1.5; }

  // Cobertura das 5 funções (no nosso sistema de vagas isso é sempre verdade, mas fica a checagem)
  if(isSlotted && SLOT_ORDER.some((rk,i)=>!roster[i])){ attack -= 4; defense -= 4; }

  // Campeões Mundiais: quanto mais, mais buff
  const championCount = roster.filter(p=>hasTag(p,"campeao_mundial")).length;
  attack += championCount*1.5; defense += championCount*1.5;

  // Entry no Duelista: buff se tiver, nerf se não tiver
  if(duelist){
    attack += hasTag(duelist,"entry") ? 2 : -2;
  }

  // Utilidade: quanto mais, melhor — buff cresce direto com a quantidade, sem teto e sem nerf.
  const utilCount = roster.filter(p=>hasTag(p,"utility")).length;
  if(utilCount>0){
    const bonus = utilCount*1.5;
    attack += bonus; defense += bonus;
  }

  // Lurker no Sentinela: buff se tiver, nerf se não tiver
  if(sentinel){
    if(hasTag(sentinel,"lurker")){ attack += 2; defense += 2; }
    else { attack -= 1.5; defense -= 1.5; }
  }
  // Exceção: C0M dá o buff de Lurker mesmo fora da Sentinela (não depende da função dele).
  const lurkerExceptionNames = ["c0m"];
  const lurkerException = roster.find(p=>p!==sentinel && lurkerExceptionNames.includes(p.name.toLowerCase()) && hasTag(p,"lurker"));
  if(lurkerException){ attack += 2; defense += 2; }

  // Mira Monstra: quanto mais jogadores com a tag, mais buff (sem teto)
  const mmCount = roster.filter(p=>hasTag(p,"mm")).length;
  attack += mmCount*1.5; defense += mmCount*1.5;

  return {attack, defense};
}

// Gera a tabela de turno e returno (todo mundo enfrenta todo mundo 2x) pelo método do círculo.
// Retorna uma lista de "rodadas", cada rodada é uma lista de confrontos [timeA, timeB].
function roundRobinSchedule(teams){
  let list = teams.slice();
  if(list.length % 2 !== 0) list.push(null); // bye fantasma se for ímpar
  const n = list.length;
  const turno = [];
  for(let r=0; r<n-1; r++){
    const rodada = [];
    for(let i=0; i<n/2; i++){
      const a = list[i], b = list[n-1-i];
      if(a && b) rodada.push([a,b]);
    }
    turno.push(rodada);
    list = [list[0], ...list.slice(2), list[1]];
  }
  return [...turno, ...turno]; // returno = repete a mesma tabela (turno e returno)
}
// Conta a rodada como "1, 2, 3..." só contando as rodadas em que o jogador realmente joga —
// ignora as rodadas de folga (que existem quando o grupo tem número ímpar de times).
function regionalPlayerRoundNumber(schedule, roundIdx){
  let atual = 0, total = 0;
  schedule.forEach((rodada, i)=>{
    const jogaNessaRodada = rodada.some(([a,b])=>a.isPlayer || b.isPlayer);
    if(jogaNessaRodada){
      total++;
      if(i<=roundIdx) atual = total;
    }
  });
  return {atual, total};
}

    rulesSections:[
      {title:"Team & Head Coach", body:`
        <p>You choose your team's name from 16 real organizations — the other 15 become your rivals at the World Championship. Then 4 coaches are drawn for you to pick one; the other 15 go to rival teams. Each coach grants a fixed (hidden) rating bonus — it applies to whichever team has that coach. Coaches who've already been <strong>World Champions</strong> add an extra bonus on top. World titles counted: <strong>Champions, Masters, and EWC</strong>.</p>
      `},
      {title:"The Draft", body:`
        <p>The team has 5 fixed slots: <strong>Duelist, Flex, Initiator, Controller, Sentinel</strong>. A pro can only fill a slot for a role they actually play — many play more than one.</p>
        <p>Each draw shows <strong>5 options</strong>, and it's smart about it: only pros with at least one matching open slot show up. You can skip the group of 5 at most <strong>2 times</strong> in the whole draft.</p>
      `},
      {title:"Tactical Qualities", body:`
        <ul>
          <li><strong>Monster Aim (MM):</strong> insane aim — more chance of monster games.</li>
          <li><strong>Entry:</strong> aggressive, opens the round — boosts attack, especially on the Duelist.</li>
          <li><strong>Operator:</strong> precision rifle specialist — boosts defense.</li>
          <li><strong>Clutch:</strong> closes out rounds under pressure.</li>
          <li><strong>IGL:</strong> the team's tactical brain.</li>
          <li><strong>Lurker:</strong> plays solo, flanks — important on the Sentinel.</li>
          <li><strong>Utility:</strong> ability usage.</li>
          <li><strong>World Champion:</strong> already lifted a trophy — experience that counts.</li>
        </ul>
      `},
      {title:"Team Synergies (buffs & nerfs)", body:`
        <p>Your roster's composition silently affects attack and defense every round — and the team switches sides every 12 rounds, just like a real map.</p>
        <div class="rules-good">✓ ADVANTAGES</div>
        <ul>
          <li>Duelist + Initiator on the team: attack buff.</li>
          <li>Duelist and Initiator from the same country, or already World Champions together: extra general buff (a bit more if both at once).</li>
          <li>Exactly 1 Operator user (Duelist or Sentinel): defense buff.</li>
          <li>2+ players with Clutch: general buff.</li>
          <li>World Champions on the roster: general buff, grows with each one.</li>
          <li>Duelist with Entry: attack buff.</li>
          <li>Players with Utility: general buff, grows with each one — no cap.</li>
          <li>Sentinel with Lurker: general buff.</li>
          <li>Players with Monster Aim: general buff, uncapped.</li>
        </ul>
        <div class="rules-bad">✗ DISADVANTAGES</div>
        <ul>
          <li>Duelist <em>and</em> Sentinel both using Operator: general nerf.</li>
          <li>No player with IGL: general nerf.</li>
          <li>More than 1 player with IGL: general nerf (doesn't apply to World Cup national teams).</li>
          <li>Duelist without Entry: attack nerf.</li>
          <li>Sentinel without Lurker: general nerf.</li>
        </ul>
      `},
      {title:"Roster Chemistry (country & real team)", body:`
        <p>On top of composition synergies, there's an extra silent bonus based on real vlr.gg data: pros from the <strong>same country</strong> get a small buff, and pros who <strong>became World Champions together</strong> — on the actual roster that lifted the trophy — get an even bigger buff. Your Head Coach counts too, if they coached one of those championship rosters.</p>
        <p>Important: this "played together" bonus doesn't apply to any two players who happened to pass through the same org at different times — it's specific to rosters that <strong>won a World Championship together</strong> (e.g. LOUD 2022, Evil Geniuses 2023). World titles counted: <strong>Champions, Masters, and EWC</strong>. Coverage of this database is partial and keeps growing over time.</p>
      `},
      {title:"World Championship Format", body:`
        <p>16 teams (you + 15 rivals) split into <strong>4 groups of 4</strong>. You face the other 3 in your group; the rest is resolved automatically. The <strong>Top 2</strong> from each group (8 teams) advance to the playoffs.</p>
        <p>The playoffs are <strong>double elimination</strong> (Upper/Lower Bracket): losing in Upper drops you to Lower (still alive); losing in Lower eliminates you. Every match is <strong>Bo3</strong>, except the Lower Bracket Final and the Grand Final, which are <strong>Bo5</strong>.</p>
        <p>Each map goes to <strong>13 rounds</strong> — but if it ties <strong>12-12</strong>, it goes to <strong>overtime</strong>: hitting 13 alone doesn't close the map, you need a <strong>2-round lead</strong> (13-12 isn't enough; it only ends at 14-12, or 15-13, and so on), just like the real game.</p>
      `},
      {title:"Real-World Records", body:`
        <p>There are 3 real pro-scene records: <strong>47 kills</strong> in a single map, <strong>82</strong> in a Bo3 series (both by aspas), and <strong>126</strong> in a Bo5 series (by marteen). Players with Monster Aim and 95+ overall have a rare shot at beating them in a monster game. The record "to beat" applies to both sides — your team or the opponent — and once broken, it becomes the new record <strong>for the rest of the campaign</strong> (even if the AI breaks it first). Everything resets to the real marks once the campaign ends.</p>
      `},
      {title:"Campaign MVP", body:`
        <p>Only shown if you become World Champion: the pro with the best score (kills + half the assists − deaths) added up across the whole campaign.</p>
      `},
      {title:"Classic Mode vs Wild Mode", body:`
        <p>In <strong>Classic</strong>, you see each pro's overall and tactical qualities during the draft. In <strong>Wild</strong>, all of that stays hidden — you recruit on name and reputation alone.</p>
      `},
      {title:"World Cup", body:`
        <p>Instead of picking an organization, you pick a <strong>national team</strong> — the draft only draws pros who play for that country (some national teams are combined from smaller countries, like Finland/Sweden). The Head Coach also comes only from that national team's own list.</p>
        <p>Everything else works like the normal mode: group stage, playoffs, all of it — except the other 15 rival "teams" are national teams too, each with their own real roster.</p>
        <p>World Cup-specific rule difference: the "more than 1 IGL" nerf doesn't apply here (a real national team having more than one tactical leader is normal).</p>
      `},
      {title:"Regional Mode", body:`
        <p>Pick a region (BR, NA, LAS, EMEA, APAC or CHN) and a real team from there — the draft only draws pros who actually play in that region. Bigger regions go through a group stage before playoffs; smaller ones go straight to the bracket.</p>
      `},
      {title:"Road to the Top", body:`
        <p>Create your own pro — role, tactical qualities, and nationality — and live a <strong>16-season</strong> career. Every year you compete in your Regional; qualifying also gets you into Worlds; and every few seasons, the World Cup with your country's national team.</p>
        <p>Between seasons, real teams make transfers among themselves, and you can also receive offers from other organizations.</p>
      `},
    ],
  },

function overall(p){ return p.overall; }
function teamOverall(roster){ return Math.round(roster.reduce((s,p)=>s+overall(p),0)/roster.length); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
// Ordem de sorteio do draft: dá um peso maior pra craques com overall 90+ aparecerem,
// sem tirar a aleatoriedade — só aumenta um pouco a chance.
function weightedDrawOrder(arr){
  function pickIdx(weights){
    const total = weights.reduce((s,w)=>s+Math.max(0.01,w),0);
    let r = Math.random()*total;
    for(let i=0;i<weights.length;i++){
      r -= Math.max(0.01,weights[i]);
      if(r<=0) return i;
    }
    return weights.length-1;
  }
  const remaining = [...arr];
  const order = [];
  while(remaining.length){
    const weights = remaining.map(p=>{
      let w = 1;
      if(p.overall>=90) w *= 0.55;
      if((p.tags||[]).includes("campeao_mundial")) w *= 0.55;
      return w;
    });
    const idx = pickIdx(weights);
    order.push(remaining.splice(idx,1)[0]);
  }
  return order.reverse(); // reverso pois o sorteio consome o array via pop() (do final)
}

/* ---------------- TOURNAMENT LOGIC ---------------- */
function decideWinner(teamA, teamB){
  const compA = compositionBonus(teamA.roster, false);
  const compB = compositionBonus(teamB.roster, false);
  const buffA = coachBuff(teamA.coach) + (compA.attack+compA.defense)/2 + chemistryBonus(teamA.roster, teamA.coach);
  const buffB = coachBuff(teamB.coach) + (compB.attack+compB.defense)/2 + chemistryBonus(teamB.roster, teamB.coach);
  const ratingA = teamA.rating + buffA*BUFF_DAMPING;
  const ratingB = teamB.rating + buffB*BUFF_DAMPING;
  const diff = ratingA - ratingB;
  const prob = Math.min(0.94, Math.max(0.06, 0.5 + diff/130));
  return Math.random() < prob ? teamA : teamB;
}

// Decide uma partida em melhor-de-N mapas (mapsToWin=2 → MD3, mapsToWin=3 → MD5).
// Registra o resultado de QUALQUER partida da temporada (não só as que o jogador jogou) —
// usado no Rumo à Ascensão pra saber o retrospecto real de cada time na temporada inteira.
function ascensaoTrackResult(winner, loser){
  if(state.difficulty!=="ascensao" || !state.carreira) return;
  if(!state.carreira.seasonResults) state.carreira.seasonResults = {};
  const sr = state.carreira.seasonResults;
  [[winner,"wins"],[loser,"losses"]].forEach(([team,campo])=>{
    if(!team || !team.name || team.isPlayer || team.isCharacter) return;
    if(!sr[team.name]) sr[team.name] = {wins:0, losses:0};
    sr[team.name][campo]++;
  });
}
function decideMatchWinner(teamA, teamB, mapsToWin){
  let wa=0, wb=0;
  while(wa<mapsToWin && wb<mapsToWin){
    if(decideWinner(teamA,teamB)===teamA) wa++; else wb++;
  }
  const result = wa>wb ? {winner:teamA, loser:teamB, scoreWinner:wa, scoreLoser:wb} : {winner:teamB, loser:teamA, scoreWinner:wb, scoreLoser:wa};
  ascensaoTrackResult(result.winner, result.loser);
  return result;
}
function matchFormatFor(labelKey){
  return (labelKey==="lbFinal" || labelKey==="grandFinal") ? 3 : 2;
}

// Gera um placar de rounds plausível pra um mapa decidido por simulação (sem jogar round a
// round de verdade) — quem venceu sempre fecha em 13, quem perdeu fica entre 0 e 10 (sem OT,
// pra manter simples). Usado só pra ter dado de "rounds" nos jogos que a IA decide sozinha.
function simulateMapRoundScore(aWon){
  const loserRounds = Math.floor(Math.random()*11); // 0 a 10
  return aWon ? {a:13, b:loserRounds} : {a:loserRounds, b:13};
}
// Igual ao decideMatchWinner, mas também soma o placar de rounds de cada mapa da série —
// usado na fase de grupos do modo Regional pra critério de desempate.
function decideMatchWinnerWithRounds(teamA, teamB, mapsToWin){
  let wa=0, wb=0, roundsA=0, roundsB=0;
  while(wa<mapsToWin && wb<mapsToWin){
    const aWon = decideWinner(teamA,teamB)===teamA;
    if(aWon) wa++; else wb++;
    const placar = simulateMapRoundScore(aWon);
    roundsA += placar.a; roundsB += placar.b;
  }
  const result = wa>wb ? {winner:teamA, loser:teamB, scoreWinner:wa, scoreLoser:wb} : {winner:teamB, loser:teamA, scoreWinner:wb, scoreLoser:wa};
  ascensaoTrackResult(result.winner, result.loser);
  return {...result, roundsA, roundsB};
}

// Converte a lista de nomes de uma Seleção em objetos de jogador de verdade (do POOL).
// Mapa reverso: nome do craque (minusculo) -> chave da Seleção dele. Usado pra saber, só olhando
// o elenco, se estamos no Modo Copa do Mundo e se a Seleção é "mista" (combinada de vários países).

Object.entries(WC_SELECOES).forEach(([key, data])=>{

});
// Dado um elenco, acha a Seleção dele (se for um time de Copa do Mundo) — null se não for.
function rosterSelecaoKey(roster){

  const p = roster.find(Boolean);
  if(!p) return null;

// Monta um elenco de IA cobrindo as 5 funções de verdade — tira jogadores do pool compartilhado
// (mutando o array recebido), preferindo sempre alguém que jogue aquela função.
// Casamento bipartido (algoritmo de Kuhn) — usado só no Modo Copa do Mundo, onde os elencos das
// Seleções são pequenos e um sorteio ingênuo pode travar (alguém que só serve pra 1 vaga já foi
// escalado em outra). Garante que sempre existe uma forma válida de fechar as 5 vagas.
function canCompleteRoster(openRoles, availablePlayers){
  const matchRole = {};
  function tryAssign(roleKey, visited){
    for(const p of availablePlayers){
      if(!p.roles.includes(roleKey) || visited.has(p.name)) continue;
      visited.add(p.name);
      if(!matchRole[p.name] || tryAssign(matchRole[p.name], visited)){
        matchRole[p.name] = roleKey;
        return true;
      }
    }
    return false;
  }
  return openRoles.every(r=>tryAssign(r, new Set()));
}
// Monta um elenco válido garantido (usa casamento bipartido) — para Seleções pequenas da Copa,
// em vez do preenchimento guloso simples usado no modo normal.
function buildValidRoster(players){
  const roster = [null,null,null,null,null];
  const matchRole = {}; // nome do jogador -> indice de slot que ele ocupa
  function tryAssign(slotIdx, visited){
    for(const p of players){
      if(!p.roles.includes(SLOT_ORDER[slotIdx]) || visited.has(p.name)) continue;
      visited.add(p.name);
      if(!(p.name in matchRole) || tryAssign(matchRole[p.name], visited)){
        matchRole[p.name] = slotIdx;
        return true;
      }
    }
    return false;
  }
  SLOT_ORDER.forEach((rk,i)=>tryAssign(i, new Set()));
  Object.entries(matchRole).forEach(([name, slotIdx])=>{
    roster[slotIdx] = players.find(p=>p.name===name);
  });
  return roster;
}

function buildAIRoster(sharedPool){
  const roster = [];
  SLOT_ORDER.forEach(roleKey=>{
    const idx = sharedPool.findIndex(p=>p.roles.includes(roleKey));
    if(idx!==-1) roster.push(sharedPool.splice(idx,1)[0]);
  });
  while(roster.length<5 && sharedPool.length){ roster.push(sharedPool.pop()); }
  return roster;
}

// Topologia do "mini-chaveamento suíço" de cada grupo (4 times: você + 3 da IA).
// m1/m2 = rodada 1; m3 = Upper (quem vence está classificado, 2-0); m4 = Lower (quem perde é
// eliminado, 0-2); m5 = decisão entre os dois times 1-1 — vencedor classifica, perdedor cai.
const GROUP_BRACKET_DEF = [
  {id:"m1", aFrom:{seed:0}, bFrom:{seed:1}, labelKey:"groupR1"},
  {id:"m2", aFrom:{seed:2}, bFrom:{seed:3}, labelKey:"groupR1"},
  {id:"m3", aFrom:{m:"m1",res:"w"}, bFrom:{m:"m2",res:"w"}, labelKey:"groupUpper"},
  {id:"m4", aFrom:{m:"m1",res:"l"}, bFrom:{m:"m2",res:"l"}, labelKey:"groupLower"},
  {id:"m5", aFrom:{m:"m3",res:"l"}, bFrom:{m:"m4",res:"w"}, labelKey:"groupDecider"},
];
const GROUP_QUALIFY_IDS = ["m3","m5"]; // vencer aqui classifica
const GROUP_ELIM_IDS = ["m4","m5"];    // perder aqui elimina (2ª derrota)

// Resolve o mini-chaveamento de um grupo 100% controlado pela IA (grupos B/C/D).
function buildGroupQualifiersAI(teams){
  const brk = { seeds: teams, matches: {} };
  GROUP_BRACKET_DEF.forEach(def=>{ brk.matches[def.id] = {winner:null, loser:null}; });
  GROUP_BRACKET_DEF.forEach(def=>{
    const teamA = resolveBracketTeam(def.aFrom, brk);
    const teamB = resolveBracketTeam(def.bFrom, brk);
    brk.matches[def.id] = decideMatchWinner(teamA, teamB, 2);
  });
  return [
    {...brk.matches.m3.winner, isGroupWinner:true},
    {...brk.matches.m5.winner, isGroupWinner:false},
  ];
}

function setupTournament(){
  if(state.difficulty==="regional"){ setupRegionalTournament(); return; }
  const playerTeam = {id:"player", isPlayer:true, rating: teamOverall(state.roster)};
  let pool;
  if(state.difficulty==="copa"){
    const rolesNeeded = ["duelist","flex","initiator","controller","sentinel"];
    const otherSelecoes = Object.keys(WC_SELECOES).filter(n=>n!==state.selecao && canCompleteRoster(rolesNeeded, selecaoPlayerObjects(n)));
    pool = shuffle(otherSelecoes.map((name,i)=>({id:"t"+i, name, rating:0})));
  } else {
    pool = shuffle(
      TEAM_NAMES.filter(tm=>tm.name!==state.teamName).map((tm,i)=>({id:"t"+i, name:tm.name, rating:tm.rating}))
    );
  }
  const groupATeams = [playerTeam, pool[0], pool[1], pool[2]];
  const rest = pool.slice(3);
  const groupB = rest.slice(0,4), groupC = rest.slice(4,8), groupD = rest.slice(8,12);
  const aiTeams = [...groupATeams.slice(1), ...groupB, ...groupC, ...groupD];

  if(state.difficulty==="copa"){
    // cada Seleção adversária monta o elenco só com os craques dela mesma, e o coach vem
    // da lista de técnicos daquela Seleção especificamente (não do sorteio do modo normal).
    aiTeams.forEach(tm=>{
      tm.roster = buildValidRoster(shuffle(selecaoPlayerObjects(tm.name)));
      tm.rating = teamOverall(tm.roster);
      const coaches = WC_SELECOES[tm.name].coaches;
      tm.coach = coaches[Math.floor(Math.random()*coaches.length)];
    });
  } else {
    // monta um elenco de 5 jogadores para cada equipe adversária — cobrindo as 5 funções
    // de verdade (igual um draft), em vez de um recorte aleatório do pool.
    const usedNames = new Set(state.roster.map(p=>p.name));
    const availablePlayers = shuffle(POOL.filter(p=>!usedNames.has(p.name)));
    aiTeams.forEach((tm,i)=>{
      tm.roster = buildAIRoster(availablePlayers);
      tm.coach = state.remainingCoaches[i] || null;
    });
  }

  const otherGroupsTop2 = {};
  [["B",groupB],["C",groupC],["D",groupD]].forEach(([letter, teams])=>{
    otherGroupsTop2[letter] = buildGroupQualifiersAI(teams);
  });

  const groupBracket = { seeds: groupATeams, matches: {}, pointerIdx: 0, pending: null };
  GROUP_BRACKET_DEF.forEach(def=>{ groupBracket.matches[def.id] = {winner:null, loser:null}; });

  state.tournament = {
    stage:"groups",
    playerTeam,
    groupATeams,
    groupBracket,
    otherGroupsTop2,
    bracket: null,
  };
  state.campaignStats = { us: state.roster.map((p,i)=>({name:p.name, role:SLOT_ORDER[i], isCharacter:p.isCharacter, country:p.country, k:0, d:0, a:0})) };
  state.campaignRecords = {singleMap:{kills:RECORDS.singleMap,holder:"aspas"}, md3:{kills:RECORDS.md3,holder:"aspas"}, md5:{kills:RECORDS.md5,holder:"marteen"}};
  state.journey = [];
  advanceGroupBracket();
}

// ===== Modo Regional: grupos de pontos corridos (turno e returno) + playoffs menores =====
function initRegionalStandings(teams){
  const st = {};
  teams.forEach(tm=>{ st[tm.id] = {team:tm, points:0, wins:0, losses:0, roundsWon:0, roundsLost:0}; });
  return st;
}
// Vitória = 2 pontos, derrota = 1 ponto (ninguém fica a zero). Desempate por saldo de rounds.
function registrarResultadoGrupoRegional(standings, teamA, teamB, resultado, roundsA, roundsB){
  const sA = standings[teamA.id], sB = standings[teamB.id];
  if(resultado.winner===teamA){ sA.points+=2; sA.wins++; sB.points+=1; sB.losses++; }
  else { sB.points+=2; sB.wins++; sA.points+=1; sA.losses++; }
  sA.roundsWon += roundsA; sA.roundsLost += roundsB;
  sB.roundsWon += roundsB; sB.roundsLost += roundsA;
}
function rankRegionalGroup(standings){
  return Object.values(standings).sort((a,b)=>
    b.points - a.points || (b.roundsWon-b.roundsLost) - (a.roundsWon-a.roundsLost) || b.team.rating-a.team.rating
  );
}

// Monta e começa a fase Regional AO VIVO do Rumo à Ascensão — o jogador joga cada partida.
function setupAscensaoRegionalStage(){
  const c = state.carreira;
  const regiao = c.regiao;
  const format = REGIONAL_FORMAT[regiao];
  state.difficulty = "ascensao";
  // simula o mercado da região inteira ANTES, incluindo o time do próprio jogador — craques
  // bons recebem ofertas de fora mesmo em time campeão, então ninguém fica de fora do mercado.
  const transferencias = simulateRegionalTransfers(regiao, null);
  const transferenciasCoach = simulateRegionalCoachTransfers(regiao, null, transferencias);
  const playerOrgTeam = buildAscensaoOrgTeam(c.time, true, transferencias[c.time], transferenciasCoach[c.time]);
  playerOrgTeam.isPlayer = true;
  state.roster = playerOrgTeam.roster;
  state.teamName = c.time;
  state.headCoach = playerOrgTeam.coach;
  const otherOrgs = TEAM_REGIONS[regiao].filter(t=>t!==c.time);
  const aiTeams = otherOrgs.map(org=>buildAscensaoOrgTeam(org, false, transferencias[org], transferenciasCoach[org]));

  state.campaignStats = { us: state.roster.map((p,i)=>({name:p.name, role:SLOT_ORDER[i], isCharacter:p.isCharacter, country:p.country, k:0, d:0, a:0})) };
  // os recordes só voltam ao valor real na temporada 1 (carreira nova) — depois disso, ficam
  // valendo o que foi quebrado durante a campanha, até o fim das 16 temporadas.
  if(c.temporada===1 || !state.campaignRecords){
    state.campaignRecords = {singleMap:{kills:RECORDS.singleMap,holder:"aspas"}, md3:{kills:RECORDS.md3,holder:"aspas"}, md5:{kills:RECORDS.md5,holder:"marteen"}};
  }
  state.journey = [];
  state.journeyStageStart = 0;
  state.screen = "match";

  if(format.groups===0){
    const seeds = shuffle([playerOrgTeam, ...aiTeams]);
    state.tournament = {stage:"groups_skip", playerTeam:playerOrgTeam, regionalFormat:format, ascensaoPhase:"regional", ascensaoRegionalTransferSnapshot: transferencias, ascensaoRegionalCoachSnapshot: transferenciasCoach};
    buildPlayoffBracketSeeded(seeds, FOUR_TEAM_BRACKET_DEF);
    advanceTournament();
    return;
  }

  const allTeams = shuffle([playerOrgTeam, ...aiTeams]);
  const groupA = allTeams.slice(0, format.groupSize);
  const groupB = allTeams.slice(format.groupSize, format.groupSize*2);
  const myGroupLetter = groupA.some(tm=>tm.isPlayer) ? "A" : "B";
  const myGroup = myGroupLetter==="A" ? groupA : groupB;
  const otherGroup = myGroupLetter==="A" ? groupB : groupA;

  state.tournament = {
    stage: "regionalGroups",
    playerTeam: playerOrgTeam,
    regionalFormat: format,
    myGroupLetter,
    ascensaoPhase: "regional",
    ascensaoRegionalTransferSnapshot: transferencias,
    ascensaoRegionalCoachSnapshot: transferenciasCoach,
    regionalGroups: {
      myGroup: { teams: myGroup, schedule: roundRobinSchedule(myGroup), roundIdx:0, matchIdxInRound:0, standings: initRegionalStandings(myGroup), pending:null },
      otherGroup: { teams: otherGroup },
    },
    bracket: null,
  };
  advanceRegionalGroups();
}
function setupRegionalTournament(){
  const regiao = state.regionalRegiao;
  const format = REGIONAL_FORMAT[regiao];
  const playerTeam = {id:"player", isPlayer:true, name:state.teamName, roster:state.roster, coach:state.headCoach, rating: teamOverall(state.roster)};
  const otherOrgs = TEAM_REGIONS[regiao].filter(t=>t!==state.teamName);
  // adversários também fazem "draft" — sorteia um elenco cobrindo as 5 funções a partir do
  // pool da região (igual ao Clássico/Selva), em vez de usar o elenco real fixo.
  const usedNames = new Set(state.roster.map(p=>p.name));
  const availablePlayers = shuffle(regionalPlayerObjects(regiao).filter(p=>!usedNames.has(p.name)));
  const aiTeams = otherOrgs.map((orgName,i)=>{
    const roster = buildAIRoster(availablePlayers);
    return {id:orgName, name:orgName, roster, rating:teamOverall(roster), coach: state.remainingCoaches[i] || null};
  });

  state.campaignStats = { us: state.roster.map((p,i)=>({name:p.name, role:SLOT_ORDER[i], isCharacter:p.isCharacter, country:p.country, k:0, d:0, a:0})) };
  state.campaignRecords = {singleMap:{kills:RECORDS.singleMap,holder:"aspas"}, md3:{kills:RECORDS.md3,holder:"aspas"}, md5:{kills:RECORDS.md5,holder:"marteen"}};
  state.journey = [];

  if(format.groups===0){
    // APAC/CHN: só 4 times na região inteira — vai direto pro chaveamento, sem fase de grupos.
    const seeds = shuffle([playerTeam, ...aiTeams]);
    state.tournament = {stage:"groups_skip", playerTeam, regionalFormat:format};
    buildPlayoffBracketSeeded(seeds, FOUR_TEAM_BRACKET_DEF);
    advanceTournament();
    return;
  }

  const allTeams = shuffle([playerTeam, ...aiTeams]);
  const groupA = allTeams.slice(0, format.groupSize);
  const groupB = allTeams.slice(format.groupSize, format.groupSize*2);
  const myGroupLetter = groupA.some(tm=>tm.isPlayer) ? "A" : "B";
  const myGroup = myGroupLetter==="A" ? groupA : groupB;
  const otherGroup = myGroupLetter==="A" ? groupB : groupA;

  state.tournament = {
    stage: "regionalGroups",
    playerTeam,
    regionalFormat: format,
    myGroupLetter,
    regionalGroups: {
      myGroup: { teams: myGroup, schedule: roundRobinSchedule(myGroup), roundIdx:0, matchIdxInRound:0, standings: initRegionalStandings(myGroup), pending:null, totalRounds: roundRobinSchedule(myGroup).length },
      otherGroup: { teams: otherGroup },
    },
    bracket: null,
  };
  advanceRegionalGroups();
}

// Processa a tabela de turno e returno do grupo do jogador — resolve na hora os confrontos
// que não envolvem ele, e pausa pra jogar quando chega a vez dele.
function advanceRegionalGroups(){
  const tr = state.tournament;
  if(tr.stage!=="regionalGroups") return;
  const g = tr.regionalGroups.myGroup;
  g.pending = null;
  while(g.roundIdx < g.schedule.length){
    const rodada = g.schedule[g.roundIdx];
    while(g.matchIdxInRound < rodada.length){
      const [teamA, teamB] = rodada[g.matchIdxInRound];
      if(teamA.isPlayer || teamB.isPlayer){
        g.pending = {teamA, teamB, roundIdx:g.roundIdx};
        startMatch(2); // fase de grupos regional é sempre MD3
        return;
      }
      const resultado = decideMatchWinnerWithRounds(teamA, teamB, 2);
      registrarResultadoGrupoRegional(g.standings, teamA, teamB, resultado, resultado.roundsA, resultado.roundsB);
      g.matchIdxInRound++;
    }
    g.roundIdx++;
    g.matchIdxInRound = 0;
  }
  finishRegionalGroupsAndAdvance();
}

// Fecha a fase de grupos: resolve o outro grupo inteiro (só IA), calcula a classificação dos
// dois grupos por pontos, e para na tela de tabela — os playoffs só começam quando o
// jogador confirmar (botão "Continuar").
function finishRegionalGroupsAndAdvance(){
  const tr = state.tournament;
  const myG = tr.regionalGroups.myGroup;
  const otherG = tr.regionalGroups.otherGroup;

  const otherStandings = initRegionalStandings(otherG.teams);
  roundRobinSchedule(otherG.teams).forEach(rodada=>{
    rodada.forEach(([teamA, teamB])=>{
      const resultado = decideMatchWinnerWithRounds(teamA, teamB, 2);
      registrarResultadoGrupoRegional(otherStandings, teamA, teamB, resultado, resultado.roundsA, resultado.roundsB);
    });
  });

  const myRanked = rankRegionalGroup(myG.standings);
  const otherRanked = rankRegionalGroup(otherStandings);
  tr.regionalGroups.myGroup.finalRanking = myRanked;
  tr.regionalGroups.otherGroup.finalRanking = otherRanked;
  tr.stage = "regionalStandings";
}

// Chamado quando o jogador clica em "Continuar" na tela de classificação — só agora de fato
// monta os playoffs (ou encerra a campanha, se o jogador não se classificou).
function confirmRegionalStandings(){
  const tr = state.tournament;
  const myRanked = tr.regionalGroups.myGroup.finalRanking;
  const otherRanked = tr.regionalGroups.otherGroup.finalRanking;
  const n = tr.regionalFormat.qualifiersPerGroup;
  const myQualifiers = myRanked.slice(0,n).map(s=>s.team);
  const otherQualifiers = otherRanked.slice(0,n).map(s=>s.team);

  if(!myQualifiers.some(tm=>tm.isPlayer)){
    ascensaoOrFinalize({type:"groups"});
    return;
  }

  // seed cruzado: 1º de cada grupo, depois 2º de cada grupo, depois 3º de cada grupo...
  const seeds = [];
  for(let i=0;i<n;i++){
    seeds.push(myQualifiers[i]);
    if(otherQualifiers[i]) seeds.push(otherQualifiers[i]);
  }
  const bracketDef = tr.regionalFormat.playoffSize===8 ? BRACKET_DEF : tr.regionalFormat.playoffSize===6 ? SIX_TEAM_BRACKET_DEF : FOUR_TEAM_BRACKET_DEF;
  buildPlayoffBracketSeeded(seeds, bracketDef);
  advanceTournament();
}

// Verifica se o craque já jogou (mesmo time real, vlr.gg) com alguém já escalado no time,
// ou se já foi treinado pelo Head Coach escolhido — vale mesmo no primeiro sorteio.
function teammateSynergyNote(candidate){
  const ct = PLAYER_TEAM[candidate.name.toLowerCase()] || [];
  if(ct.length===0) return null;
  const names = state.roster.filter(Boolean).filter(p=>{
    const pt = PLAYER_TEAM[p.name.toLowerCase()] || [];
    return pt.some(t=>ct.includes(t));
  }).map(p=>p.name);
  if(state.headCoach){
    const coachTeam = COACH_TEAM[state.headCoach.toLowerCase()];
    if(coachTeam && ct.includes(coachTeam)) names.push(state.headCoach);
  }
  if(names.length===0) return null;
  return names.join(", ");
}

function currentOpponent(){
  const tr = state.tournament;
  if(!tr) return null;
  if(tr.stage==="regionalGroups" && tr.regionalGroups.myGroup.pending){
    const p = tr.regionalGroups.myGroup.pending;
    return p.teamA.isPlayer ? p.teamB : p.teamA;
  }
  if(tr.stage==="groups" && tr.groupBracket && tr.groupBracket.pending){
    const p = tr.groupBracket.pending;
    return p.teamA.isPlayer ? p.teamB : p.teamA;
  }
  if(tr.stage==="playoffs" && tr.bracket && tr.bracket.pending){
    const p = tr.bracket.pending;
    return p.teamA.isPlayer ? p.teamB : p.teamA;
  }
  return null;
}

// No Rumo à Ascensão, mostra "Temporada X · Competição · " antes do resto do cabeçalho,
// pra saber sempre em que competição e temporada você está durante a partida ao vivo.
function ascensaoContextPrefix(){
  if(state.difficulty!=="ascensao" || !state.tournament || !state.carreira) return "";
  const fase = state.tournament.ascensaoPhase;
  const nomeCompeticao = fase==="regional" ? t("ascensaoRegionalLabel")
    : fase==="mundial" ? t("ascensaoMundialLabel")
    : fase==="worldcup" ? t("ascensaoWorldCupLabel")
    : "";
  return `${t("ascensaoSeasonLabel")(state.carreira.temporada)} · ${nomeCompeticao} · `;
}
function contextLabel(){
  const tr = state.tournament;
  if(!tr) return "";
  const prefix = ascensaoContextPrefix();
  if(tr.stage==="regionalGroups"){
    const g = tr.regionalGroups.myGroup;
    const roundLabel = g.pending ? t("regionalRoundLabel")(regionalPlayerRoundNumber(g.schedule, g.pending.roundIdx).atual, regionalPlayerRoundNumber(g.schedule, g.pending.roundIdx).total) : "";
    return `${prefix}${t("groupStageTag")} · ${t("groupWord")} ${tr.myGroupLetter}${roundLabel ? " · "+roundLabel : ""}`;
  }
  if(tr.stage==="groups"){
    const roundLabel = tr.groupBracket && tr.groupBracket.pending ? bracketLabel(tr.groupBracket.pending.def.labelKey) : "";
    return `${prefix}${t("groupStageTag")} · ${t("groupWord")} A${roundLabel ? " · "+roundLabel : ""}`;
  }
  if(tr.stage==="playoffs" && tr.bracket && tr.bracket.pending){
    return `${prefix}${t("playoffsTag")} · ${bracketLabel(tr.bracket.pending.def.labelKey)}`;
  }
  return `${prefix}${t("playoffsTag")}`;
}

function resolveBracketTeam(fromDef, bracket){
  if(fromDef.seed!==undefined) return bracket.seeds[fromDef.seed];
  const m = bracket.matches[fromDef.m];
  return fromDef.res==="w" ? m.winner : m.loser;
}

// Os qualifiers chegam intercalados por grupo: [Aupper,Alower,Bupper,Blower,Cupper,Clower,...].
// Mantendo essa ordem de grupo (em vez de reordenar tudo por rating), o BRACKET_DEF garante
// que upper sempre enfrenta lower de OUTRO grupo na primeira rodada — nunca uma repetição do
// mesmo grupo que já se enfrentou na fase de grupos.
function buildPlayoffBracket(qualifiers, bracketDef){
  const def = bracketDef || BRACKET_DEF;
  const uppers = qualifiers.filter((q,i)=>i%2===0);
  const lowers = qualifiers.filter((q,i)=>i%2===1);
  const seeds = [...uppers, ...lowers];
  const matches = {};
  def.forEach(d=>{ matches[d.id] = {winner:null, loser:null}; });
  state.tournament.bracket = { seeds, matches, pointerIdx:0, pending:null, def };
  state.tournament.stage = "playoffs";
}

// Igual ao buildPlayoffBracket, mas recebe os seeds já na ordem final (usado no modo Regional,
// onde a ordem de classificação já vem dos grupos de pontos corridos, não de winner/runnerup).
function buildPlayoffBracketSeeded(seeds, bracketDef){
  const matches = {};
  bracketDef.forEach(d=>{ matches[d.id] = {winner:null, loser:null}; });
  state.tournament.bracket = { seeds, matches, pointerIdx:0, pending:null, def:bracketDef };
  state.tournament.stage = "playoffs";
}

// Processa o mini-chaveamento do grupo automaticamente até chegar numa partida do jogador.
function advanceGroupBracket(){
  const tr = state.tournament;
  if(tr.stage!=="groups") return;
  const brk = tr.groupBracket;
  brk.pending = null;
  while(brk.pointerIdx < GROUP_BRACKET_DEF.length){
    const def = GROUP_BRACKET_DEF[brk.pointerIdx];
    const teamA = resolveBracketTeam(def.aFrom, brk);
    const teamB = resolveBracketTeam(def.bFrom, brk);
    if(teamA.isPlayer || teamB.isPlayer){
      brk.pending = {def, teamA, teamB};
      startMatch(2); // fase de grupos é sempre MD3
      return;
    }
    brk.matches[def.id] = decideMatchWinner(teamA, teamB, 2);
    brk.pointerIdx++;
  }
}
// Termina de resolver (só IA) o que sobrou do mini-chaveamento do grupo, sem pausar.
function finishGroupBracketAI(){
  const brk = state.tournament.groupBracket;
  while(brk.pointerIdx < GROUP_BRACKET_DEF.length){
    const def = GROUP_BRACKET_DEF[brk.pointerIdx];
    const teamA = resolveBracketTeam(def.aFrom, brk);
    const teamB = resolveBracketTeam(def.bFrom, brk);
    brk.matches[def.id] = decideMatchWinner(teamA, teamB, 2);
    brk.pointerIdx++;
  }
}

// Processa partidas automaticamente até chegar numa partida do jogador, ou até o torneio terminar.
function advanceTournament(){
  const tr = state.tournament;
  if(tr.stage!=="playoffs") return;
  const brk = tr.bracket;
  const def = brk.def || BRACKET_DEF;
  brk.pending = null;
  while(brk.pointerIdx < def.length){
    const d = def[brk.pointerIdx];
    const teamA = resolveBracketTeam(d.aFrom, brk);
    const teamB = resolveBracketTeam(d.bFrom, brk);
    if(teamA.isPlayer || teamB.isPlayer){
      brk.pending = {def:d, teamA, teamB};
      startMatch(matchFormatFor(d.labelKey));
      return;
    }
    const {winner, loser} = decideMatchWinner(teamA, teamB, matchFormatFor(d.labelKey));
    brk.matches[d.id] = {winner, loser};
    brk.pointerIdx++;
  }
  // chaveamento concluído sem mais partidas do jogador pendentes
  const finalMatch = brk.matches[def[def.length-1].id];
  ascensaoOrFinalize(finalMatch.winner.isPlayer ? {type:"champion"} : {type:"runnerup"});
}
