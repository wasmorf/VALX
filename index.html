function overall(p){ return p.overall; }
function teamOverall(roster){ return Math.round(roster.reduce((s,p)=>s+overall(p),0)/roster.length); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
// Ordem de sorteio do draft: dá um peso maior pra craques com overall 90+ aparecerem,
// sem tirar a aleatoriedade — só aumenta um pouco a chance.
function weightedDrawOrder(arr){
  function pickIdx(weights){
    const total = weights.reduce((s,w)=>s+Math.max(0.01,w),0);
    let r = Math.random()*total;
    for(let i=0;i<weights.length;i++){
      r -= Math.max(0.01,weights[i]);
      if(r<=0) return i;
    }
    return weights.length-1;
  }
  const remaining = [...arr];
  const order = [];
  while(remaining.length){
    const weights = remaining.map(p=>{
      let w = 1;
      if(p.overall>=90) w *= 0.55;
      if((p.tags||[]).includes("campeao_mundial")) w *= 0.55;
      return w;
    });
    const idx = pickIdx(weights);
    order.push(remaining.splice(idx,1)[0]);
  }
  return order.reverse(); // reverso pois o sorteio consome o array via pop() (do final)
}

/* ---------------- TOURNAMENT LOGIC ---------------- */
function decideWinner(teamA, teamB){
  const compA = compositionBonus(teamA.roster, false);
  const compB = compositionBonus(teamB.roster, false);
  const buffA = coachBuff(teamA.coach) + (compA.attack+compA.defense)/2 + chemistryBonus(teamA.roster, teamA.coach);
  const buffB = coachBuff(teamB.coach) + (compB.attack+compB.defense)/2 + chemistryBonus(teamB.roster, teamB.coach);
  const ratingA = teamA.rating + buffA*BUFF_DAMPING;
  const ratingB = teamB.rating + buffB*BUFF_DAMPING;
  const diff = ratingA - ratingB;
  const prob = Math.min(0.94, Math.max(0.06, 0.5 + diff/130));
  return Math.random() < prob ? teamA : teamB;
}

// Decide uma partida em melhor-de-N mapas (mapsToWin=2 → MD3, mapsToWin=3 → MD5).
// Registra o resultado de QUALQUER partida da temporada (não só as que o jogador jogou) —
// usado no Rumo à Ascensão pra saber o retrospecto real de cada time na temporada inteira.
function ascensaoTrackResult(winner, loser){
  if(state.difficulty!=="ascensao" || !state.carreira) return;
  if(!state.carreira.seasonResults) state.carreira.seasonResults = {};
  const sr = state.carreira.seasonResults;
  [[winner,"wins"],[loser,"losses"]].forEach(([team,campo])=>{
    if(!team || !team.name || team.isPlayer || team.isCharacter) return;
    if(!sr[team.name]) sr[team.name] = {wins:0, losses:0};
    sr[team.name][campo]++;
  });
}
function decideMatchWinner(teamA, teamB, mapsToWin){
  let wa=0, wb=0;
  while(wa<mapsToWin && wb<mapsToWin){
    if(decideWinner(teamA,teamB)===teamA) wa++; else wb++;
  }
  const result = wa>wb ? {winner:teamA, loser:teamB, scoreWinner:wa, scoreLoser:wb} : {winner:teamB, loser:teamA, scoreWinner:wb, scoreLoser:wa};
  ascensaoTrackResult(result.winner, result.loser);
  return result;
}
function matchFormatFor(labelKey){
  return (labelKey==="lbFinal" || labelKey==="grandFinal") ? 3 : 2;
}

// Gera um placar de rounds plausível pra um mapa decidido por simulação (sem jogar round a
// round de verdade) — quem venceu sempre fecha em 13, quem perdeu fica entre 0 e 10 (sem OT,
// pra manter simples). Usado só pra ter dado de "rounds" nos jogos que a IA decide sozinha.
function simulateMapRoundScore(aWon){
  const loserRounds = Math.floor(Math.random()*11); // 0 a 10
  return aWon ? {a:13, b:loserRounds} : {a:loserRounds, b:13};
}
// Igual ao decideMatchWinner, mas também soma o placar de rounds de cada mapa da série —
// usado na fase de grupos do modo Regional pra critério de desempate.
function decideMatchWinnerWithRounds(teamA, teamB, mapsToWin){
  let wa=0, wb=0, roundsA=0, roundsB=0;
  while(wa<mapsToWin && wb<mapsToWin){
    const aWon = decideWinner(teamA,teamB)===teamA;
    if(aWon) wa++; else wb++;
    const placar = simulateMapRoundScore(aWon);
    roundsA += placar.a; roundsB += placar.b;
  }
  const result = wa>wb ? {winner:teamA, loser:teamB, scoreWinner:wa, scoreLoser:wb} : {winner:teamB, loser:teamA, scoreWinner:wb, scoreLoser:wa};
  ascensaoTrackResult(result.winner, result.loser);
  return {...result, roundsA, roundsB};
}

// Converte a lista de nomes de uma Seleção em objetos de jogador de verdade (do POOL).
// Mapa reverso: nome do craque (minusculo) -> chave da Seleção dele. Usado pra saber, só olhando
// o elenco, se estamos no Modo Copa do Mundo e se a Seleção é "mista" (combinada de vários países).
const PLAYER_TO_SELECAO_KEY = {};
Object.entries(WC_SELECOES).forEach(([key, data])=>{
  data.players.forEach(n=>{ PLAYER_TO_SELECAO_KEY[n.toLowerCase()] = key; });
});
// Dado um elenco, acha a Seleção dele (se for um time de Copa do Mundo) — null se não for.
function rosterSelecaoKey(roster){
  if(!roster || !roster.length) return null;
  const p = roster.find(Boolean);
  if(!p) return null;
  return PLAYER_TO_SELECAO_KEY[p.name.toLowerCase()] || null;
}

// Seleções que têm craque de sobra (10+ opções) só liberam quem tem overall 87+ pra defender
// o país — assim o elenco fica mais competitivo, sem esvaziar Seleções menores que precisam
// de todo mundo disponível pra fechar um time completo.
const WC_SELECAO_OVERALL_RESTRICTED = new Set(["United States","South Korea","Brazil","Canada"]);
function selecaoPlayerObjects(selecaoName){
  const names = new Set(WC_SELECOES[selecaoName].players.map(n=>n.toLowerCase()));
  let jogadores = POOL.filter(p=>names.has(p.name.toLowerCase()));
  if(WC_SELECAO_OVERALL_RESTRICTED.has(selecaoName)) jogadores = jogadores.filter(p=>p.overall>=87);
  return jogadores;
}

// Modo Regional: descobre a região de um craque pelo TIME REAL dele no Rumo à Ascensão
// (não pela nacionalidade) — usado pra restringir o draft do modo Regional.
function playerRegionKey(playerName){
  const nameLower = playerName.toLowerCase();
  for(const [time, dados] of Object.entries(ASCENSAO_TEAM_ROSTERS)){
    if(dados.players.some(p=>p && p.toLowerCase()===nameLower)){
      for(const [regiao, times] of Object.entries(TEAM_REGIONS)){
        if(times.includes(time)) return regiao;
      }
    }
  }
  return null;
}
// Região de um craque (pra fins de mercado/agente livre) — prioriza país de RESIDÊNCIA sobre
// nacionalidade quando os dois existem, já que quem mora em outro país tende a competir por lá.
function freeAgentRegion(nomeMinusculo){
  const residencia = PLAYER_RESIDENCE[nomeMinusculo];
  if(residencia && COUNTRY_TO_REGION[residencia]) return COUNTRY_TO_REGION[residencia];
  return COUNTRY_TO_REGION[PLAYER_COUNTRY[nomeMinusculo]];
}
function regionalPlayerObjects(regiao){
  return POOL.filter(p=>{
    const regiaoDoTime = playerRegionKey(p.name);
    if(regiaoDoTime){
      if(regiaoDoTime===regiao) return true;
      // BR e LAS são vizinhos: um craque de nacionalidade BR jogando num time do LAS (ou
      // vice-versa) também pode ser sorteado no draft da região da sua própria nacionalidade.
      if((regiao==="BR" && regiaoDoTime==="LAS") || (regiao==="LAS" && regiaoDoTime==="BR")){
        const pais = PLAYER_COUNTRY[p.name.toLowerCase()];
        if(COUNTRY_TO_REGION[pais]===regiao) return true;
      }
      return false;
    }
    // sem time nenhum (ex: saiu de um elenco e não foi realocado) — conta pela nacionalidade,
    // senão a região perde opções toda vez que alguém tira um craque de um time sem repor.
    if(ASCENSAO_EXCLUDED_PLAYERS.has(p.name.toLowerCase())) return false;
    return freeAgentRegion(p.name.toLowerCase()) === regiao;
  });
}
// Mesma lógica, mas pros técnicos: só entram no sorteio do modo Regional os HC cujo time
// de verdade (no Rumo à Ascensão) está naquela região.
function coachRegionKey(coachName){
  const nameLower = coachName.toLowerCase();
  for(const [time, dados] of Object.entries(ASCENSAO_TEAM_ROSTERS)){
    if(dados.coach && dados.coach.toLowerCase()===nameLower){
      for(const [regiao, times] of Object.entries(TEAM_REGIONS)){
        if(times.includes(time)) return regiao;
      }
    }
  }
  return null;
}
function regionalCoachObjects(regiao){
  return COACHES.filter(c=>coachRegionKey(c)===regiao);
}

// Monta um elenco de IA cobrindo as 5 funções de verdade — tira jogadores do pool compartilhado
// (mutando o array recebido), preferindo sempre alguém que jogue aquela função.
// Casamento bipartido (algoritmo de Kuhn) — usado só no Modo Copa do Mundo, onde os elencos das
// Seleções são pequenos e um sorteio ingênuo pode travar (alguém que só serve pra 1 vaga já foi
// escalado em outra). Garante que sempre existe uma forma válida de fechar as 5 vagas.
function canCompleteRoster(openRoles, availablePlayers){
  const matchRole = {};
  function tryAssign(roleKey, visited){
    for(const p of availablePlayers){
      if(!p.roles.includes(roleKey) || visited.has(p.name)) continue;
      visited.add(p.name);
      if(!matchRole[p.name] || tryAssign(matchRole[p.name], visited)){
        matchRole[p.name] = roleKey;
        return true;
      }
    }
    return false;
  }
  return openRoles.every(r=>tryAssign(r, new Set()));
}
// Monta um elenco válido garantido (usa casamento bipartido) — para Seleções pequenas da Copa,
// em vez do preenchimento guloso simples usado no modo normal.
function buildValidRoster(players){
  const roster = [null,null,null,null,null];
  const matchRole = {}; // nome do jogador -> indice de slot que ele ocupa
  function tryAssign(slotIdx, visited){
    for(const p of players){
      if(!p.roles.includes(SLOT_ORDER[slotIdx]) || visited.has(p.name)) continue;
      visited.add(p.name);
      if(!(p.name in matchRole) || tryAssign(matchRole[p.name], visited)){
        matchRole[p.name] = slotIdx;
        return true;
      }
    }
    return false;
  }
  SLOT_ORDER.forEach((rk,i)=>tryAssign(i, new Set()));
  Object.entries(matchRole).forEach(([name, slotIdx])=>{
    roster[slotIdx] = players.find(p=>p.name===name);
  });
  return roster;
}
// Pontua um craque considerando não só o overall dele, mas a sinergia com o resto do grupo de
// candidatos — craques que jogaram no mesmo time de verdade juntos, ou que têm país em comum
// (incluindo país de residência), pontuam mais alto, já que tendem a fechar um time mais coeso.
function scoreComSinergia(jogador, pool){
  let pontos = jogador.overall;
  const timesDoJogador = PLAYER_TEAM[jogador.name.toLowerCase()] || [];
  const paisesDoJogador = playerCountries(jogador.name);
  pool.forEach(outro=>{
    if(outro.name===jogador.name) return;
    const timesDoOutro = PLAYER_TEAM[outro.name.toLowerCase()] || [];
    if(timesDoJogador.some(t=>timesDoOutro.includes(t))) pontos += 0.75;
    const paisesDoOutro = playerCountries(outro.name);
    if(paisesDoJogador.some(p=>paisesDoOutro.includes(p))) pontos += 0.3;
  });
  return pontos;
}
// Igual buildValidRoster, mas ordena os craques por overall + sinergia antes de montar — assim
// o casamento de funções sempre prioriza o craque mais forte E mais encaixado no grupo
// disponível pra cada posição, montando o melhor time possível em vez de qualquer combinação
// válida.
function buildBestRoster(players){
  const pontuados = players.map(p=>({p, score: scoreComSinergia(p, players)}));
  pontuados.sort((a,b)=>b.score-a.score);
  return buildValidRoster(pontuados.map(x=>x.p));
}

function buildAIRoster(sharedPool){
  // Ordena por overall + sinergia antes de casar as funções — assim o time da IA sempre monta
  // a MELHOR combinação possível com quem sobrou no pool, não só a primeira que encaixar.
  const ordenados = [...sharedPool].sort((a,b)=>scoreComSinergia(b,sharedPool)-scoreComSinergia(a,sharedPool));
  const roster = buildValidRoster(ordenados);
  if(roster.every(Boolean)){
    roster.forEach(p=>{
      const idx = sharedPool.findIndex(x=>x.name===p.name);
      if(idx!==-1) sharedPool.splice(idx,1);
    });
    return roster;
  }
  // sobra insuficiente pra fechar as 5 funções — fallback pro método antigo (pega o que der)
  const fallback = [];
  SLOT_ORDER.forEach(roleKey=>{
    const idx = sharedPool.findIndex(p=>p.roles.includes(roleKey));
    if(idx!==-1) fallback.push(sharedPool.splice(idx,1)[0]);
  });
  while(fallback.length<5 && sharedPool.length){ fallback.push(sharedPool.pop()); }
  return fallback;
}

// Topologia do "mini-chaveamento suíço" de cada grupo (4 times: você + 3 da IA).
// m1/m2 = rodada 1; m3 = Upper (quem vence está classificado, 2-0); m4 = Lower (quem perde é
// eliminado, 0-2); m5 = decisão entre os dois times 1-1 — vencedor classifica, perdedor cai.
const GROUP_BRACKET_DEF = [
  {id:"m1", aFrom:{seed:0}, bFrom:{seed:1}, labelKey:"groupR1"},
  {id:"m2", aFrom:{seed:2}, bFrom:{seed:3}, labelKey:"groupR1"},
  {id:"m3", aFrom:{m:"m1",res:"w"}, bFrom:{m:"m2",res:"w"}, labelKey:"groupUpper"},
  {id:"m4", aFrom:{m:"m1",res:"l"}, bFrom:{m:"m2",res:"l"}, labelKey:"groupLower"},
  {id:"m5", aFrom:{m:"m3",res:"l"}, bFrom:{m:"m4",res:"w"}, labelKey:"groupDecider"},
];
const GROUP_QUALIFY_IDS = ["m3","m5"]; // vencer aqui classifica
const GROUP_ELIM_IDS = ["m4","m5"];    // perder aqui elimina (2ª derrota)

// Resolve o mini-chaveamento de um grupo 100% controlado pela IA (grupos B/C/D).
function buildGroupQualifiersAI(teams){
  const brk = { seeds: teams, matches: {} };
  GROUP_BRACKET_DEF.forEach(def=>{ brk.matches[def.id] = {winner:null, loser:null}; });
  GROUP_BRACKET_DEF.forEach(def=>{
    const teamA = resolveBracketTeam(def.aFrom, brk);
    const teamB = resolveBracketTeam(def.bFrom, brk);
    brk.matches[def.id] = decideMatchWinner(teamA, teamB, 2);
  });
  return [
    {...brk.matches.m3.winner, isGroupWinner:true},
    {...brk.matches.m5.winner, isGroupWinner:false},
  ];
}

function setupTournament(){
  if(state.difficulty==="regional"){ setupRegionalTournament(); return; }
  const playerTeam = {id:"player", isPlayer:true, rating: teamOverall(state.roster)};
  let pool;
  if(state.difficulty==="copa"){
    const rolesNeeded = ["duelist","flex","initiator","controller","sentinel"];
    const otherSelecoes = Object.keys(WC_SELECOES).filter(n=>n!==state.selecao && canCompleteRoster(rolesNeeded, selecaoPlayerObjects(n)));
    pool = shuffle(otherSelecoes.map((name,i)=>({id:"t"+i, name, rating:0})));
  } else {
    pool = shuffle(
      TEAM_NAMES.filter(tm=>tm.name!==state.teamName).map((tm,i)=>({id:"t"+i, name:tm.name, rating:tm.rating}))
    );
  }
  const groupATeams = [playerTeam, pool[0], pool[1], pool[2]];
  const rest = pool.slice(3);
  const groupB = rest.slice(0,4), groupC = rest.slice(4,8), groupD = rest.slice(8,12);
  const aiTeams = [...groupATeams.slice(1), ...groupB, ...groupC, ...groupD];

  if(state.difficulty==="copa"){
    // cada Seleção adversária monta o elenco só com os craques dela mesma, e o coach vem
    // da lista de técnicos daquela Seleção especificamente (não do sorteio do modo normal).
    aiTeams.forEach(tm=>{
      tm.roster = buildValidRoster(shuffle(selecaoPlayerObjects(tm.name)));
      tm.rating = teamOverall(tm.roster);
      const coaches = WC_SELECOES[tm.name].coaches;
      tm.coach = coaches[Math.floor(Math.random()*coaches.length)];
    });
  } else {
    // monta um elenco de 5 jogadores para cada equipe adversária — cobrindo as 5 funções
    // de verdade (igual um draft), em vez de um recorte aleatório do pool.
    const usedNames = new Set(state.roster.map(p=>p.name));
    const availablePlayers = shuffle(POOL.filter(p=>!usedNames.has(p.name)));
    aiTeams.forEach((tm,i)=>{
      tm.roster = buildAIRoster(availablePlayers);
      tm.coach = state.remainingCoaches[i] || null;
    });
  }

  const otherGroupsTop2 = {};
  [["B",groupB],["C",groupC],["D",groupD]].forEach(([letter, teams])=>{
    otherGroupsTop2[letter] = buildGroupQualifiersAI(teams);
  });

  const groupBracket = { seeds: groupATeams, matches: {}, pointerIdx: 0, pending: null };
  GROUP_BRACKET_DEF.forEach(def=>{ groupBracket.matches[def.id] = {winner:null, loser:null}; });

  state.tournament = {
    stage:"groups",
    playerTeam,
    groupATeams,
    groupBracket,
    otherGroupsTop2,
    bracket: null,
  };
  state.campaignStats = { us: state.roster.map((p,i)=>({name:p.name, role:SLOT_ORDER[i], isCharacter:p.isCharacter, country:p.country, k:0, d:0, a:0})) };
  state.campaignRecords = {singleMap:{kills:RECORDS.singleMap,holder:"aspas"}, md3:{kills:RECORDS.md3,holder:"aspas"}, md5:{kills:RECORDS.md5,holder:"marteen"}};
  state.journey = [];
  advanceGroupBracket();
}

// ===== Modo Regional: grupos de pontos corridos (turno e returno) + playoffs menores =====
function initRegionalStandings(teams){
  const st = {};
  teams.forEach(tm=>{ st[tm.id] = {team:tm, points:0, wins:0, losses:0, roundsWon:0, roundsLost:0}; });
  return st;
}
// Vitória = 2 pontos, derrota = 1 ponto (ninguém fica a zero). Desempate por saldo de rounds.
function registrarResultadoGrupoRegional(standings, teamA, teamB, resultado, roundsA, roundsB){
  const sA = standings[teamA.id], sB = standings[teamB.id];
  if(resultado.winner===teamA){ sA.points+=2; sA.wins++; sB.points+=1; sB.losses++; }
  else { sB.points+=2; sB.wins++; sA.points+=1; sA.losses++; }
  sA.roundsWon += roundsA; sA.roundsLost += roundsB;
  sB.roundsWon += roundsB; sB.roundsLost += roundsA;
}
function rankRegionalGroup(standings){
  return Object.values(standings).sort((a,b)=>
    b.points - a.points || (b.roundsWon-b.roundsLost) - (a.roundsWon-a.roundsLost) || b.team.rating-a.team.rating
  );
}

// Monta e começa a fase Regional AO VIVO do Rumo à Ascensão — o jogador joga cada partida.
function setupAscensaoRegionalStage(precomputado){
  const c = state.carreira;
  const regiao = c.regiao;
  const format = REGIONAL_FORMAT[regiao];
  state.difficulty = "ascensao";
  let transferencias, transferenciasCoach;
  if(precomputado){
    transferencias = precomputado.transferencias;
    transferenciasCoach = precomputado.transferenciasCoach;
  } else {
    // simula o mercado da região inteira ANTES, incluindo o time do próprio jogador — craques
    // bons recebem ofertas de fora mesmo em time campeão, então ninguém fica de fora do mercado.
    transferencias = simulateRegionalTransfers(regiao, null);
    transferenciasCoach = simulateRegionalCoachTransfers(regiao, null, transferencias);
    // salva o resultado dessa temporada no snapshot da carreira — a próxima temporada continua
    // dessas escalações, em vez de recalcular sempre a partir do banco original do zero.
    TEAM_REGIONS[regiao].forEach(org=>{
      if(transferencias[org]) c.orgRostersSnapshot[org] = {players: transferencias[org], coach: transferenciasCoach[org] || c.orgRostersSnapshot[org].coach};
    });
    ascensaoDedupeSnapshot(c.orgRostersSnapshot, TEAM_REGIONS[regiao]);
    // Antes de fechar o time, verifica se essa contratação nova deixaria melhor jogar em outra
    // das funções escolhidas — se sim, pergunta antes de continuar, em vez de trocar sozinho.
    const realPlayersDoMeuTime = (transferencias[c.time]||[]).map(n=>POOL.find(p=>p.name.toLowerCase()===n.toLowerCase())).filter(Boolean);
    const oportunidade = ascensaoCheckRoleSwitchOpportunity(realPlayersDoMeuTime);
    if(oportunidade){
      c.pendingRoleSwitchData = {transferencias, transferenciasCoach, novaFuncao: oportunidade.funcao};
      state.screen = "ascensaoRoleSwitch";
      return;
    }
  }
  const playerOrgTeam = buildAscensaoOrgTeam(c.time, true, transferencias[c.time], transferenciasCoach[c.time]);
  playerOrgTeam.isPlayer = true;
  state.roster = playerOrgTeam.roster;
  state.teamName = c.time;
  state.headCoach = playerOrgTeam.coach;
  const otherOrgs = TEAM_REGIONS[regiao].filter(t=>t!==c.time);
  const aiTeams = otherOrgs.map(org=>buildAscensaoOrgTeam(org, false, transferencias[org], transferenciasCoach[org]));

  state.campaignStats = { us: state.roster.map((p,i)=>({name:p.name, role:SLOT_ORDER[i], isCharacter:p.isCharacter, country:p.country, k:0, d:0, a:0})) };
  // os recordes só voltam ao valor real na temporada 1 (carreira nova) — depois disso, ficam
  // valendo o que foi quebrado durante a campanha, até o fim das 16 temporadas.
  if(c.temporada===1 || !state.campaignRecords){
    state.campaignRecords = {singleMap:{kills:RECORDS.singleMap,holder:"aspas"}, md3:{kills:RECORDS.md3,holder:"aspas"}, md5:{kills:RECORDS.md5,holder:"marteen"}};
  }
  state.journey = [];
  state.journeyStageStart = 0;
  state.screen = "match";

  if(format.groups===0){
    const seeds = shuffle([playerOrgTeam, ...aiTeams]);
    state.tournament = {stage:"groups_skip", playerTeam:playerOrgTeam, regionalFormat:format, ascensaoPhase:"regional", ascensaoRegionalTransferSnapshot: transferencias, ascensaoRegionalCoachSnapshot: transferenciasCoach};
    buildPlayoffBracketSeeded(seeds, FOUR_TEAM_BRACKET_DEF);
    advanceTournament();
    return;
  }

  const allTeams = shuffle([playerOrgTeam, ...aiTeams]);
  const groupA = allTeams.slice(0, format.groupSize);
  const groupB = allTeams.slice(format.groupSize, format.groupSize*2);
  const myGroupLetter = groupA.some(tm=>tm.isPlayer) ? "A" : "B";
  const myGroup = myGroupLetter==="A" ? groupA : groupB;
  const otherGroup = myGroupLetter==="A" ? groupB : groupA;

  state.tournament = {
    stage: "regionalGroups",
    playerTeam: playerOrgTeam,
    regionalFormat: format,
    myGroupLetter,
    ascensaoPhase: "regional",
    ascensaoRegionalTransferSnapshot: transferencias,
    ascensaoRegionalCoachSnapshot: transferenciasCoach,
    regionalGroups: {
      myGroup: { teams: myGroup, schedule: roundRobinSchedule(myGroup), roundIdx:0, matchIdxInRound:0, standings: initRegionalStandings(myGroup), pending:null },
      otherGroup: { teams: otherGroup },
    },
    bracket: null,
  };
  advanceRegionalGroups();
}
function setupRegionalTournament(){
  const regiao = state.regionalRegiao;
  const format = REGIONAL_FORMAT[regiao];
  const playerTeam = {id:"player", isPlayer:true, name:state.teamName, roster:state.roster, coach:state.headCoach, rating: teamOverall(state.roster)};
  const otherOrgs = TEAM_REGIONS[regiao].filter(t=>t!==state.teamName);
  // adversários também fazem "draft" — sorteia um elenco cobrindo as 5 funções a partir do
  // pool da região (igual ao Clássico/Selva), em vez de usar o elenco real fixo.
  const usedNames = new Set(state.roster.map(p=>p.name));
  const availablePlayers = shuffle(regionalPlayerObjects(regiao).filter(p=>!usedNames.has(p.name)));
  const aiTeams = otherOrgs.map((orgName,i)=>{
    const roster = buildAIRoster(availablePlayers);
    return {id:orgName, name:orgName, roster, rating:teamOverall(roster), coach: state.remainingCoaches[i] || null};
  });

  state.campaignStats = { us: state.roster.map((p,i)=>({name:p.name, role:SLOT_ORDER[i], isCharacter:p.isCharacter, country:p.country, k:0, d:0, a:0})) };
  state.campaignRecords = {singleMap:{kills:RECORDS.singleMap,holder:"aspas"}, md3:{kills:RECORDS.md3,holder:"aspas"}, md5:{kills:RECORDS.md5,holder:"marteen"}};
  state.journey = [];

  if(format.groups===0){
    // APAC/CHN: só 4 times na região inteira — vai direto pro chaveamento, sem fase de grupos.
    const seeds = shuffle([playerTeam, ...aiTeams]);
    state.tournament = {stage:"groups_skip", playerTeam, regionalFormat:format};
    buildPlayoffBracketSeeded(seeds, FOUR_TEAM_BRACKET_DEF);
    advanceTournament();
    return;
  }

  const allTeams = shuffle([playerTeam, ...aiTeams]);
  const groupA = allTeams.slice(0, format.groupSize);
  const groupB = allTeams.slice(format.groupSize, format.groupSize*2);
  const myGroupLetter = groupA.some(tm=>tm.isPlayer) ? "A" : "B";
  const myGroup = myGroupLetter==="A" ? groupA : groupB;
  const otherGroup = myGroupLetter==="A" ? groupB : groupA;

  state.tournament = {
    stage: "regionalGroups",
    playerTeam,
    regionalFormat: format,
    myGroupLetter,
    regionalGroups: {
      myGroup: { teams: myGroup, schedule: roundRobinSchedule(myGroup), roundIdx:0, matchIdxInRound:0, standings: initRegionalStandings(myGroup), pending:null, totalRounds: roundRobinSchedule(myGroup).length },
      otherGroup: { teams: otherGroup },
    },
    bracket: null,
  };
  advanceRegionalGroups();
}

// Processa a tabela de turno e returno do grupo do jogador — resolve na hora os confrontos
// que não envolvem ele, e pausa pra jogar quando chega a vez dele.
function advanceRegionalGroups(){
  const tr = state.tournament;
  if(tr.stage!=="regionalGroups") return;
  const g = tr.regionalGroups.myGroup;
  g.pending = null;
  while(g.roundIdx < g.schedule.length){
    const rodada = g.schedule[g.roundIdx];
    while(g.matchIdxInRound < rodada.length){
      const [teamA, teamB] = rodada[g.matchIdxInRound];
      if(teamA.isPlayer || teamB.isPlayer){
        g.pending = {teamA, teamB, roundIdx:g.roundIdx};
        startMatch(2); // fase de grupos regional é sempre MD3
        return;
      }
      const resultado = decideMatchWinnerWithRounds(teamA, teamB, 2);
      registrarResultadoGrupoRegional(g.standings, teamA, teamB, resultado, resultado.roundsA, resultado.roundsB);
      g.matchIdxInRound++;
    }
    g.roundIdx++;
    g.matchIdxInRound = 0;
  }
  finishRegionalGroupsAndAdvance();
}

// Fecha a fase de grupos: resolve o outro grupo inteiro (só IA), calcula a classificação dos
// dois grupos por pontos, e para na tela de tabela — os playoffs só começam quando o
// jogador confirmar (botão "Continuar").
function finishRegionalGroupsAndAdvance(){
  const tr = state.tournament;
  const myG = tr.regionalGroups.myGroup;
  const otherG = tr.regionalGroups.otherGroup;

  const otherStandings = initRegionalStandings(otherG.teams);
  roundRobinSchedule(otherG.teams).forEach(rodada=>{
    rodada.forEach(([teamA, teamB])=>{
      const resultado = decideMatchWinnerWithRounds(teamA, teamB, 2);
      registrarResultadoGrupoRegional(otherStandings, teamA, teamB, resultado, resultado.roundsA, resultado.roundsB);
    });
  });

  const myRanked = rankRegionalGroup(myG.standings);
  const otherRanked = rankRegionalGroup(otherStandings);
  tr.regionalGroups.myGroup.finalRanking = myRanked;
  tr.regionalGroups.otherGroup.finalRanking = otherRanked;
  tr.stage = "regionalStandings";
}

// Chamado quando o jogador clica em "Continuar" na tela de classificação — só agora de fato
// monta os playoffs (ou encerra a campanha, se o jogador não se classificou).
function confirmRegionalStandings(){
  const tr = state.tournament;
  const myRanked = tr.regionalGroups.myGroup.finalRanking;
  const otherRanked = tr.regionalGroups.otherGroup.finalRanking;
  const n = tr.regionalFormat.qualifiersPerGroup;
  const myQualifiers = myRanked.slice(0,n).map(s=>s.team);
  const otherQualifiers = otherRanked.slice(0,n).map(s=>s.team);

  if(!myQualifiers.some(tm=>tm.isPlayer)){
    ascensaoOrFinalize({type:"groups"});
    return;
  }

  // seed cruzado: 1º de cada grupo, depois 2º de cada grupo, depois 3º de cada grupo...
  const seeds = [];
  for(let i=0;i<n;i++){
    seeds.push(myQualifiers[i]);
    if(otherQualifiers[i]) seeds.push(otherQualifiers[i]);
  }
  const bracketDef = tr.regionalFormat.playoffSize===8 ? BRACKET_DEF : tr.regionalFormat.playoffSize===6 ? SIX_TEAM_BRACKET_DEF : FOUR_TEAM_BRACKET_DEF;
  buildPlayoffBracketSeeded(seeds, bracketDef);
  advanceTournament();
}

// Verifica se o craque já jogou (mesmo time real, vlr.gg) com alguém já escalado no time,
// ou se já foi treinado pelo Head Coach escolhido — vale mesmo no primeiro sorteio.
function teammateSynergyNote(candidate){
  const ct = PLAYER_TEAM[candidate.name.toLowerCase()] || [];
  if(ct.length===0) return null;
  const names = state.roster.filter(Boolean).filter(p=>{
    const pt = PLAYER_TEAM[p.name.toLowerCase()] || [];
    return pt.some(t=>ct.includes(t));
  }).map(p=>p.name);
  if(state.headCoach){
    const coachTeam = COACH_TEAM[state.headCoach.toLowerCase()];
    const coachTeamRegional = COACH_REGIONAL_CHAMPION[state.headCoach.toLowerCase()];
    if((coachTeam && ct.includes(coachTeam)) || (coachTeamRegional && ct.includes(coachTeamRegional))) names.push(state.headCoach);
  }
  if(names.length===0) return null;
  return names.join(", ");
}

function currentOpponent(){
  const tr = state.tournament;
  if(!tr) return null;
  if(tr.stage==="regionalGroups" && tr.regionalGroups.myGroup.pending){
    const p = tr.regionalGroups.myGroup.pending;
    return p.teamA.isPlayer ? p.teamB : p.teamA;
  }
  if(tr.stage==="groups" && tr.groupBracket && tr.groupBracket.pending){
    const p = tr.groupBracket.pending;
    return p.teamA.isPlayer ? p.teamB : p.teamA;
  }
  if(tr.stage==="playoffs" && tr.bracket && tr.bracket.pending){
    const p = tr.bracket.pending;
    return p.teamA.isPlayer ? p.teamB : p.teamA;
  }
  return null;
}

// No Rumo à Ascensão, mostra "Temporada X · Competição · " antes do resto do cabeçalho,
// pra saber sempre em que competição e temporada você está durante a partida ao vivo.
function ascensaoContextPrefix(){
  if(state.difficulty!=="ascensao" || !state.tournament || !state.carreira) return "";
  const fase = state.tournament.ascensaoPhase;
  const nomeCompeticao = fase==="regional" ? t("ascensaoRegionalLabel")
    : fase==="mundial" ? t("ascensaoMundialLabel")
    : fase==="worldcup" ? t("ascensaoWorldCupLabel")
    : "";
  return `${t("ascensaoSeasonLabel")(state.carreira.temporada)} · ${nomeCompeticao} · `;
}
function contextLabel(){
  const tr = state.tournament;
  if(!tr) return "";
  const prefix = ascensaoContextPrefix();
  if(tr.stage==="regionalGroups"){
    const g = tr.regionalGroups.myGroup;
    const roundLabel = g.pending ? t("regionalRoundLabel")(regionalPlayerRoundNumber(g.schedule, g.pending.roundIdx).atual, regionalPlayerRoundNumber(g.schedule, g.pending.roundIdx).total) : "";
    return `${prefix}${t("groupStageTag")} · ${t("groupWord")} ${tr.myGroupLetter}${roundLabel ? " · "+roundLabel : ""}`;
  }
  if(tr.stage==="groups"){
    const roundLabel = tr.groupBracket && tr.groupBracket.pending ? bracketLabel(tr.groupBracket.pending.def.labelKey) : "";
    return `${prefix}${t("groupStageTag")} · ${t("groupWord")} A${roundLabel ? " · "+roundLabel : ""}`;
  }
  if(tr.stage==="playoffs" && tr.bracket && tr.bracket.pending){
    return `${prefix}${t("playoffsTag")} · ${bracketLabel(tr.bracket.pending.def.labelKey)}`;
  }
  return `${prefix}${t("playoffsTag")}`;
}

function resolveBracketTeam(fromDef, bracket){
  if(fromDef.seed!==undefined) return bracket.seeds[fromDef.seed];
  const m = bracket.matches[fromDef.m];
  return fromDef.res==="w" ? m.winner : m.loser;
}

// Os qualifiers chegam intercalados por grupo: [Aupper,Alower,Bupper,Blower,Cupper,Clower,...].
// Mantendo essa ordem de grupo (em vez de reordenar tudo por rating), o BRACKET_DEF garante
// que upper sempre enfrenta lower de OUTRO grupo na primeira rodada — nunca uma repetição do
// mesmo grupo que já se enfrentou na fase de grupos.
function buildPlayoffBracket(qualifiers, bracketDef){
  const def = bracketDef || BRACKET_DEF;
  const uppers = qualifiers.filter((q,i)=>i%2===0);
  const lowers = qualifiers.filter((q,i)=>i%2===1);
  const seeds = [...uppers, ...lowers];
  const matches = {};
  def.forEach(d=>{ matches[d.id] = {winner:null, loser:null}; });
  state.tournament.bracket = { seeds, matches, pointerIdx:0, pending:null, def };
  state.tournament.stage = "playoffs";
}

// Igual ao buildPlayoffBracket, mas recebe os seeds já na ordem final (usado no modo Regional,
// onde a ordem de classificação já vem dos grupos de pontos corridos, não de winner/runnerup).
function buildPlayoffBracketSeeded(seeds, bracketDef){
  const matches = {};
  bracketDef.forEach(d=>{ matches[d.id] = {winner:null, loser:null}; });
  state.tournament.bracket = { seeds, matches, pointerIdx:0, pending:null, def:bracketDef };
  state.tournament.stage = "playoffs";
}

// Processa o mini-chaveamento do grupo automaticamente até chegar numa partida do jogador.
function advanceGroupBracket(){
  const tr = state.tournament;
  if(tr.stage!=="groups") return;
  const brk = tr.groupBracket;
  brk.pending = null;
  while(brk.pointerIdx < GROUP_BRACKET_DEF.length){
    const def = GROUP_BRACKET_DEF[brk.pointerIdx];
    const teamA = resolveBracketTeam(def.aFrom, brk);
    const teamB = resolveBracketTeam(def.bFrom, brk);
    if(teamA.isPlayer || teamB.isPlayer){
      brk.pending = {def, teamA, teamB};
      startMatch(2); // fase de grupos é sempre MD3
      return;
    }
    brk.matches[def.id] = decideMatchWinner(teamA, teamB, 2);
    brk.pointerIdx++;
  }
}
// Termina de resolver (só IA) o que sobrou do mini-chaveamento do grupo, sem pausar.
function finishGroupBracketAI(){
  const brk = state.tournament.groupBracket;
  while(brk.pointerIdx < GROUP_BRACKET_DEF.length){
    const def = GROUP_BRACKET_DEF[brk.pointerIdx];
    const teamA = resolveBracketTeam(def.aFrom, brk);
    const teamB = resolveBracketTeam(def.bFrom, brk);
    brk.matches[def.id] = decideMatchWinner(teamA, teamB, 2);
    brk.pointerIdx++;
  }
}

// Processa partidas automaticamente até chegar numa partida do jogador, ou até o torneio terminar.
function advanceTournament(){
  const tr = state.tournament;
  if(tr.stage!=="playoffs") return;
  const brk = tr.bracket;
  const def = brk.def || BRACKET_DEF;
  brk.pending = null;
  while(brk.pointerIdx < def.length){
    const d = def[brk.pointerIdx];
    const teamA = resolveBracketTeam(d.aFrom, brk);
    const teamB = resolveBracketTeam(d.bFrom, brk);
    if(teamA.isPlayer || teamB.isPlayer){
      brk.pending = {def:d, teamA, teamB};
      startMatch(matchFormatFor(d.labelKey));
      return;
    }
    const {winner, loser} = decideMatchWinner(teamA, teamB, matchFormatFor(d.labelKey));
    brk.matches[d.id] = {winner, loser};
    brk.pointerIdx++;
  }
  // chaveamento concluído sem mais partidas do jogador pendentes
  const finalMatch = brk.matches[def[def.length-1].id];
  ascensaoOrFinalize(finalMatch.winner.isPlayer ? {type:"champion"} : {type:"runnerup"});
}

function darkenHex(hex, factor){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
  return "#" + [clamp(r*factor), clamp(g*factor), clamp(b*factor)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function themeVarsFromColor(hex){
  return { "--crimson":hex, "--crimson-dim":darkenHex(hex,0.4), "--bg-deep":darkenHex(hex,0.07),
    "--text":"#F5F5F5", "--muted":"#8892A0", "--glow-a":darkenHex(hex,0.16), "--glow-b":darkenHex(hex,0.12) };
}
// Descobre a cor de tema certa pra Copa do Mundo — usa o país da carreira no Ascensão, ou o
// país por trás da Seleção escolhida no Modo Copa isolado.
function copaThemeColor(){
  if(state.difficulty==="ascensao" && state.carreira && state.carreira.nacionalidade){
    return COUNTRY_THEME_COLOR[state.carreira.nacionalidade];
  }
  if(state.selecao){
    const codigo = Object.entries(WC_COUNTRY_TO_SELECAO).find(([c,sel])=>sel===state.selecao);
    if(codigo) return COUNTRY_THEME_COLOR[codigo[0]];
  }
  return null;
}
function applyTheme(){
  let vars;
  const emCopaAscensao = state.difficulty==="ascensao" && state.tournament && state.tournament.ascensaoPhase==="worldcup";
  const emSelva = state.difficulty==="selva" || (state.difficulty==="regional" && state.regionalSelva) || state.screen==="selvaModeSelect";
  if(state.difficulty==="copa" || emCopaAscensao){
    const cor = copaThemeColor();
    vars = cor ? themeVarsFromColor(cor) : THEMES.classico;
  } else if(emSelva){
    vars = THEMES.selva;
  } else {
    vars = THEMES[state.difficulty] || THEMES.classico;
  }
  const root = document.documentElement;
  Object.keys(vars).forEach(k => root.style.setProperty(k, vars[k]));
}

function screenHTML(){
  if(state.screen==="intro") return introHTML();
  if(state.screen==="rules") return rulesHTML();
  if(state.screen==="changelog") return changelogHTML();
  if(state.screen==="history") return historyHTML();
  if(state.screen==="creator") return creatorHTML();
  if(state.screen==="teamselect") return teamSelectHTML();
  if(state.screen==="selecaoselect") return selecaoSelectHTML();
  if(state.screen==="regionalSelect") return regionalSelectHTML();
  if(state.screen==="selvaModeSelect") return selvaModeSelectHTML();
  if(state.screen==="regionalTeamSelect") return regionalTeamSelectHTML();
  if(state.screen==="ascensaoCreate") return ascensaoCreateHTML();
  if(state.screen==="ascensaoReveal") return ascensaoRevealHTML();
  if(state.screen==="ascensaoSeason") return ascensaoSeasonHTML();
  if(state.screen==="ascensaoStageSummary") return ascensaoStageSummaryHTML();
  if(state.screen==="ascensaoOffer") return ascensaoOfferHTML();
  if(state.screen==="ascensaoRoleSwitch") return ascensaoRoleSwitchHTML();
  if(state.screen==="ascensaoFinal") return ascensaoFinalHTML();
  if(state.screen==="coachselect") return coachSelectHTML();
  if(state.screen==="draft") return draftHTML();
  if(state.screen==="match" && state.tournament && state.tournament.stage==="regionalStandings") return regionalStandingsHTML();
  if(state.screen==="match") return matchHTML();
  if(state.screen==="end") return endHTML();
  return "";
}

function introHTML(){
  return `
  <div class="panel angle">
    <h1 class="hero">${t("hero")}</h1>
    <p class="lead">${t("lead")}</p>
    <div class="mode-grid">
      <button class="mode-card angle-sm" data-mode="classico">
        <div class="mode-text"><h3>${t("diffClassicoTitle")}</h3><p>${t("diffClassicoDesc")}</p></div>
        <div class="mode-arrow">›</div>
      </button>
      <button class="mode-card angle-sm" data-mode="regional">
        <div class="mode-text"><h3>${t("regionalModeBtn")}</h3><p>${t("regionalModeDesc")}</p></div>
        <div class="mode-arrow">›</div>
      </button>
      <button class="mode-card angle-sm" data-mode="selva">
        <div class="mode-text"><h3>${t("diffSelvaTitle")}</h3><p>${t("diffSelvaDesc")}</p></div>
        <div class="mode-arrow">›</div>
      </button>
      <button class="mode-card angle-sm" data-mode="copa">
        <div class="mode-text"><h3>${t("diffCopaTitle")}</h3><p>${t("diffCopaDesc")}</p></div>
        <div class="mode-arrow">›</div>
      </button>
      <button class="mode-card angle-sm" data-mode="ascensao">
        <div class="mode-text"><h3>${t("ascensaoModeBtn")}</h3><p>${t("ascensaoModeDesc")}</p></div>
        <div class="mode-arrow">›</div>
      </button>
    </div>
    <div class="rules-btn-row">
      <button class="rules-link" id="rules-btn">${t("rulesLink")}</button>
      <button class="rules-link" id="history-btn">${t("historyLink")}</button>
    </div>
  </div>
  <p class="disclaimer">${t("disclaimer")}</p>
  <div class="footer-social">
    <button class="social-link" id="creator-btn" aria-label="Sobre o criador">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="3.5" stroke="#F5F5F5" stroke-width="1.8"/>
        <path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6" stroke="#F5F5F5" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  `;
}

function rulesHTML(){
  const sectionsHTML = t("rulesSections").map(sec=>`
    <div class="rules-section">
      <h3>${sec.title}</h3>
      ${sec.body}
    </div>
  `).join("");
  return `
  <div class="panel angle">
    <h1 class="hero" style="font-size:22px;">${t("rulesTitle")}</h1>
    ${sectionsHTML}
    <div class="btn-row" style="margin-top:6px;">
      <button class="btn" id="rules-back-btn">${t("rulesBackBtn")}</button>
    </div>
  </div>
  `;
}

function changelogHTML(){
  const sectionsHTML = t("changelogSections").map(sec=>`
    <div class="rules-section">
      <h3>${sec.title}</h3>
      ${sec.body}
    </div>
  `).join("");
  return `
  <div class="panel angle">
    <h1 class="hero" style="font-size:22px;">${t("changelogTitle")}</h1>
    ${sectionsHTML}
    <div class="btn-row" style="margin-top:6px;">
      <button class="btn" id="changelog-back-btn">${t("rulesBackBtn")}</button>
    </div>
  </div>
  `;
}

function historyHTML(){
  const list = state.campaignHistoryList || [];
  const resultLabel = (rec)=>{
    if(rec.resultType==="ascensao") return t("ascensaoModeBtn");
    if(rec.resultType==="champion"){
      if(rec.difficulty==="regional" && rec.regionalRegiao) return t("regionalChampionTitle")(rec.regionalRegiao);
      return t("championTitle");
    }
    if(rec.resultType==="runnerup") return t("runnerUpTitle");
    if(rec.resultType==="playoffs") return `${t("playoffsEliminatedTitle")} (${bracketLabel(rec.stageLabelKey)})`;
    return t("groupsEliminatedTitle");
  };
  const resultColor = (rec)=> rec.resultType==="ascensao" ? "var(--gold)" : rec.resultType==="champion" ? "var(--gold)" : (rec.resultType==="runnerup" ? "var(--text)" : "var(--crimson)");
  const rowsHTML = list.length ? list.map(rec=>{
    if(rec.resultType==="ascensao"){
      return `
    <div class="history-item angle-sm">
      <div class="history-top">

function draftHTML(){
  const filled = state.roster.filter(Boolean).length;
  const slotsHTML = SLOT_ORDER.map((roleKey,i)=>{
    const p = state.roster[i];
    if(p){
      return `<div class="slot filled"><div class="slot-name">${p.name} ${playerFlag(p)}</div><div class="slot-role">${roleLabel(roleKey)}</div></div>`;
    }
    return `<div class="slot">${roleLabel(roleKey)}</div>`;
  }).join("");

  let candidateHTML = "";
  if(filled>=5){
    candidateHTML = `
    <div class="panel angle" style="text-align:center;">
      <p class="lead" style="margin-bottom:14px;">${t("rosterComplete")} <span class="mono" style="color:var(--gold)">${teamOverall(state.roster)}</span></p>
      <button class="btn" id="to-match-btn">${t("toMatchBtn")}</button>
    </div>`;
  } else if(state.pendingSlotChoice && state.currentCandidate){
    const c = state.currentCandidate;
    const ov = overall(c);
    const tagChipsHTML = (c.tags && c.tags.length) ? `
      <div class="tag-chips">${c.tags.map(tag=>`<span class="tag-chip">${tagLabel(tag)}</span>`).join("")}</div>
    ` : "";
    const statsBlock = !isHiddenStats() ? `
      <div class="overall-badge">${ov}</div>
      ${tagChipsHTML}
    ` : `<div class="hidden-stats">${t("hiddenStats")}</div>`;
    let openSlots = SLOT_ORDER.map((roleKey,i)=>({roleKey,i})).filter(s=>!state.roster[s.i] && c.roles.includes(s.roleKey));
    if(state.difficulty==="copa"){
      const draftedNames = new Set(state.roster.filter(Boolean).map(p=>p.name));
      const selecaoPlayers = selecaoPlayerObjects(state.selecao).filter(p=>!draftedNames.has(p.name) && p.name!==c.name);
      openSlots = openSlots.filter(s=>{
        const remainingRoles = SLOT_ORDER.filter((rk,idx)=>!state.roster[idx] && idx!==s.i);
        return canCompleteRoster(remainingRoles, selecaoPlayers);
      });
    }

    candidateHTML = `
    <div class="candidate angle">
      <div class="cand-name">${c.name} ${playerFlag(c)}</div>
      <div class="cand-meta">${c.roles.map(r=>`<span class="role-pill">${roleLabel(r)}</span>`).join(" ")}</div>
      ${statsBlock}
      <p class="lead" style="margin:10px 0;">${t("chooseSlotPrompt")(c.name)}</p>
      <div class="btn-row" style="justify-content:center;flex-wrap:wrap;">
        ${openSlots.map(s=>`<button class="btn secondary" data-slotidx="${s.i}">${roleLabel(s.roleKey)}</button>`).join("")}
      </div>
    </div>`;
  } else if(state.confirmingCandidate){
    const c = state.confirmingCandidate;
    const ov = overall(c);
    const tagChipsHTML = (c.tags && c.tags.length) ? `
      <div class="tag-chips">${c.tags.map(tag=>`<span class="tag-chip">${tagLabel(tag)}</span>`).join("")}</div>
    ` : "";
    const synergyWith = !isHiddenStats() ? teammateSynergyNote(c) : null;
    const synergyBlock = synergyWith ? `<div class="cr-synergy" style="justify-content:center;margin:8px 0;">🤝 ${t("alreadyPlayedWith")}</div>` : "";
    const statsBlock = !isHiddenStats() ? `
      <div class="overall-badge">${ov}</div>
      ${tagChipsHTML}
      ${synergyBlock}
    ` : `<div class="hidden-stats">${t("hiddenStats")}</div>`;

    candidateHTML = `
    <div class="candidate angle ${synergyWith ? 'synergy-highlight' : ''}">
      <div class="cand-name">${c.name} ${playerFlag(c)}</div>
      <div class="cand-meta">${c.roles.map(r=>`<span class="role-pill">${roleLabel(r)}</span>`).join(" ")}</div>
      ${statsBlock}
      <p class="lead" style="margin:10px 0;">${t("confirmDraftPrompt")(c.name)}</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" id="confirm-draft-btn">${t("confirmBtn")}</button>
        <button class="btn secondary" id="back-to-list-btn">${t("backBtn")}</button>
      </div>
    </div>`;
  } else if(state.currentCandidates.length>0){
    const skipsLeft = 2 - state.skipsUsed;
    const rowsHTML = state.currentCandidates.map(c=>{
      const synergyWith = !isHiddenStats() ? teammateSynergyNote(c) : null;
      return `
      <button class="candidate-row angle-sm ${synergyWith ? 'synergy-highlight' : ''}" data-pick="${c.name}">
        <div class="cr-info">
          <div class="cr-name">${c.name} ${playerFlag(c)}</div>
          <div class="cr-roles">${c.roles.map(r=>roleLabel(r)).join(" · ")}</div>
          ${!isHiddenStats() && c.tags && c.tags.length ? `<div class="cr-tags">${c.tags.map(tag=>`<span class="cr-tag">${tagLabel(tag)}</span>`).join("")}</div>` : ''}
          ${synergyWith ? `<div class="cr-synergy">🤝 ${t("alreadyPlayedWith")}</div>` : ''}
        </div>
        ${!isHiddenStats() ? `<div class="cr-ovr mono">${overall(c)}</div>` : `<div class="cr-ovr mono">?</div>`}
      </button>
    `;
    }).join("");
    candidateHTML = `
    <div class="panel angle">
      <p class="lead" style="margin-bottom:12px;text-align:center;">${t("pickOneLead")}</p>
      <div class="candidate-list">${rowsHTML}</div>
      <p class="lead" style="margin:12px 0 6px;text-align:center;">${t("skipsLeftLabel")(Math.max(0,skipsLeft))}</p>
      <div class="btn-row" style="justify-content:center;">
        ${skipsLeft>0 ? `<button class="btn secondary" id="skip-batch-btn">${t("skipBtn")}</button>` : ''}
      </div>
    </div>`;
  } else {
    candidateHTML = `
    <div class="panel angle" style="text-align:center;">
      <p class="lead" style="margin-bottom:16px;">${t("drawLead")}</p>
      <button class="btn" id="draw-btn" ${(()=>{
        if(state.difficulty==="copa") return "";
        const draftedNames = new Set(state.roster.filter(Boolean).map(p=>p.name));
        return state.poolSource.filter(p=>!draftedNames.has(p.name)).length===0 ? "disabled" : "";
      })()}>${t("drawBtn")}</button>
      ${state.pool.length===0?`<p class="lead" style="margin-top:10px;">${t("poolEmpty")}</p>`:''}
    </div>`;
  }

  return `
  <div class="roster-strip">${slotsHTML}</div>
  <div class="pool-info"><span>${t("poolLabel")} ${state.pool.length}</span><span>${t("filledLabel")(filled)}</span></div>
  ${candidateHTML}
  `;
}

function matchHTML(){
  const opp = currentOpponent();
  const us = teamOverall(state.roster);
  const roundsHTML = state.roundLog.map(r=>`<div class="r ${r}">${r==='win'?'✓':'·'}</div>`).join("");
  const bo = state.mapsToWin*2-1;
  const side = currentSide();
  const sideLabelHTML = side==="attack"
    ? `<span style="color:var(--crimson);">${t("sideAttack")}</span>`
    : `<span style="color:var(--teal);">${t("sideDefense")}</span>`;

  const rosterColHTML = (players, title) => `
    <div class="roster-col">
      <div class="roster-col-title">${title}</div>
      ${players.map(p=>`
        <div class="roster-player">
          <span class="pname">${p.name} ${playerFlag(p)}</span>
          <span class="pkda">${p.k}/${p.d}/${p.a}</span>
        </div>`).join("")}
    </div>`;
  const rostersHTML = (state.matchStats.us.length && state.matchStats.them.length) ? `
    <div class="pool-info" style="justify-content:center;margin-top:14px;"><span class="mono">${t("rostersLabel")}</span></div>
    <div class="roster-compare">
      ${rosterColHTML(state.matchStats.us, selecaoLabel(state.teamName))}
      ${rosterColHTML(state.matchStats.them, selecaoLabel(opp.name))}
    </div>` : "";

  const mapFinished = isMapDecided(state.matchScore.us, state.matchScore.them);
  let actionHTML = "";
  if(!mapFinished){
    actionHTML = `<div class="btn-row" style="justify-content:center;"><button class="btn" id="sim-round-btn">${t("simRoundBtn")}</button> <button class="btn secondary" id="sim-all-btn">${t("simAllBtn")}</button></div>`;
  } else {
    const wonMap = state.matchScore.us > state.matchScore.them;
    const prospUs = state.mapsUs + (wonMap?1:0);
    const prospThem = state.mapsThem + (wonMap?0:1);
    const matchDecided = prospUs===state.mapsToWin || prospThem===state.mapsToWin;
    const rec = checkRecords();
    const buildRecordParts = ()=>{
      const parts = [];
      if(matchDecided && rec.seriesBreak){
        const b = rec.seriesBreak;
        const key = b.side==="us" ? "recordSeriesUs" : "recordSeriesThem";
        parts.push(t(key)(b.name, b.kills, rec.prevSeries.kills, rec.prevSeries.holder, "MD"+(rec.bo==="md5"?5:3)));
      }
      if(rec.singleMapBreak){
        const b = rec.singleMapBreak;
        const key = b.side==="us" ? "recordSingleMapUs" : "recordSingleMapThem";
        parts.push(t(key)(b.name, b.kills, rec.prevSingleMap.kills, rec.prevSingleMap.holder));
      }
      return parts;
    };
    if(matchDecided){
      const wonMatch = prospUs>prospThem;
      const parts = buildRecordParts();
      const recordHTML = parts.length ? `<div class="record-banner">${parts.join("<br><br>")}</div>` : "";
      actionHTML = `
      <div class="result-banner ${wonMatch?'win':'loss'}">
        <div class="label">${wonMatch?t("resultWin"):t("resultLoss")}</div>
      </div>
      ${recordHTML}
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" id="continue-btn">${t("continueBtn")}</button>
      </div>`;
    } else {
      const parts = rec.singleMapBreak ? [(()=>{
        const b = rec.singleMapBreak;
        const key = b.side==="us" ? "recordSingleMapUs" : "recordSingleMapThem";
        return t(key)(b.name, b.kills, rec.prevSingleMap.kills, rec.prevSingleMap.holder);
      })()] : [];
      const recordHTML = parts.length ? `<div class="record-banner">${parts.join("<br><br>")}</div>` : "";
      actionHTML = `
      <div class="result-banner ${wonMap?'win':'loss'}">
        <div class="label">${wonMap?t("resultWin"):t("resultLoss")}</div>
      </div>
      ${recordHTML}
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" id="next-map-btn">${t("nextMapBtn")}</button>
      </div>`;
    }
  }

  return `
  <div class="pool-info" style="justify-content:center;"><span class="mono">${contextLabel()}</span></div>
  <div class="pool-info" style="justify-content:center;"><span class="mono">MD${bo} · ${t("mapsScoreLabel")(state.mapsUs, state.mapsThem)} · ${sideLabelHTML}</span></div>
  <div class="panel angle">
    <div class="vs-row">
      <div class="team-block">
        <div class="team-name">${selecaoLabel(state.teamName)}</div>
        <div class="team-sub mono">OVR ${us}</div>
        <div class="team-sub" style="margin-top:2px;">${state.headCoach} ${countryFlag(COACH_COUNTRY[state.headCoach.toLowerCase()])}</div>
      </div>
      <div class="vs-x">${t("vs")}</div>
      <div class="team-block">

function endHTML(){
  const info = state.endInfo || {type:"groups"};
  let icon = "🗺️", titleColor = "var(--crimson)", title = "", lead = "";
  if(info.type==="champion"){
    icon = "🏆"; titleColor = "var(--gold)";
    title = state.difficulty==="regional" ? t("regionalChampionTitle")(state.regionalRegiao) : t("championTitle");
    lead = t("championLead");
  } else if(info.type==="runnerup"){
    icon = "🥈"; titleColor = "var(--text)";
    title = state.difficulty==="regional" ? t("regionalRunnerUpTitle")(state.regionalRegiao) : t("runnerUpTitle");
    lead = t("runnerUpLead");
  } else if(info.type==="playoffs"){
    icon = "🗺️";
    title = t("playoffsEliminatedTitle"); lead = t("playoffsEliminatedLead")(bracketLabel(info.stageLabelKey));
  } else {
    icon = "🗺️";
    title = t("groupsEliminatedTitle"); lead = t("groupsEliminatedLead");
  }

  const mvp = info.type==="champion" ? getMVP() : null;
  const mvpHTML = mvp ? `
    <div class="mvp-card angle-sm">
      <div class="mvp-eyebrow">${t("mvpLabel")}</div>
      <div class="mvp-name">${mvp.name} ${playerFlag(mvp)}</div>
      <div class="mvp-role">${roleLabel(mvp.role)}</div>
      <div class="mvp-kda">${mvp.k}/${mvp.d}/${mvp.a}</div>
    </div>` : "";

  const journeyHTML = state.journey.length ? `
    <div class="pool-info" style="justify-content:center;margin-top:6px;"><span class="mono">${t("journeyLabel")}</span></div>
    <div class="journey-table">
      ${state.journey.map(j=>`
        <div class="journey-row">
          <div class="jr-stage">${j.stageLabel}</div>

  return `
    <div class="panel angle trophy-wrap">
      <div class="trophy-icon">${icon}</div>
      <div class="trophy-title" style="color:${titleColor};">${title}</div>
      <p class="lead">${lead}</p>
      ${state.headCoach ? `<div class="pool-info" style="justify-content:center;"><span class="mono">${t("headCoachLabel")}: ${state.headCoach} ${countryFlag(COACH_COUNTRY[state.headCoach.toLowerCase()])}</span></div>` : ''}
      ${mvpHTML}

      <div class="final-roster">
        ${state.roster.map((p,i)=>`<div class="fr-item"><div><div class="n">${p.name} ${playerFlag(p)}${mvp && mvp.name===p.name ? '<span class="mvp-tag">MVP</span>' : ''}</div><div class="r">${roleLabel(SLOT_ORDER[i])}</div></div><div class="o mono">${overall(p)}</div></div>`).join("")}
      </div>
      <button class="btn" id="restart-btn">${info.type==="champion"?t("playAgain"):t("tryAgain")}</button>
      <div class="share-row">

      state.remainingCoaches = shuffle(COACHES.filter(c=>c!==state.headCoach));
      state.poolSource = POOL;
      state.pool = weightedDrawOrder(state.poolSource);
    }
    state.roster = SLOT_ORDER.map(()=>null);

    else if(state.difficulty==="regional") state.screen = "regionalTeamSelect";
    else state.screen = "teamselect";
    render();
  };

  const drawBtn = document.getElementById("draw-btn");
  if(drawBtn) drawBtn.onclick = ()=>{
    let batch;
    if(state.difficulty==="copa"){
      // Seleções são pequenas — nunca "perde" ninguém de vista: recalcula do zero quem ainda
      // não foi escalado e tem vaga aberta compatível, em vez de consumir o pool aos poucos.
      const draftedNames = new Set(state.roster.filter(Boolean).map(p=>p.name));
      const stillAvailable = selecaoPlayerObjects(state.selecao).filter(c=>{
        if(draftedNames.has(c.name)) return false;
        return SLOT_ORDER.some((roleKey,i)=>!state.roster[i] && c.roles.includes(roleKey));
      });
      batch = shuffle(stillAvailable).slice(0,5);
    } else {
      // sorteio inteligente: só entram candidatos com pelo menos 1 vaga aberta compatível;
      // quem não tem vaga nenhuma disponível é descartado do BATCH (não do pool geral).
      batch = [];
      while(batch.length<5){
        if(state.pool.length===0){
          // pool esgotado sem fechar o elenco — redesenha do zero a partir da fonte original,
          // trazendo de volta quem foi descartado antes (agora pode servir, já que outras
          // vagas fecharam nesse meio tempo) — exclui quem já está escalado E quem já apareceu
          // nesse mesmo sorteio (senão o redesenho pode repetir alguém dentro da mesma leva).
          const draftedNames = new Set(state.roster.filter(Boolean).map(p=>p.name));
          const batchNames = new Set(batch.map(p=>p.name));
          const restante = state.poolSource.filter(p=>!draftedNames.has(p.name) && !batchNames.has(p.name));
          if(restante.length===0) break; // ninguém mais disponível de verdade
          state.pool = weightedDrawOrder(restante);
        }
        const c = state.pool.pop();
        const hasOpenSlot = SLOT_ORDER.some((roleKey,i)=>!state.roster[i] && c.roles.includes(roleKey));
        if(hasOpenSlot) batch.push(c);
      }
    }
    state.currentCandidates = batch;
    render();
  };
  document.querySelectorAll("[data-pick]").forEach(el=>{
    el.onclick = ()=>{
      const name = el.dataset.pick;
      const c = state.currentCandidates.find(p=>p.name===name);
      state.confirmingCandidate = c;

  });
