<title>VALX — Simulador de VALORANT: Monte seu Super Time</title>
<meta name="description" content="VALX é um jogo de simulação de fantasy esports de VALORANT — monte seu Super Time com craques profissionais reais, jogue o Mundial, o Regional, a Copa do Mundo ou crie sua carreira no Rumo à Ascensão.">
<meta property="og:title" content="VALX — Simulador de VALORANT">
<meta property="og:description" content="Monte seu Super Time com craques profissionais de VALORANT e corra atrás do título Mundial, Regional ou da Copa do Mundo.">
<meta property="og:type" content="website">
<meta name="keywords" content="VALX, valx, VALORANT, simulador, fantasy esports, craques, mundial, regional, copa do mundo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0A0C10;
    --bg-panel:#12151C;
    --bg-panel-2:#171B24;
    --bg-elevated:#1D212C;
    --line:#262B37;
    --line-soft:#1B1F29;
    --crimson:#FF4655;
    --crimson-dim:#5C2530;
    --crimson-soft:rgba(255,70,85,0.12);
    --teal:#3BE8C4;
    --teal-soft:rgba(59,232,196,0.12);
    --gold:#F0B94D;
    --text:#ECEDF1;
    --text-soft:#C7C9D1;
    --muted:#8B90A0;
    --glow-a:#151A22;
    --glow-b:#1A1319;
    --radius:14px;
    --radius-sm:9px;
    --radius-pill:999px;
    --shadow:0 8px 24px rgba(0,0,0,0.28);
    --shadow-sm:0 2px 10px rgba(0,0,0,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;touch-action:manipulation;}
  body{
    background:
      radial-gradient(1100px 560px at 12% -8%, var(--glow-a) 0%, transparent 58%),
      radial-gradient(900px 480px at 108% 8%, var(--glow-b) 0%, transparent 52%),
      var(--bg-deep);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    transition:background 0.25s ease;
    touch-action:manipulation;
    line-height:1.5;
  }
  .headline{font-family:'Chakra Petch', sans-serif;}
  .mono{font-family:'JetBrains Mono', monospace;}

  #app{max-width:640px;margin:0 auto;padding:22px 18px 64px;}
  @media (min-width:860px){
    #app{max-width:760px;padding:36px 24px 80px;}
  }
  @media (min-width:1180px){
    #app{max-width:860px;}
  }

  .angle{
    clip-path:polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
  }
  .angle-sm{
    clip-path:polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
  }

  /* ---- top bar ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding-top:2px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand:active{opacity:0.7;}
  .brand-mark{width:44px;height:28px;flex:none;color:var(--crimson);display:flex;align-items:center;}
  .brand-text{display:flex;flex-direction:column;}
  .brand-name{font-family:'Chakra Petch';font-weight:700;font-size:19px;letter-spacing:0.3px;line-height:1;}
  .brand-name span{color:var(--crimson);}
  .phase-tag{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:var(--radius-pill);background:var(--bg-panel);}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .lang-switch{display:flex;border:1px solid var(--line);border-radius:var(--radius-pill);overflow:hidden;background:var(--bg-panel);}
  .lang-btn{
    font-family:'JetBrains Mono';font-size:10.5px;color:var(--muted);background:transparent;
    border:none;padding:7px 11px;cursor:pointer;letter-spacing:0.4px;transition:color .15s,background .15s;
  }
  .lang-btn + .lang-btn{border-left:1px solid var(--line);}
  .lang-btn.active{background:var(--crimson);color:#fff;}
  .lang-btn:not(.active):hover{color:var(--text);background:var(--bg-elevated);}

  /* ---- generic panel ---- */
  .panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm);}
  .panel.angle{border-radius:0;}
  .panel + .panel{margin-top:16px;}

  h1.hero{font-family:'Chakra Petch';font-size:28px;line-height:1.18;font-weight:700;margin:0 0 12px;letter-spacing:0.1px;}
  p.lead{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 22px;}

  button, .btn, .team-option, .diff-card, .mode-card, .history-item, a{touch-action:manipulation;}
  .btn{
    font-family:'Chakra Petch';font-weight:600;font-size:15px;
    background:var(--crimson);color:#fff;border:none;padding:14px 24px;
    cursor:pointer;letter-spacing:0.2px;border-radius:var(--radius-sm);
    transition:filter .15s, transform .1s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);filter:brightness(0.96);}
  .btn.secondary{background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);}

  .history-meta{color:var(--muted);font-size:10.5px;}
  .footer-social{display:flex;justify-content:center;margin-top:22px;}
  .social-link{
    width:44px;height:44px;border-radius:13px;background:var(--bg-panel);border:1px solid var(--line);

// Cria uma cópia independente dos elencos/técnicos originais — usada uma vez no início de cada
// carreira do Ascensão. As trocas de mercado atualizam ESSA cópia, não o banco original, e cada
// temporada nova continua de onde a anterior parou (em vez de resetar sempre pro mesmo ponto de
// partida) — isso é o que faz os times evoluírem de verdade ao longo da carreira.
function ascensaoBuildFreshSnapshot(){
  const snapshot = {};
  Object.entries(ASCENSAO_TEAM_ROSTERS).forEach(([org, dados])=>{
    snapshot[org] = {players: [...dados.players], coach: dados.coach};
  });
  return snapshot;
}
// Depois de atualizar o snapshot com o resultado do mercado de uma região, garante que nenhum
// craque continue "preso" no elenco de um time de OUTRA região de uma temporada anterior —
// tira ele de lá (vira vaga em aberto, preenchida normalmente na próxima vez que aquele time
// jogar) em vez de deixar o mesmo craque escalado em dois times ao mesmo tempo.
function ascensaoDedupeSnapshot(snapshot, orgsAutoritativos){
  const usadosAgora = new Set();
  orgsAutoritativos.forEach(org=>{
    if(snapshot[org]) snapshot[org].players.filter(Boolean).forEach(n=>usadosAgora.add(n.toLowerCase()));
  });
  Object.keys(snapshot).forEach(org=>{
    if(orgsAutoritativos.includes(org)) return;
    snapshot[org].players = snapshot[org].players.map(n=>{
      if(n && usadosAgora.has(n.toLowerCase())) return null;
      return n;
    });
  });
}
// Calcula a força de um time pra "Rumo à Ascensão": usa o elenco real + composição/química
// quando já pesquisamos esse time; senão cai pra força genérica (teamRegionRating).
// Monta o time completo (elenco+coach) de uma organização do Rumo à Ascensão — usa o elenco
// real se já tivermos pesquisado, senão monta um elenco genérico (sorteado do banco geral)
// só pra ter alguém pra calcular a força do time.
// Craques que já foram campeões Mundiais ou da Copa do Mundo NESSA campanha do Ascensão
// ganham um bônus de overall até o fim das 16 temporadas — representa o "peso" de já ter
// sido campeão. Não mexe no objeto original do banco (POOL), só numa cópia pro time atual.
// Campeão Regional dá um bônus menor que Campeão Mundial — quem ganhou os dois soma os dois.
// Craques que NUNCA devem aparecer no Rumo à Ascensão (nem escalados em time, nem como agente
// livre no mercado) — mesmo continuando disponíveis normalmente nos outros modos.
const ASCENSAO_EXCLUDED_PLAYERS = new Set(["yay","tenz"]);
// Igual acima, mas pra técnicos — nunca aparecem escalados nem como agente livre no Ascensão.
const ASCENSAO_EXCLUDED_COACHES = new Set([]);
const ASCENSAO_CHAMPION_BONUS = 3;
const ASCENSAO_REGIONAL_CHAMPION_BONUS = 1.5;
function ascensaoApplyChampionBonus(roster){
  const c = state.carreira;
  const mundiais = new Set((c && c.campeoesMundiais || []).map(n=>n.toLowerCase()));
  const regionais = new Set((c && c.campeoesRegionais || []).map(n=>n.toLowerCase()));
  return roster.map(p=>{
    if(!p) return p;
    let bonus = 0;
    const nomeLower = p.name.toLowerCase();
    if(mundiais.has(nomeLower) || PLAYER_WORLD_CHAMPION.has(nomeLower)) bonus += ASCENSAO_CHAMPION_BONUS;
    if(regionais.has(nomeLower) || PLAYER_REGIONAL_CHAMPION.has(nomeLower)) bonus += ASCENSAO_REGIONAL_CHAMPION_BONUS;
    if(bonus>0) return {...p, overall: Math.min(99, p.overall + bonus)};
    return p;
  });
}
// Casamento bipartido genérico pra um subconjunto específico de funções (não precisa ser as
// 5 do SLOT_ORDER inteiro) — usado pra encaixar o personagem numa Seleção real ou elenco de org.
// Temporadas em que a Copa do Mundo acontece: a cada 3, a partir da 2ª (2,5,8,11,14...).
function isAscensaoWorldCupSeason(temporada){
  return temporada>=2 && (temporada-2)%3===0;
}
function assignRolesFrom(roles, players){
  const matchRole = {};
  function tryAssign(roleKey, visited){
    for(const p of players){
      if(!p.roles.includes(roleKey) || visited.has(p.name)) continue;
      visited.add(p.name);
      if(!(p.name in matchRole) || tryAssign(matchRole[p.name], visited)){
        matchRole[p.name] = roleKey;
        return true;
      }
    }
    return false;
  }
  const ok = roles.every(r=>tryAssign(r, new Set()));
  if(!ok) return null;
  return roles.map(r=>{
    const name = Object.keys(matchRole).find(n=>matchRole[n]===r);
    return players.find(p=>p.name===name);
  });
}
// Monta um roster de 5 encaixando o personagem numa das funções dele (a principal, se der,
// senão tenta as secundárias em ordem) — os outros 4 vêm do pool de craques reais passado.
// Quais qualidades são "essenciais" pra cada função — dão o bônus maior quando o craque tem.
const ASCENSAO_ESSENTIAL_QUALITIES = {
  duelist: ["entry","mm","clutch"],
  sentinel: ["lurker","mm","clutch"],
  controller: ["mm","clutch","utility"],
  initiator: ["utility","clutch"],
  flex: ["utility","clutch"],
};
// Qualidades "opcionais" — ajudam bem, mas não são essenciais (Operator no Duelista/Sentinela).
const ASCENSAO_OPTIONAL_QUALITIES = {
  duelist: ["operator"],
  sentinel: ["operator"],
};
// Funções em que o IGL ajuda mesmo não sendo "essencial" pra elas.
const ASCENSAO_IGL_GOOD_FUNCTIONS = ["initiator","flex","controller"];
// Funções em que o IGL não soma nada (nem ajuda nem atrapalha).
const ASCENSAO_IGL_NEUTRAL_FUNCTIONS = ["duelist","sentinel"];
// Calcula o overall do craque criado no Rumo à Ascensão — base 82. Cada qualidade soma um
// valor diferente dependendo se ela é essencial pra função escolhida ou não: essencial soma
// mais, opcional soma um pouco menos, mm sempre ajuda (mesmo fora da lista), IGL ajuda em
// Iniciador/Flex/Controlador mas não soma nada em Duelista/Sentinela — nenhuma qualidade
// nunca DIMINUI o overall, só ajuda mais, menos, ou nada.
function ascensaoCharacterOverall(){
  const c = state.carreira;
  let overall = 82;
  const essenciais = ASCENSAO_ESSENTIAL_QUALITIES[c.funcao] || [];
  const opcionais = ASCENSAO_OPTIONAL_QUALITIES[c.funcao] || [];
  c.qualidades.forEach(q=>{
    if(essenciais.includes(q)) overall += 3;
    else if(opcionais.includes(q)) overall += 2;
    else if(q==="mm") overall += 2;
    else if(q==="igl" && ASCENSAO_IGL_NEUTRAL_FUNCTIONS.includes(c.funcao)) overall += 0;
    else if(q==="igl" && ASCENSAO_IGL_GOOD_FUNCTIONS.includes(c.funcao)) overall += 2;
    else overall += 1;
  });
  overall += c.funcoesSecundarias.length * 1.5;
  return Math.min(93, Math.round(overall));
}
function buildTeamWithCharacter(realPlayers, ignoreFuncaoAtual){
  const c = state.carreira;
  let characterRoles = [c.funcao, ...c.funcoesSecundarias];
  // Se aceitou uma oferta pra jogar numa função específica, tenta ESSA primeiro — senão o time
  // sempre monta na função principal e ignora o que foi combinado na oferta. A Seleção da Copa
  // do Mundo é exceção: lá é sempre a função principal, não importa onde o craque jogue no time.
  if(!ignoreFuncaoAtual && c.funcaoAtual && characterRoles.includes(c.funcaoAtual)){
    characterRoles = [c.funcaoAtual, ...characterRoles.filter(r=>r!==c.funcaoAtual)];
  }
  const characterOverall = ascensaoCharacterOverall();
  const characterPlayer = {name:c.nome, roles:characterRoles, overall:characterOverall, tags:c.qualidades, isCharacter:true, country:c.nacionalidade};
  for(const myRole of characterRoles){
    const remainingRoles = SLOT_ORDER.filter(rk=>rk!==myRole);
    const assigned = assignRolesFrom(remainingRoles, realPlayers);
    if(assigned){
      return SLOT_ORDER.map(rk=>{
        if(rk===myRole) return characterPlayer;
        return assigned[remainingRoles.indexOf(rk)];
      });
    }
  }
  return buildValidRoster(realPlayers); // não coube em nenhuma função — joga só com o time real
}
// Igual buildTeamWithCharacter, mas em vez de parar na primeira função que der certo (que
// quase sempre é a principal), testa TODAS as funções do craque (principal + secundárias) e
// sorteia entre as que realmente cabem — assim ofertas de transferência têm chance real de
// vir pra alguma função secundária também, não só sempre a principal.
// Verifica se, com o elenco NOVO da temporada, alguma função escolhida (principal ou
// secundária) diferente da que o craque está jogando agora deixaria o time melhor — se sim,
// retorna qual e o quanto melhora, pra perguntar antes de fechar a temporada.
function ascensaoCheckRoleSwitchOpportunity(realPlayers){
  const c = state.carreira;
  const characterRoles = [c.funcao, ...c.funcoesSecundarias];
  if(characterRoles.length<2) return null; // sem funcao alternativa pra oferecer
  const funcaoAtual = (c.funcaoAtual && characterRoles.includes(c.funcaoAtual)) ? c.funcaoAtual : c.funcao;
  const characterOverall = ascensaoCharacterOverall();
  const characterPlayer = {name:c.nome, roles:characterRoles, overall:characterOverall, tags:c.qualidades, isCharacter:true, country:c.nacionalidade};
  let melhorFuncao = null, melhorScore = -1, scoreAtual = -1;
  for(const myRole of characterRoles){
    const remainingRoles = SLOT_ORDER.filter(rk=>rk!==myRole);
    const assigned = assignRolesFrom(remainingRoles, realPlayers);
    if(!assigned) continue;
    const roster = SLOT_ORDER.map(rk=>{
      if(rk===myRole) return characterPlayer;
      return assigned[remainingRoles.indexOf(rk)];
    });
    const score = teamOverall(roster);
    if(myRole===funcaoAtual) scoreAtual = score;
    if(score>melhorScore){ melhorScore = score; melhorFuncao = myRole; }
  }
  if(melhorFuncao && melhorFuncao!==funcaoAtual && scoreAtual>=0 && melhorScore-scoreAtual>=1){
    return {funcao: melhorFuncao, diff: melhorScore-scoreAtual};
  }
  return null;
}
function buildTeamWithCharacterRandomRole(realPlayers){
  const c = state.carreira;
  const characterRoles = [c.funcao, ...c.funcoesSecundarias];
  const characterOverall = ascensaoCharacterOverall();
  const characterPlayer = {name:c.nome, roles:characterRoles, overall:characterOverall, tags:c.qualidades, isCharacter:true, country:c.nacionalidade};
  const opcoesValidas = []; // cada item: {roster, peso}
  for(const myRole of characterRoles){
    const remainingRoles = SLOT_ORDER.filter(rk=>rk!==myRole);
    const assigned = assignRolesFrom(remainingRoles, realPlayers);
    if(assigned){
      const roster = SLOT_ORDER.map(rk=>{
        if(rk===myRole) return characterPlayer;
        return assigned[remainingRoles.indexOf(rk)];
      });
      // a função principal pesa o dobro de CADA secundária — assim ela continua sendo a mais
      // provável mesmo quando o craque escolheu várias funções secundárias (senão elas juntas
      // ficam mais prováveis só por serem mais opções, mesmo pesando igual uma por uma).
      opcoesValidas.push({roster, peso: myRole===c.funcao ? 2 : 1});
    }
  }
  if(opcoesValidas.length===0) return buildValidRoster(realPlayers);
  const totalPeso = opcoesValidas.reduce((s,o)=>s+o.peso,0);
  let sorteio = Math.random()*totalPeso;
  let idx = 0;
  while(idx<opcoesValidas.length-1 && sorteio>opcoesValidas[idx].peso){ sorteio -= opcoesValidas[idx].peso; idx++; }
  return opcoesValidas[idx].roster;
}
// Igual selecaoPlayerObjects, mas tirando quem está na lista de excluídos do Ascensão — usado
// só nas telas do Ascensão, a Copa do Mundo isolada continua podendo escalar esses craques.
function ascensaoSelecaoPlayerObjects(nacao){
  return selecaoPlayerObjects(nacao).filter(p=>!ASCENSAO_EXCLUDED_PLAYERS.has(p.name.toLowerCase()));
}
function buildAscensaoNationalTeam(){
  const jogadoresOrdenados = [...ascensaoSelecaoPlayerObjects(state.carreira.nacao)].sort((a,b)=>b.overall-a.overall);
  return ascensaoApplyChampionBonus(buildTeamWithCharacter(jogadoresOrdenados, true));
}
function buildAscensaoOrgTeam(name, insertCharacter, overridePlayers, overrideCoach){
  const baseRosters = (state.carreira && state.carreira.orgRostersSnapshot) || ASCENSAO_TEAM_ROSTERS;
  const real = baseRosters[name];
  const playerNames = overridePlayers || (real && real.players);
  const coachFinal = overrideCoach!==undefined ? overrideCoach : (real && real.coach);
  if(playerNames){
    const roster = playerNames.map(n=>POOL.find(p=>p.name.toLowerCase()===n.toLowerCase())).filter(Boolean);
    if(roster.length>=5){
      if(insertCharacter){
        const roster2 = ascensaoApplyChampionBonus(buildTeamWithCharacter(roster));
        if(!roster2.some(p=>!p)) return {id:name, name, roster:roster2, coach:coachFinal, rating:teamOverall(roster2)};
      }
      const validRoster = ascensaoApplyChampionBonus(buildValidRoster(roster));
      if(!validRoster.some(p=>!p)){
        return {id:name, name, roster:validRoster, coach:coachFinal, rating:teamOverall(validRoster)};
      }
    }
  }
  // sem elenco real confiável — monta um genérico só pra ter numero pra simular
  const roster = buildAIRoster(shuffle(POOL).slice());
  return {id:name, name, roster, coach:null, rating:teamOverall(roster)};
}
// Simula o "mercado de transferências" dos times adversários de uma região pra essa temporada
// — alguns times trocam um craque com outro time da região, tentando melhorar o elenco. Só
// mexe numa cópia local (não mexe no banco de dados de verdade, cada temporada é sorteada de
// novo). Retorna um mapa {nomeDoTime: [craques atualizados]} pra usar só nessa simulação.
// Igual o mercado de craques, só que pra técnicos: cada time só troca de HC se aparecer
// alguém melhor no mercado (usando o buff do técnico como "qualidade") — o técnico antigo só
// vira opção pros próximos times depois que o meu já foi substituído de verdade.
function simulateRegionalCoachTransfers(regiao, excludeOrg, transferenciasDeJogadores, usadosGlobalmenteCoach){
  const baseRosters = (state.carreira && state.carreira.orgRostersSnapshot) || ASCENSAO_TEAM_ROSTERS;
  const orgs = TEAM_REGIONS[regiao].filter(o=>o!==excludeOrg && baseRosters[o]);
  const coachCopies = {};
  orgs.forEach(org=>{ coachCopies[org] = baseRosters[org].coach; });
  function buffDe(nomeCoach){ return nomeCoach ? coachBuff(nomeCoach) : -1; }
  // Pontua um técnico candidato pra um time: o buff é a base, mas pesa também se o país dele
  // bate com a região do time (ou é vizinho), e sinergia com o elenco de jogadores do time.
  function pontuaCandidatoCoach(nomeCoach, orgAlvo){
    if(!nomeCoach) return -1;
    let pontos = buffDe(nomeCoach);
    const paisCoach = COACH_COUNTRY[nomeCoach.toLowerCase()];
    if(paisCoach){
      const regiaoDoPais = COUNTRY_TO_REGION[paisCoach];
      if(regiaoDoPais===regiao) pontos += 15;
      else if((ASCENSAO_REGION_PROXIMITY[regiao]||[]).includes(regiaoDoPais)) pontos += 6;
      const rosterDoTime = transferenciasDeJogadores && transferenciasDeJogadores[orgAlvo];
      if(rosterDoTime){
        const sinergia = rosterDoTime.filter(nomeJogador=>PLAYER_COUNTRY[nomeJogador.toLowerCase()]===paisCoach).length;
        pontos += sinergia;
      }
    }
    return pontos;
  }
  const RODADAS_DE_MERCADO = 1;
  for(let rodada=0; rodada<RODADAS_DE_MERCADO; rodada++){
    // Técnicos sem time (nunca escalados em nenhuma organização do jogo) também entram no
    // mercado como opção, igual os agentes livres de jogador.
    const jaEmAlgumTimeNoJogo = new Set(Object.values(baseRosters).filter(d=>d.coach).map(d=>d.coach.toLowerCase()));
    if(usadosGlobalmenteCoach) usadosGlobalmenteCoach.forEach(n=>jaEmAlgumTimeNoJogo.add(n.toLowerCase()));
    const agentesLivres = Object.keys(COACH_COUNTRY).filter(c=>!jaEmAlgumTimeNoJogo.has(c) && !ASCENSAO_EXCLUDED_COACHES.has(c));
    // Todo time libera o próprio técnico ao mesmo tempo — o mercado já nasce com opção pra
    // todo time, sem depender de ninguém trocar primeiro. Só uma parte dos times participa
    // de fato a cada temporada, igual o mercado de jogadores — reduz o volume de trocas.
    const CHANCE_PARTICIPAR_DO_MERCADO_COACH = 0.17;
    const orgsParticipandoCoach = orgs.filter(()=>Math.random()<CHANCE_PARTICIPAR_DO_MERCADO_COACH);
    const meuOriginal = {};
    orgsParticipandoCoach.forEach(org=>{ meuOriginal[org] = coachCopies[org]; });
    let mercado = [...orgsParticipandoCoach.map(org=>meuOriginal[org]).filter(Boolean), ...agentesLivres];
    shuffle(orgsParticipandoCoach).forEach(org=>{
      const meuAntigo = meuOriginal[org];
      const opcoes = shuffle(mercado.filter(c=>c!==meuAntigo)).sort((a,b)=>pontuaCandidatoCoach(b,org)-pontuaCandidatoCoach(a,org));
      const qualificados = opcoes.filter(c=>pontuaCandidatoCoach(c,org) > pontuaCandidatoCoach(meuAntigo,org)).slice(0,10);
      let contratado = null;
      if(qualificados.length>0){
        const pesos = qualificados.map((_,i)=>Math.sqrt(qualificados.length-i));
        const totalPeso = pesos.reduce((a,b)=>a+b,0);
        let sorteio = Math.random()*totalPeso;
        let idx = 0;
        while(idx<pesos.length-1 && sorteio>pesos[idx]){ sorteio -= pesos[idx]; idx++; }
        contratado = qualificados[idx];
      }
      if(contratado){
        coachCopies[org] = contratado;
        mercado = mercado.filter(c=>c!==contratado);
      } else if(mercado.includes(meuAntigo)){
        // ninguém levou meu técnico ainda — fica com o mesmo, sem risco.
        coachCopies[org] = meuAntigo;
        mercado = mercado.filter(c=>c!==meuAntigo);
      } else {
        // meu técnico original já foi levado por outro time antes de mim, e eu não achei
        // ninguém melhor — fico com quem sobrou no mercado (ou sem técnico, em último caso).
        const sobra = mercado[0] || null;
        coachCopies[org] = sobra;
        if(sobra) mercado = mercado.filter(c=>c!==sobra);
      }
    });
  }
  return coachCopies;
}
function simulateRegionalTransfers(regiao, excludeOrg, usadosGlobalmente){
  const baseRosters = (state.carreira && state.carreira.orgRostersSnapshot) || ASCENSAO_TEAM_ROSTERS;
  const orgs = TEAM_REGIONS[regiao].filter(o=>o!==excludeOrg && baseRosters[o]);
  const rosterCopies = {};
  orgs.forEach(org=>{ rosterCopies[org] = [...baseRosters[org].players]; });
  const roles = ["duelist","flex","initiator","controller","sentinel"];
  function overallDe(nome){
    if(!nome) return -1;
    const p = POOL.find(x=>x.name.toLowerCase()===nome.toLowerCase());
    return p ? p.overall : 80;
  }
  // Pontua um candidato pra uma vaga: overall é a base, mas pesa também se o país dele bate
  // com a região do time (ou é vizinho), e sinergia com quem já tá no elenco (mesmo país).
  function pontuaCandidato(nomeCandidato, restanteDoElenco){
    const p = POOL.find(x=>x.name.toLowerCase()===nomeCandidato.toLowerCase());
    let pontos = overallDe(nomeCandidato);
    if(!p) return pontos;
    const paisesCandidato = playerCountries(p.name);
    const regiaoDoPais = freeAgentRegion(p.name.toLowerCase());
    if(regiaoDoPais===regiao) pontos += 15;
    else if((ASCENSAO_REGION_PROXIMITY[regiao]||[]).includes(regiaoDoPais)) pontos += 6;
    const sinergia = restanteDoElenco.filter(nomeColega=>{
      const pColega = POOL.find(x=>x.name.toLowerCase()===nomeColega.toLowerCase());
      return pColega && playerCountries(pColega.name).some(pc=>paisesCandidato.includes(pc));
    }).length;
    pontos += sinergia * 1.5;
    return pontos;
  }
  // Preenche vagas em aberto (time com "null" no elenco fixo do banco) ANTES do mercado normal
  // rodar — simula o time contratando às pressas assim que a temporada/carreira começa, usando
  // a mesma pontuação de nacionalidade/proximidade/sinergia dos reforços normais.
  orgs.forEach(org=>{
    if(!rosterCopies[org].includes(null)) return;
    const jaEmAlgumTimeNoJogo = new Set(Object.values(rosterCopies).flatMap(r=>r.filter(Boolean).map(n=>n.toLowerCase())));
    if(usadosGlobalmente) usadosGlobalmente.forEach(n=>jaEmAlgumTimeNoJogo.add(n.toLowerCase()));
    const fixos = rosterCopies[org].filter(Boolean).map(n=>POOL.find(p=>p.name.toLowerCase()===n.toLowerCase())).filter(Boolean);
    const nomesFixos = new Set(fixos.map(f=>f.name.toLowerCase()));
    const candidatosPontuados = POOL.filter(p=>!jaEmAlgumTimeNoJogo.has(p.name.toLowerCase()) && !ASCENSAO_EXCLUDED_PLAYERS.has(p.name.toLowerCase()) && !nomesFixos.has(p.name.toLowerCase()))
      .sort((a,b)=>pontuaCandidato(b.name, fixos.map(f=>f.name))-pontuaCandidato(a.name, fixos.map(f=>f.name)));
    // embaralha só dentro do grupo dos melhores (top ~12) — mantém a prioridade geral por
    // nacionalidade/proximidade/sinergia, mas sem sempre montar a combinação idêntica.
    const topCandidatos = shuffle(candidatosPontuados.slice(0,12));
    const restoCandidatos = candidatosPontuados.slice(12);
    const candidatosOrdenados = [...topCandidatos, ...restoCandidatos];
    const completo = buildValidRoster([...fixos, ...candidatosOrdenados]);
    if(completo.every(Boolean)) rosterCopies[org] = completo.map(p=>p.name);
  });
  // Agentes livres — craques do banco que hoje não estão escalados em nenhum time — também
  // entram no mercado como opção de contratação. Recalculado a cada rodada (ver abaixo) pra
  // não oferecer de novo quem já foi contratado numa rodada anterior dessa mesma simulação.
  // Roda o mercado várias rodadas na mesma temporada — cada time pode tentar melhorar mais de
  // uma posição do elenco, não só uma.
  const RODADAS_DE_MERCADO = 1;
  for(let rodada=0; rodada<RODADAS_DE_MERCADO; rodada++){
    const jaEmAlgumTimeAgora = new Set(Object.values(rosterCopies).flat().filter(Boolean).map(n=>n.toLowerCase()));
    if(usadosGlobalmente) usadosGlobalmente.forEach(n=>jaEmAlgumTimeAgora.add(n.toLowerCase()));
    // Agentes livres de verdade — craques do banco que não estão em NENHUM elenco fixo do jogo,
    // atribuídos a essa região pela nacionalidade deles (playerRegionKey não serve aqui, porque
    // ele só reconhece quem já tem time — por definição, um agente livre nunca teria região).
    const todosOsEscaladosNoJogo = new Set(Object.values(baseRosters).flatMap(d=>d.players.filter(Boolean).map(n=>n.toLowerCase())));
    const agentesLivresDaRegiao = POOL.filter(p=>{
      if(todosOsEscaladosNoJogo.has(p.name.toLowerCase())) return false;
      if(jaEmAlgumTimeAgora.has(p.name.toLowerCase())) return false;
      if(ASCENSAO_EXCLUDED_PLAYERS.has(p.name.toLowerCase())) return false;
      return freeAgentRegion(p.name.toLowerCase()) === regiao;
    }).map(p=>p.name);
    // Passo 1: TODO time tira o craque mais fraco do próprio elenco ao mesmo tempo — fica uma
    // vaga temporária, e o craque vai pro mercado compartilhado (isso já resolve o "ninguém
    // consegue comprar primeiro porque o mercado começa vazio"). Agentes livres entram juntos.
    const vaga = {};
    let pool = [...agentesLivresDaRegiao];
    const CHANCE_LIBERAR_ALEATORIO = 0.2;
    const CHANCE_PARTICIPAR_DO_MERCADO = 0.65;
    const orgsParticipando = orgs.filter(()=>Math.random()<CHANCE_PARTICIPAR_DO_MERCADO);
    orgsParticipando.forEach(org=>{
      const elenco = rosterCopies[org].map((nome,idx)=>({nome, idx, overall:overallDe(nome)}));
      elenco.sort((a,b)=>a.overall-b.overall);
      // normalmente libera o craque mais fraco do time, mas às vezes (chance pequena) libera
      // um craque aleatório do elenco — exceto o MELHOR, pra não correr o risco dele ser
      // roubado e o time cair pra um reforço de emergência pior (troca sem sentido).
      const candidatosParaLiberar = elenco.slice(0, -1); // tira o melhor (ultimo, ja que esta ordenado crescente)
      // Craque "fora de lugar" (nacionalidade de uma região, jogando em time de outra) tem
      // prioridade alta pra ser liberado — representa ele querendo voltar a jogar mais perto
      // de casa. Não é garantido (senão o time nunca teria opção), só bem mais provável.
      const foraDeLugar = candidatosParaLiberar.filter(c=>{
        const regiaoDoCraque = freeAgentRegion(c.nome.toLowerCase());
        return regiaoDoCraque && regiaoDoCraque!==regiao;
      });
      let liberado;
      if(foraDeLugar.length>0 && Math.random()<0.7){
        liberado = foraDeLugar[Math.floor(Math.random()*foraDeLugar.length)];
      } else {
        liberado = (Math.random() < CHANCE_LIBERAR_ALEATORIO && candidatosParaLiberar.length>0)
          ? candidatosParaLiberar[Math.floor(Math.random()*candidatosParaLiberar.length)]
          : elenco[0];
      }
      vaga[org] = liberado;
      pool.push(liberado.nome);
      rosterCopies[org][vaga[org].idx] = null; // vaga temporária
    });
    // Passo 2: cada time (ordem aleatória) tenta contratar o MELHOR disponível no mercado
    // (de qualquer outro time ou agente livre), pesando nacionalidade/proximidade/sinergia.
    // Se não achar ninguém que sirva, o próprio craque volta pro time de origem.
    shuffle(orgsParticipando).forEach(org=>{
      const restanteDoElenco = rosterCopies[org].filter(Boolean);
      const opcoes = shuffle(pool.filter(n=>n!==vaga[org].nome)).sort((a,b)=>pontuaCandidato(b,restanteDoElenco)-pontuaCandidato(a,restanteDoElenco));
      // Junta os primeiros candidatos que REALMENTE fecham o time (cobrem as 5 funções) e
      // sorteia entre eles com peso maior pros melhores — assim o mercado ainda respeita
      // nacionalidade/proximidade/sinergia (quem pontua mais tem mais chance), mas não repete
      // sempre o mesmo "candidato perfeito" toda vez que rodar de novo.
      const validos = [];
      for(const candidato of opcoes){
        const tentativa = [...rosterCopies[org]];
        tentativa[vaga[org].idx] = candidato;
        const rosterObjs = tentativa.map(n=>n && POOL.find(p=>p.name.toLowerCase()===n.toLowerCase())).filter(Boolean);
        if(rosterObjs.length===5 && canCompleteRoster(roles, rosterObjs)){
          validos.push(candidato);
          if(validos.length>=10) break;
        }
      }
      let contratado = null;
      if(validos.length>0){
        const pesos = validos.map((_,i)=>Math.sqrt(validos.length-i));
        const totalPeso = pesos.reduce((a,b)=>a+b,0);
        let sorteio = Math.random()*totalPeso;
        let idx = 0;
        while(idx<pesos.length-1 && sorteio>pesos[idx]){ sorteio -= pesos[idx]; idx++; }
        contratado = validos[idx];
        rosterCopies[org][vaga[org].idx] = contratado;
      }
      if(contratado){
        pool = pool.filter(n=>n!==contratado);
      } else if(pool.includes(vaga[org].nome)){
        // ninguém comprou o meu craque liberado ainda — volta pro time de origem, sem risco.
        rosterCopies[org][vaga[org].idx] = vaga[org].nome;
        pool = pool.filter(n=>n!==vaga[org].nome);
      } else {
        // meu craque liberado JÁ foi comprado por outro time antes de mim, e eu não achei
        // ninguém no mercado que sirva — busco um reforço de emergência fora do mercado atual
        // (na região, excluindo quem já está escalado em qualquer time) pra não ficar com
        // buraco nem duplicar o craque que já foi embora de verdade.
        const jaEscalados = new Set(Object.values(rosterCopies).flat().filter(Boolean).map(n=>n.toLowerCase()));
        if(excludeOrg && baseRosters[excludeOrg]) baseRosters[excludeOrg].players.filter(Boolean).forEach(n=>jaEscalados.add(n.toLowerCase()));
        if(usadosGlobalmente) usadosGlobalmente.forEach(n=>jaEscalados.add(n.toLowerCase()));
        ASCENSAO_EXCLUDED_PLAYERS.forEach(n=>jaEscalados.add(n));
        const emergencia = shuffle(POOL.filter(p=>!jaEscalados.has(p.name.toLowerCase())))
          .sort((a,b)=>pontuaCandidato(b.name, restanteDoElenco)-pontuaCandidato(a.name, restanteDoElenco));
        const validosEmergencia = [];
        for(const cand of emergencia){
          const tentativa = [...rosterCopies[org]];
          tentativa[vaga[org].idx] = cand.name;
          const rosterObjs = tentativa.map(n=>n && POOL.find(p=>p.name.toLowerCase()===n.toLowerCase())).filter(Boolean);
          if(rosterObjs.length===5 && canCompleteRoster(roles, rosterObjs)){
            validosEmergencia.push(cand.name);
            if(validosEmergencia.length>=10) break;
          }
        }
        if(validosEmergencia.length>0){
          const pesos = validosEmergencia.map((_,i)=>Math.sqrt(validosEmergencia.length-i));
          const totalPeso = pesos.reduce((a,b)=>a+b,0);
          let sorteio = Math.random()*totalPeso;
          let idx = 0;
          while(idx<pesos.length-1 && sorteio>pesos[idx]){ sorteio -= pesos[idx]; idx++; }
          rosterCopies[org][vaga[org].idx] = validosEmergencia[idx];
        }
      }
    });
  }
  return rosterCopies;
}

// parcial; quem não tem país/time confirmado simplesmente não conta pra essa sinergia.
function playerCountries(name){
  const lc = name.toLowerCase();
  return [PLAYER_COUNTRY[lc], PLAYER_RESIDENCE[lc]].filter(Boolean);
}

// competem na mesma região (NA). Funciona pra qualquer craque desses países, atual ou futuro.
const COUNTRY_SYNERGY_GROUP = { US:"NA_SYNERGY", CA:"NA_SYNERGY" };
function normalizeSynergyCountry(code){ return COUNTRY_SYNERGY_GROUP[code] || code; }
function chemistryBonus(roster, coachName){
  if(!roster || roster.length<2) return 0;
  const countryLists = roster.map(p=>playerCountries(p.name).map(normalizeSynergyCountry));
  const teamLists = roster.map(p=>PLAYER_TEAM[p.name.toLowerCase()] || []);
  function countExtraPairs(list){
    const counts = {};
    list.forEach(v=>{ counts[v]=(counts[v]||0)+1; });
    let extra = 0;
    Object.values(counts).forEach(n=>{ if(n>=2) extra += (n-1); }); // 2 juntos=+1, 3 juntos=+2, etc.
    return extra;
  }
  const countryPairs = countExtraPairs(countryLists.flat());
  const teamPairs = countExtraPairs(teamLists.flat());
  let coachBonus = 0;
  if(coachName){
    const residenciaCoach = COACH_RESIDENCE[coachName.toLowerCase()];
    const residenciasCoach = Array.isArray(residenciaCoach) ? residenciaCoach : [residenciaCoach];
    const ccList = [COACH_COUNTRY[coachName.toLowerCase()], ...residenciasCoach].filter(Boolean).map(normalizeSynergyCountry);
    const ct = COACH_TEAM[coachName.toLowerCase()];
    const ctRegional = COACH_REGIONAL_CHAMPION[coachName.toLowerCase()];
    if(ccList.length) coachBonus += roster.filter(p=>playerCountries(p.name).map(normalizeSynergyCountry).some(c=>ccList.includes(c))).length * 0.75;
    if(ct) coachBonus += roster.filter(p=>(PLAYER_TEAM[p.name.toLowerCase()]||[]).includes(ct)).length * 1.5;
    if(ctRegional) coachBonus += roster.filter(p=>(PLAYER_TEAM[p.name.toLowerCase()]||[]).includes(ctRegional)).length * 1.5;
  }
  return countryPairs*0.75 + teamPairs*1.5 + coachBonus; // já ter jogado junto pesa bem mais que só ser do mesmo país
}
// Técnico Campeão Mundial (está no COACH_TEAM) dá um bônus extra de +2, além do buff normal dele.
function coachBuff(coachName){
  if(!coachName) return 0;
  const chaveExata = coachName in COACH_BUFFS ? coachName : Object.keys(COACH_BUFFS).find(k=>k.toLowerCase()===coachName.toLowerCase());
  let b = chaveExata!==undefined ? COACH_BUFFS[chaveExata] : 0;
  if(COACH_TEAM[coachName.toLowerCase()]) b += 2;
  if(COACH_REGIONAL_CHAMPION[coachName.toLowerCase()]) b += ASCENSAO_REGIONAL_CHAMPION_BONUS;
  if(state.difficulty==="ascensao" && state.carreira){
    const nomeLower = coachName.toLowerCase();
    if((state.carreira.campeoesMundiaisCoach||[]).some(n=>n.toLowerCase()===nomeLower)) b += ASCENSAO_CHAMPION_BONUS;
    if((state.carreira.campeoesRegionaisCoach||[]).some(n=>n.toLowerCase()===nomeLower)) b += ASCENSAO_REGIONAL_CHAMPION_BONUS;
  }
  return b;
}

// Resolve a bandeira certa de um craque — se for o personagem do Rumo à Ascensão, usa o país
// que ele escolheu na criação; senão, usa o país real do craque como sempre.
function playerFlag(p){
  if(p.isCharacter) return countryFlag(p.country);
  return countryFlag(PLAYER_COUNTRY[p.name.toLowerCase()]);
}
function countryFlag(code){
  if(!code) return "";
  const cc = code.toUpperCase();
  const svg = FLAG_SVG[cc];
  if(svg){
    return `<svg viewBox="0 0 30 20" width="16" height="11" class="flag-img" style="vertical-align:middle;border-radius:1px;">${svg}</svg>`;
  }
  return `<span class="flag-fallback" style="display:inline-block;">${cc}</span>`;
}

/* ---------------- COMPOSITION BUFFS/NERFS ---------------- */
// Acha o jogador que ocupa uma função no time. Se "isSlotted" (nosso próprio time, sempre
// organizado por SLOT_ORDER), usa a vaga exata; se não (times de IA, sem vaga fixa), pega o
// primeiro jogador do elenco que consegue jogar naquela função.
function findRolePlayer(roster, roleKey, isSlotted){
  if(!roster || !roster.length) return null;
  if(isSlotted){
    const idx = SLOT_ORDER.indexOf(roleKey);
    return roster[idx] || null;
  }
  return roster.find(p=>p.roles && p.roles.includes(roleKey)) || null;
}
function hasTag(p, tag){ return !!(p && p.tags && p.tags.includes(tag)); }

// Calcula o bônus/penalidade de composição do time, separado em ataque e defesa.
// Entry empurra mais no ataque; Operator empurra mais na defesa (conforme pedido).
function compositionBonus(roster, isSlotted){
  if(!roster || !roster.length) return {attack:0, defense:0};
  let attack = 0, defense = 0;

  const duelist = findRolePlayer(roster, "duelist", isSlotted);
  const sentinel = findRolePlayer(roster, "sentinel", isSlotted);
  const initiator = findRolePlayer(roster, "initiator", isSlotted);

  // Duelista + Iniciador na equipe -> buff de ataque
  if(duelist && initiator) attack += 2;

  // Duelista + Iniciador do MESMO país, ou que já foram campeões mundiais juntos (mesmo elenco
  // real) -> buff extra geral, em cima do buff normal de tê-los os dois no time.
  if(duelist && initiator){
    const dCountries = [PLAYER_COUNTRY[duelist.name.toLowerCase()], PLAYER_RESIDENCE[duelist.name.toLowerCase()]].filter(Boolean);
    const iCountries = [PLAYER_COUNTRY[initiator.name.toLowerCase()], PLAYER_RESIDENCE[initiator.name.toLowerCase()]].filter(Boolean);
    const sameCountry = dCountries.some(c=>iCountries.includes(c));
    const dTeams = PLAYER_TEAM[duelist.name.toLowerCase()] || [];
    const iTeams = PLAYER_TEAM[initiator.name.toLowerCase()] || [];
    const alreadyChampionsTogether = dTeams.some(tm=>iTeams.includes(tm));
    if(sameCountry || alreadyChampionsTogether){ attack += 2; defense += 2; }
    if(sameCountry && alreadyChampionsTogether){ attack += 1; defense += 1; } // os dois ao mesmo tempo: um pouco a mais
  }

  // Operator no Duelista/Sentinela: 1 usuário = buff na defesa; os 2 ao mesmo tempo = nerf geral
  const opUsers = [duelist, sentinel].filter(p=>hasTag(p,"operator")).length;
  if(opUsers===1) defense += 3;
  else if(opUsers===2){ attack -= 2; defense -= 2; }

  // 2+ jogadores com clutch = buff geral
  const clutchCount = roster.filter(p=>hasTag(p,"clutch")).length;
  if(clutchCount>=2){ attack += 2; defense += 2; }

  // IGL: nenhum = nerf sempre; 1 ou 2 = buff (time bem liderado); 3+ = nerf (líderes demais
  // atrapalhando um ao outro), EXCETO em Seleções da Copa do Mundo (lá não pune o excesso).
  const iglCount = roster.filter(p=>hasTag(p,"igl")).length;
  const selecaoKey = rosterSelecaoKey(roster);
  if(iglCount===0){ attack -= 3; defense -= 3; }
  else if(iglCount===1 || iglCount===2){ attack += 2; defense += 2; }
  else if(iglCount>=3 && !selecaoKey){ attack -= 2; defense -= 2; }

  // Seleção "mista" (combinada de vários países, tipo Finlândia/Suécia) leva um nerf leve —
  // o entrosamento de uma seleção de país único é sempre um pouco melhor.
  if(selecaoKey && selecaoKey.includes("/")){ attack -= 1.5; defense -= 1.5; }

  // Cobertura das 5 funções (no nosso sistema de vagas isso é sempre verdade, mas fica a checagem)
  if(isSlotted && SLOT_ORDER.some((rk,i)=>!roster[i])){ attack -= 4; defense -= 4; }

  // Campeões Mundiais: quanto mais, mais buff
  const championCount = roster.filter(p=>hasTag(p,"campeao_mundial")).length;
  attack += championCount*1.5; defense += championCount*1.5;

  // Entry no Duelista: buff se tiver, nerf se não tiver
  if(duelist){
    attack += hasTag(duelist,"entry") ? 2 : -2;
  }

  // Utilidade: quanto mais, melhor — buff cresce direto com a quantidade, sem teto e sem nerf.
  const utilCount = roster.filter(p=>hasTag(p,"utility")).length;
  if(utilCount>0){
    const bonus = utilCount*1.5;
    attack += bonus; defense += bonus;
  }

  // Lurker no Sentinela: buff se tiver, nerf se não tiver
  if(sentinel){
    if(hasTag(sentinel,"lurker")){ attack += 2; defense += 2; }
    else { attack -= 1.5; defense -= 1.5; }
  }
  // Exceção: C0M dá o buff de Lurker mesmo fora da Sentinela (não depende da função dele).
  const lurkerExceptionNames = ["c0m"];
  const lurkerException = roster.find(p=>p!==sentinel && lurkerExceptionNames.includes(p.name.toLowerCase()) && hasTag(p,"lurker"));
  if(lurkerException){ attack += 2; defense += 2; }

  // Mira Monstra: quanto mais jogadores com a tag, mais buff (sem teto)
  const mmCount = roster.filter(p=>hasTag(p,"mm")).length;
  attack += mmCount*1.5; defense += mmCount*1.5;

  return {attack, defense};
}

// Gera a tabela de turno e returno (todo mundo enfrenta todo mundo 2x) pelo método do círculo.
// Retorna uma lista de "rodadas", cada rodada é uma lista de confrontos [timeA, timeB].
function roundRobinSchedule(teams){
  let list = teams.slice();
  if(list.length % 2 !== 0) list.push(null); // bye fantasma se for ímpar
  const n = list.length;
  const turno = [];
  for(let r=0; r<n-1; r++){
    const rodada = [];
    for(let i=0; i<n/2; i++){
      const a = list[i], b = list[n-1-i];
      if(a && b) rodada.push([a,b]);
    }
    turno.push(rodada);
    list = [list[0], ...list.slice(2), list[1]];
  }
  return [...turno, ...turno]; // returno = repete a mesma tabela (turno e returno)
}
// Conta a rodada como "1, 2, 3..." só contando as rodadas em que o jogador realmente joga —
// ignora as rodadas de folga (que existem quando o grupo tem número ímpar de times).
function regionalPlayerRoundNumber(schedule, roundIdx){
  let atual = 0, total = 0;
  schedule.forEach((rodada, i)=>{
    const jogaNessaRodada = rodada.some(([a,b])=>a.isPlayer || b.isPlayer);
    if(jogaNessaRodada){
      total++;
      if(i<=roundIdx) atual = total;
    }
  });
  return {atual, total};
}

        <p>Crie seu próprio craque — função, qualidades táticas e nacionalidade — e viva uma carreira de <strong>16 temporadas</strong>. A cada ano você disputa o Regional; classificando, também disputa o Mundial; e a cada poucas temporadas, a Copa do Mundo pela Seleção do seu país.</p>

      `},

    changelogSections:[
      {title:"v 1.0 → v 1.1", body:`
        <p><strong>Visual novo</strong> — layout inteiro atualizado: mais limpo, moderno e responsivo tanto no computador quanto no celular, com as fontes certas carregando pela primeira vez.</p>
        <p><strong>Ascensão sem repetição</strong> — o mercado agora lembra as trocas de temporadas anteriores em vez de recalcular tudo do zero, então os times evoluem de verdade ao longo da carreira. Craques fora da sua região tendem a voltar pra casa com o tempo.</p>
        <p><strong>Ofertas de transferência mais inteligentes</strong> — só chegam ofertas pras funções que você escolheu (principal ou secundárias), mostrando a função e o técnico atual do time antes de aceitar. A Seleção na Copa do Mundo sempre usa sua função principal.</p>
        <p><strong>Troca de função por contratação</strong> — se uma contratação nova deixaria seu time melhor numa função secundária, o jogo pergunta antes de trocar, em vez de decidir sozinho.</p>
        <p><strong>Regra de IGL ajustada</strong> — 1 ou 2 craques com IGL no time agora dão buff; só a partir de 3 é que vira nerf.</p>
        <p>Além disso: mais craques novas adicionadas ao banco, e mais correções de bugs no mercado de transferências.</p>

      {title:"Beta → v 1.0", body:`
        <p><strong>Rumo à Ascensão</strong> — modo de carreira completo: crie seu craque, jogue 16 temporadas passando por Regional, Mundial e Copa do Mundo, receba ofertas de outros times e acompanhe sua história até o fim.</p>
        <p><strong>Mercado de transferências</strong> — times reais trocam craques e técnicos entre si a cada temporada, levando em conta nacionalidade, proximidade de região e sinergia. Agentes livres também entram no mercado.</p>
        <p><strong>Temas visuais</strong> — o Modo Selva ganhou um visual vermelho escuro e denso, e a Copa do Mundo muda de cor de acordo com a Seleção escolhida.</p>
        <p><strong>MVP e recordes</strong> — MVP da campanha aparece ao ser campeão de qualquer competição, e recordes quebrados durante uma campanha do Ascensão valem até o fim dela.</p>
        <p><strong>Campeãs Mundiais e Regionais</strong> — dezenas de craques novas adicionadas ao banco, com bônus permanente pra quem já foi campeã de verdade e sinergia entre quem jogou junto.</p>
        <p>Além disso: várias correções de bugs, ajustes de equilíbrio no mercado, e a tela de Campanhas Anteriores agora também guarda as carreiras do Ascensão.</p>

    rulesSections:[
      {title:"Team & Head Coach", body:`
        <p>You choose your team's name from 16 real organizations — the other 15 become your rivals at the World Championship. Then 4 coaches are drawn for you to pick one; the other 15 go to rival teams. Each coach grants a fixed (hidden) rating bonus — it applies to whichever team has that coach. Coaches who've already been <strong>World Champions</strong> add an extra bonus on top. World titles counted: <strong>Champions, Masters, and EWC</strong>.</p>
      `},
      {title:"The Draft", body:`
        <p>The team has 5 fixed slots: <strong>Duelist, Flex, Initiator, Controller, Sentinel</strong>. A pro can only fill a slot for a role they actually play — many play more than one.</p>
        <p>Each draw shows <strong>5 options</strong>, and it's smart about it: only pros with at least one matching open slot show up. You can skip the group of 5 at most <strong>2 times</strong> in the whole draft.</p>
      `},
      {title:"Tactical Qualities", body:`
        <ul>
          <li><strong>Monster Aim (MM):</strong> insane aim — more chance of monster games.</li>
          <li><strong>Entry:</strong> aggressive, opens the round — boosts attack, especially on the Duelist.</li>
          <li><strong>Operator:</strong> precision rifle specialist — boosts defense.</li>
          <li><strong>Clutch:</strong> closes out rounds under pressure.</li>
          <li><strong>IGL:</strong> the team's tactical brain.</li>
          <li><strong>Lurker:</strong> plays solo, flanks — important on the Sentinel.</li>
          <li><strong>Utility:</strong> ability usage.</li>
          <li><strong>World Champion:</strong> already lifted a trophy — experience that counts.</li>
        </ul>
      `},
      {title:"Team Synergies (buffs & nerfs)", body:`
        <p>Your roster's composition silently affects attack and defense every round — and the team switches sides every 12 rounds, just like a real map.</p>
        <div class="rules-good">✓ ADVANTAGES</div>
        <ul>
          <li>Duelist + Initiator on the team: attack buff.</li>
          <li>Duelist and Initiator from the same country, or already World Champions together: extra general buff (a bit more if both at once).</li>
          <li>Exactly 1 Operator user (Duelist or Sentinel): defense buff.</li>
          <li>2+ players with Clutch: general buff.</li>
          <li>World Champions on the roster: general buff, grows with each one.</li>
          <li>Duelist with Entry: attack buff.</li>
          <li>Players with Utility: general buff, grows with each one — no cap.</li>
          <li>Sentinel with Lurker: general buff.</li>
          <li>Players with Monster Aim: general buff, uncapped.</li>
        </ul>
        <div class="rules-bad">✗ DISADVANTAGES</div>
        <ul>
          <li>Duelist <em>and</em> Sentinel both using Operator: general nerf.</li>
          <li>No player with IGL: general nerf.</li>
          <li>1 or 2 players with IGL: general buff (well-led team).</li>
          <li>3 or more players with IGL: general nerf (doesn't apply to World Cup national teams).</li>
          <li>Duelist without Entry: attack nerf.</li>
          <li>Sentinel without Lurker: general nerf.</li>
        </ul>
      `},
      {title:"Roster Chemistry (country & real team)", body:`
        <p>On top of composition synergies, there's an extra silent bonus based on real vlr.gg data: pros from the <strong>same country</strong> get a small buff, and pros who <strong>became World Champions together</strong> — on the actual roster that lifted the trophy — get an even bigger buff. Your Head Coach counts too, if they coached one of those championship rosters.</p>
        <p>Important: this "played together" bonus doesn't apply to any two players who happened to pass through the same org at different times — it's specific to rosters that <strong>won a World Championship together</strong> (e.g. LOUD 2022, Evil Geniuses 2023). World titles counted: <strong>Champions, Masters, and EWC</strong>. Coverage of this database is partial and keeps growing over time.</p>
      `},
      {title:"World Championship Format", body:`
        <p>16 teams (you + 15 rivals) split into <strong>4 groups of 4</strong>. You face the other 3 in your group; the rest is resolved automatically. The <strong>Top 2</strong> from each group (8 teams) advance to the playoffs.</p>
        <p>The playoffs are <strong>double elimination</strong> (Upper/Lower Bracket): losing in Upper drops you to Lower (still alive); losing in Lower eliminates you. Every match is <strong>Bo3</strong>, except the Lower Bracket Final and the Grand Final, which are <strong>Bo5</strong>.</p>
        <p>Each map goes to <strong>13 rounds</strong> — but if it ties <strong>12-12</strong>, it goes to <strong>overtime</strong>: hitting 13 alone doesn't close the map, you need a <strong>2-round lead</strong> (13-12 isn't enough; it only ends at 14-12, or 15-13, and so on), just like the real game.</p>
      `},
      {title:"Real-World Records", body:`
        <p>There are 3 real pro-scene records: <strong>47 kills</strong> in a single map, <strong>82</strong> in a Bo3 series (both by aspas), and <strong>126</strong> in a Bo5 series (by marteen). Players with Monster Aim and 95+ overall have a rare shot at beating them in a monster game. The record "to beat" applies to both sides — your team or the opponent — and once broken, it becomes the new record <strong>for the rest of the campaign</strong> (even if the AI breaks it first). Everything resets to the real marks once the campaign ends.</p>
      `},
      {title:"Campaign MVP", body:`
        <p>Only shown if you become World Champion: the pro with the best score (kills + half the assists − deaths) added up across the whole campaign.</p>
      `},
      {title:"Classic Mode vs Wild Mode", body:`
        <p>In <strong>Classic</strong>, you see each pro's overall and tactical qualities during the draft. In <strong>Wild</strong>, all of that stays hidden — you recruit on name and reputation alone.</p>
      `},
      {title:"World Cup", body:`
        <p>Instead of picking an organization, you pick a <strong>national team</strong> — the draft only draws pros who play for that country (some national teams are combined from smaller countries, like Finland/Sweden). The Head Coach also comes only from that national team's own list.</p>
        <p>Everything else works like the normal mode: group stage, playoffs, all of it — except the other 15 rival "teams" are national teams too, each with their own real roster.</p>
        <p>World Cup-specific rule difference: the "3 or more IGL" nerf doesn't apply here (a real national team having several tactical leaders is normal).</p>
      `},
      {title:"Regional Mode", body:`
        <p>Pick a region (BR, NA, LAS, EMEA, APAC or CHN) and a real team from there — the draft only draws pros who actually play in that region. Bigger regions go through a group stage before playoffs; smaller ones go straight to the bracket.</p>
      `},
      {title:"Road to the Top", body:`
        <p>Create your own pro — role, tactical qualities, and nationality — and live a <strong>16-season</strong> career. Every year you compete in your Regional; qualifying also gets you into Worlds; and every few seasons, the World Cup with your country's national team.</p>
        <p>Between seasons, real teams make transfers among themselves, and you can also receive offers from other organizations.</p>
      `},
    ],
    changelogSections:[
      {title:"v 1.0 → v 1.1", body:`
        <p><strong>New visuals</strong> — the whole layout got an update: cleaner, more modern, and properly responsive on both desktop and mobile, with the right fonts loading for the first time.</p>
        <p><strong>Road to the Top without the repetition</strong> — the market now remembers previous seasons' trades instead of recalculating everything from scratch, so teams genuinely evolve over a career. Players outside their home region tend to move back over time.</p>
        <p><strong>Smarter transfer offers</strong> — offers only come for roles you chose (primary or secondary), and show the role and the team's current coach before you accept. The World Cup national team always uses your primary role.</p>
        <p><strong>Role switch on signing</strong> — if a new signing would make your team better off with you in a secondary role, the game asks before switching instead of deciding on its own.</p>
        <p><strong>IGL rule adjusted</strong> — 1 or 2 players with IGL on the team now give a buff; only 3 or more turns into a nerf.</p>
        <p>Also: more new pros added to the pool, and more bug fixes in the transfer market.</p>
      `},
      {title:"Beta → v 1.0", body:`
        <p><strong>Road to the Top</strong> — full career mode: create your pro, play 16 seasons through Regional, Worlds, and the World Cup, receive offers from other teams, and follow your story to the end.</p>
        <p><strong>Transfer market</strong> — real teams trade players and coaches among themselves every season, factoring in nationality, region proximity, and synergy. Free agents also join the market.</p>
        <p><strong>Visual themes</strong> — Selva Mode got a dark, dense red look, and the World Cup changes color based on the national team you pick.</p>
        <p><strong>MVP and records</strong> — campaign MVP shows up whenever you win any competition, and records broken during a Road to the Top career hold until the career ends.</p>
        <p><strong>World and Regional Champions</strong> — dozens of new pros added to the pool, with a permanent bonus for real-life champions and synergy for those who played together.</p>
        <p>Also: several bug fixes, market balance tweaks, and the Previous Campaigns screen now also saves Road to the Top careers.</p>
      `},
    ],
  },
