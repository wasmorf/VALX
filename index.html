<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALX — Monte e ganhe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#080F14;
    --bg-panel:#111920;
    --bg-panel-2:#19222A;
    --line:#28323B;
    --crimson:#FF4655;
    --crimson-dim:#7A2430;
    --teal:#33DFC0;
    --gold:#E8B84B;
    --text:#F5F5F5;
    --muted:#6B7280;
    --glow-a:#17202A;
    --glow-b:#1B1216;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--glow-a) 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, var(--glow-b) 0%, transparent 55%),
      var(--bg-deep);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background 0.25s ease;
  }
  .headline{font-family:'Chakra Petch', sans-serif;}
  .mono{font-family:'JetBrains Mono', monospace;}

  #app{max-width:680px;margin:0 auto;padding:20px 16px 60px;}

  .angle{
    clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  }
  .angle-sm{
    clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }

  /* ---- top bar ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-top:6px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand:active{opacity:0.7;}
  .brand-mark{width:30px;height:30px;flex:none;color:var(--crimson);}
  .brand-text{display:flex;flex-direction:column;}
  .brand-name{font-family:'Chakra Petch';font-weight:700;font-size:19px;letter-spacing:0.5px;line-height:1;}
  .brand-name span{color:var(--crimson);}
  .phase-tag{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:2px;}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .lang-switch{display:flex;border:1px solid var(--line);}
  .lang-btn{
    font-family:'JetBrains Mono';font-size:10px;color:var(--muted);background:transparent;
    border:none;padding:6px 8px;cursor:pointer;letter-spacing:0.5px;
  }
  .lang-btn + .lang-btn{border-left:1px solid var(--line);}
  .lang-btn.active{background:var(--crimson);color:#fff;}

  /* ---- generic panel ---- */
  .panel{background:var(--bg-panel);border:1px solid var(--line);padding:22px;}
  .panel + .panel{margin-top:14px;}

  h1.hero{font-family:'Chakra Petch';font-size:30px;line-height:1.15;font-weight:700;margin:0 0 10px;}
  p.lead{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 20px;}

  .btn{
    font-family:'Chakra Petch';font-weight:600;font-size:15px;
    background:var(--crimson);color:#fff;border:none;padding:13px 22px;
    cursor:pointer;letter-spacing:0.3px;
  }
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  /* ---- difficulty cards ---- */
  .diff-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:8px;}
  .diff-card{
    background:var(--bg-panel-2);border:1px solid var(--line);padding:16px;cursor:pointer;
    text-align:left;color:var(--text);
  }
  .diff-card.selected{border-color:var(--crimson);background:#20141A;}
  .diff-card h3{font-family:'Chakra Petch';margin:0 0 4px;font-size:16px;}
  .diff-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4;}

  /* ---- team select ---- */
  .team-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0;}
  .selecao-grid{display:grid;grid-template-columns:1fr;gap:8px;margin:18px 0;}
  .team-option{
    background:var(--bg-panel-2);border:1px solid var(--line);padding:14px 8px;
    text-align:center;cursor:pointer;color:var(--text);
    font-family:'Chakra Petch';font-weight:700;font-size:14px;letter-spacing:0.3px;
  }
  .team-option.selected{border-color:var(--crimson);background:#20141A;color:var(--crimson);}

  /* ---- coach select ---- */
  .coach-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;}
  .coach-option{
    background:var(--bg-panel-2);border:1px solid var(--line);padding:20px 8px;
    text-align:center;cursor:pointer;color:var(--text);
  }
  .coach-option .coach-name{font-family:'Chakra Petch';font-weight:700;font-size:15px;}
  .coach-option.selected{border-color:var(--crimson);background:#20141A;color:var(--crimson);}

  /* ---- roster slots ---- */
  .roster-strip{display:flex;gap:8px;margin-bottom:16px;}
  .slot{
    flex:1;min-width:0;height:64px;border:1px dashed var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'JetBrains Mono';font-size:8.5px;color:var(--muted);background:var(--bg-panel);
    text-align:center;padding:0 3px;letter-spacing:0.2px;text-transform:uppercase;
  }
  .slot.filled{border:1px solid var(--teal);background:#0E1F1B;color:var(--text);}
  .slot .slot-name{font-family:'Chakra Petch';font-size:12px;font-weight:600;text-align:center;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;}
  .slot .slot-role{color:var(--teal);margin-top:2px;}

  /* ---- draft candidate card ---- */
  .candidate{background:var(--bg-panel-2);border:1px solid var(--line);padding:20px;text-align:center;}
  .candidate-list{display:flex;flex-direction:column;gap:8px;}
  .candidate-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--bg-panel-2);border:1px solid var(--line);padding:12px 14px;
    cursor:pointer;color:var(--text);text-align:left;
  }
  .candidate-row:active{border-color:var(--crimson);}
  .candidate-row .cr-name{font-family:'Chakra Petch';font-weight:700;font-size:15px;}
  .candidate-row .cr-roles{color:var(--teal);font-family:'JetBrains Mono';font-size:10px;margin-top:2px;}
  .candidate-row .cr-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
  .candidate-row .cr-tag{
    background:var(--bg-panel);border:1px solid var(--line);color:var(--muted);
    font-family:'JetBrains Mono';font-size:9px;padding:2px 6px;text-transform:uppercase;
  }
  .candidate-row .cr-ovr{font-size:16px;color:var(--gold);flex:none;}
  .candidate-row.synergy-highlight, .candidate.synergy-highlight{border-color:var(--teal);background:#0E1F1B;}
  .cr-synergy{
    display:flex;align-items:center;gap:4px;margin-top:5px;
    font-family:'JetBrains Mono';font-size:9.5px;color:var(--teal);
  }
  .cand-name{font-family:'Chakra Petch';font-size:24px;font-weight:700;margin:2px 0;}
  .cand-meta{color:var(--muted);font-size:13px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .cand-meta .role-pill{color:var(--teal);border:1px solid var(--teal);border-radius:3px;padding:2px 7px;font-family:'JetBrains Mono';font-size:11px;}
  .tag-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 2px;}
  .tag-chip{
    background:var(--bg-panel);border:1px solid var(--line);color:var(--text);
    font-family:'JetBrains Mono';font-size:10px;padding:4px 8px;
    text-transform:uppercase;letter-spacing:0.3px;
  }
  .overall-badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);
    font-family:'Chakra Petch';font-size:20px;font-weight:700;margin:10px auto 4px;color:var(--gold);
  }
  .hidden-stats{color:var(--muted);font-size:13px;font-style:italic;padding:10px 0;}

  /* ---- pool counter ---- */
  .pool-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--muted);font-size:13px;font-family:'JetBrains Mono';}

  /* ---- match screen ---- */
  .vs-row{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;}
  .team-block{flex:1;text-align:center;}
  .team-name{font-family:'Chakra Petch';font-weight:700;font-size:15px;}
  .team-sub{color:var(--muted);font-size:11px;margin-top:2px;}
  .score{font-family:'Chakra Petch';font-size:44px;font-weight:700;letter-spacing:2px;}
  .score .sep{color:var(--muted);font-size:30px;margin:0 10px;}
  .vs-x{color:var(--muted);font-family:'JetBrains Mono';font-size:13px;padding:0 14px;}
  .round-log{
    font-family:'JetBrains Mono';font-size:11px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:4px;margin:16px 0;min-height:24px;
  }
  .round-log .r{width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:2px;font-size:10px;}
  .round-log .r.win{background:var(--crimson-dim);color:#fff;}
  .round-log .r.loss{background:#26313A;color:var(--muted);}

  /* ---- roster / KDA compare ---- */
  .roster-compare{display:flex;gap:10px;margin:16px 0;}
  .roster-col{flex:1;min-width:0;}
  .roster-col-title{
    font-family:'JetBrains Mono';font-size:10px;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;text-align:center;
  }
  .roster-player{
    display:flex;justify-content:space-between;align-items:baseline;gap:4px;
    padding:5px 0;border-bottom:1px solid var(--line);
  }
  .roster-player:last-child{border-bottom:none;}
  .roster-player .pname{
    font-family:'Chakra Petch';font-size:12px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .roster-player .pkda{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);flex:none;}

  .record-banner{
    background:linear-gradient(135deg, #241405, #1a0f04);
    border:1px solid var(--gold);color:var(--gold);
    font-family:'Chakra Petch';font-weight:600;font-size:13px;line-height:1.4;
    padding:12px 14px;margin:14px 0;text-align:center;
    box-shadow:0 0 16px rgba(232,184,75,0.25);
  }

  .result-banner{text-align:center;padding:14px 0;margin-bottom:6px;}
  .result-banner.win{color:var(--teal);}
  .result-banner.loss{color:var(--crimson);}
  .result-banner .label{font-family:'Chakra Petch';font-size:22px;font-weight:700;}


  /* ---- trophy screen ---- */
  .trophy-wrap{text-align:center;padding:20px 0;}
  .trophy-icon{font-size:64px;margin-bottom:6px;}
  .trophy-title{font-family:'Chakra Petch';font-size:28px;font-weight:700;color:var(--gold);margin:6px 0;}

  .final-roster{display:flex;flex-direction:column;gap:8px;margin:18px 0;}
  .fr-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg-panel-2);border:1px solid var(--line);padding:10px 14px;}
  .fr-item .n{font-family:'Chakra Petch';font-weight:600;font-size:14px;}
  .fr-item .r{color:var(--muted);font-size:12px;}
  .fr-item .o{font-family:'JetBrains Mono';color:var(--gold);}

  .mvp-card{
    background:linear-gradient(135deg, #241405, #1a0f04);
    border:1px solid var(--gold);padding:16px;text-align:center;margin:18px 0;
  }
  .mvp-card .mvp-eyebrow{font-family:'JetBrains Mono';font-size:10px;color:var(--gold);letter-spacing:1px;margin-bottom:6px;}
  .mvp-card .mvp-name{font-family:'Chakra Petch';font-size:20px;font-weight:700;color:#fff;}
  .mvp-card .mvp-role{color:var(--muted);font-size:12px;margin:2px 0 8px;}
  .mvp-card .mvp-kda{font-family:'JetBrains Mono';color:var(--gold);font-size:14px;}
  .mvp-tag{
    font-family:'JetBrains Mono';font-size:9px;color:var(--bg-deep);background:var(--gold);
    padding:2px 5px;margin-left:6px;border-radius:2px;letter-spacing:0.5px;vertical-align:middle;
  }

  /* ---- share buttons ---- */
  .share-row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .share-btn{
    display:flex;align-items:center;gap:7px;
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);
    font-family:'Chakra Petch';font-weight:600;font-size:13px;padding:10px 16px;
    cursor:pointer;
  }
  .share-btn:active{border-color:var(--crimson);}
  .share-btn svg{flex:none;}

  /* ---- journey / tournament path table ---- */
  .journey-table{margin:16px 0;border:1px solid var(--line);}
  .journey-row{
    display:flex;align-items:center;gap:8px;padding:9px 10px;
    border-bottom:1px solid var(--line);font-size:12px;
  }
  .journey-row:last-child{border-bottom:none;}
  .journey-row .jr-stage{flex:1.3;min-width:0;color:var(--muted);font-family:'JetBrains Mono';font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .journey-row .jr-opp{flex:1;min-width:0;font-family:'Chakra Petch';font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .journey-row .jr-score{flex:none;font-family:'JetBrains Mono';color:var(--text);}
  .journey-row .jr-result{flex:none;width:20px;text-align:center;font-family:'Chakra Petch';font-weight:700;font-size:12px;}
  .journey-row .jr-result.win{color:var(--teal);}
  .journey-row .jr-result.loss{color:var(--crimson);}

  .disclaimer{color:var(--muted);font-size:11px;line-height:1.5;margin-top:24px;text-align:center;}

  /* ---- rules screen ---- */
  .rules-btn-row{text-align:center;margin-top:10px;}
  .rules-link{
    background:none;border:none;color:var(--muted);font-family:'JetBrains Mono';
    font-size:11px;text-decoration:underline;letter-spacing:0.3px;cursor:pointer;padding:6px;
  }
  .rules-section{margin-bottom:22px;}
  .rules-section h3{
    font-family:'Chakra Petch';color:var(--crimson);font-size:15px;font-weight:700;
    margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);
    letter-spacing:0.3px;
  }
  .rules-section p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 8px;}
  .rules-section ul{color:var(--muted);font-size:13px;line-height:1.6;margin:6px 0;padding-left:20px;}
  .rules-section li{margin-bottom:5px;}
  .rules-section strong{color:var(--text);}
  .rules-good{color:var(--teal);font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.5px;margin:10px 0 4px;}
  .rules-bad{color:var(--crimson);font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.5px;margin:10px 0 4px;}

  /* ---- country flag (image + graceful text fallback if it fails to load) ---- */
  .flag-img{display:inline-block;vertical-align:middle;border-radius:1px;}
  .version-badge{
    position:fixed;bottom:6px;right:8px;
    font-family:'JetBrains Mono';font-size:9px;color:var(--muted);
    opacity:0.55;letter-spacing:0.3px;pointer-events:none;z-index:50;
  }
  .flag-fallback{
    display:none;vertical-align:middle;
    font-family:'JetBrains Mono';font-size:8.5px;font-weight:700;letter-spacing:0.3px;
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--muted);
    padding:1px 3px;border-radius:2px;line-height:1.3;
  }

  /* ---- campaign history ---- */
  .history-list{display:flex;flex-direction:column;gap:10px;}
  .history-item{background:var(--bg-panel-2);border:1px solid var(--line);padding:12px 14px;}
  .history-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .history-team{font-family:'Chakra Petch';font-weight:700;font-size:14px;}
  .history-date{color:var(--muted);font-size:10px;}
  .history-result{font-family:'Chakra Petch';font-weight:600;font-size:13px;margin-bottom:4px;}
  .history-meta{color:var(--muted);font-size:10.5px;}
  .footer-social{display:flex;justify-content:center;margin-top:20px;}
  .social-link{
    width:44px;height:44px;border-radius:11px;background:#0A0A0A;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#F5F5F5;
    text-decoration:none;transition:border-color .2s, transform .15s;cursor:pointer;
  }
  .social-link:hover{border-color:var(--crimson);transform:translateY(-1px);}
</style>
</head>
<body>
<div id="app"></div>
<div class="version-badge">Beta · 11/09/2026</div>

// Sinergia: quanto mais craques do MESMO time real (vlr.gg) ou do MESMO país estiverem juntos na
// equipe, maior o buff — e o Head Coach também entra nessa conta (país em comum com os jogadores,
// ou já ter trabalhado com o mesmo time real que algum craque do elenco). Cobertura de dados é
// parcial; quem não tem país/time confirmado simplesmente não conta pra essa sinergia.
function chemistryBonus(roster, coachName){
  if(!roster || roster.length<2) return 0;
  function playerCountries(name){
    const lc = name.toLowerCase();
    return [PLAYER_COUNTRY[lc], PLAYER_RESIDENCE[lc]].filter(Boolean);
  }
  const countryLists = roster.map(p=>playerCountries(p.name));
  const teamLists = roster.map(p=>PLAYER_TEAM[p.name.toLowerCase()] || []);
  function countExtraPairs(list){
    const counts = {};
    list.forEach(v=>{ counts[v]=(counts[v]||0)+1; });
    let extra = 0;
    Object.values(counts).forEach(n=>{ if(n>=2) extra += (n-1); }); // 2 juntos=+1, 3 juntos=+2, etc.
    return extra;
  }
  const countryPairs = countExtraPairs(countryLists.flat());
  const teamPairs = countExtraPairs(teamLists.flat());
  let coachBonus = 0;
  if(coachName){
    const cc = COACH_COUNTRY[coachName.toLowerCase()];
    const ct = COACH_TEAM[coachName.toLowerCase()];
    if(cc) coachBonus += roster.filter(p=>playerCountries(p.name).includes(cc)).length * 0.75;
    if(ct) coachBonus += roster.filter(p=>(PLAYER_TEAM[p.name.toLowerCase()]||[]).includes(ct)).length * 1.5;
  }
  return countryPairs*0.75 + teamPairs*1.5 + coachBonus; // já ter jogado junto pesa bem mais que só ser do mesmo país
}
// Técnico Campeão Mundial (está no COACH_TEAM) dá um bônus extra de +2, além do buff normal dele.
function coachBuff(coachName){
  let b = COACH_BUFFS[coachName] || 0;
  if(coachName && COACH_TEAM[coachName.toLowerCase()]) b += 2;
  return b;
}

/* ---------------- COMPOSITION BUFFS/NERFS ---------------- */
// Acha o jogador que ocupa uma função no time. Se "isSlotted" (nosso próprio time, sempre
// organizado por SLOT_ORDER), usa a vaga exata; se não (times de IA, sem vaga fixa), pega o
// primeiro jogador do elenco que consegue jogar naquela função.
function findRolePlayer(roster, roleKey, isSlotted){
  if(!roster || !roster.length) return null;
  if(isSlotted){
    const idx = SLOT_ORDER.indexOf(roleKey);
    return roster[idx] || null;
  }
  return roster.find(p=>p.roles && p.roles.includes(roleKey)) || null;
}
function hasTag(p, tag){ return !!(p && p.tags && p.tags.includes(tag)); }

// Calcula o bônus/penalidade de composição do time, separado em ataque e defesa.
// Entry empurra mais no ataque; Operator empurra mais na defesa (conforme pedido).
function compositionBonus(roster, isSlotted){
  if(!roster || !roster.length) return {attack:0, defense:0};
  let attack = 0, defense = 0;

  const duelist = findRolePlayer(roster, "duelist", isSlotted);
  const sentinel = findRolePlayer(roster, "sentinel", isSlotted);
  const initiator = findRolePlayer(roster, "initiator", isSlotted);

  // Duelista + Iniciador na equipe -> buff de ataque
  if(duelist && initiator) attack += 2;

  // Duelista + Iniciador do MESMO país, ou que já foram campeões mundiais juntos (mesmo elenco
  // real) -> buff extra geral, em cima do buff normal de tê-los os dois no time.
  if(duelist && initiator){
    const dCountries = [PLAYER_COUNTRY[duelist.name.toLowerCase()], PLAYER_RESIDENCE[duelist.name.toLowerCase()]].filter(Boolean);
    const iCountries = [PLAYER_COUNTRY[initiator.name.toLowerCase()], PLAYER_RESIDENCE[initiator.name.toLowerCase()]].filter(Boolean);
    const sameCountry = dCountries.some(c=>iCountries.includes(c));
    const dTeams = PLAYER_TEAM[duelist.name.toLowerCase()] || [];
    const iTeams = PLAYER_TEAM[initiator.name.toLowerCase()] || [];
    const alreadyChampionsTogether = dTeams.some(tm=>iTeams.includes(tm));
    if(sameCountry || alreadyChampionsTogether){ attack += 2; defense += 2; }
    if(sameCountry && alreadyChampionsTogether){ attack += 1; defense += 1; } // os dois ao mesmo tempo: um pouco a mais
  }

  // Operator no Duelista/Sentinela: 1 usuário = buff na defesa; os 2 ao mesmo tempo = nerf geral
  const opUsers = [duelist, sentinel].filter(p=>hasTag(p,"operator")).length;
  if(opUsers===1) defense += 3;
  else if(opUsers===2){ attack -= 2; defense -= 2; }

  // 2+ jogadores com clutch = buff geral
  const clutchCount = roster.filter(p=>hasTag(p,"clutch")).length;
  if(clutchCount>=2){ attack += 2; defense += 2; }

  // IGL: nenhum ou mais de 1 = nerf; exatamente 1 = neutro
  const iglCount = roster.filter(p=>hasTag(p,"igl")).length;
  if(iglCount===0){ attack -= 3; defense -= 3; }
  else if(iglCount>1){ attack -= 2; defense -= 2; }

  // Cobertura das 5 funções (no nosso sistema de vagas isso é sempre verdade, mas fica a checagem)
  if(isSlotted && SLOT_ORDER.some((rk,i)=>!roster[i])){ attack -= 4; defense -= 4; }

  // Campeões Mundiais: quanto mais, mais buff
  const championCount = roster.filter(p=>hasTag(p,"campeao_mundial")).length;
  attack += championCount*1.5; defense += championCount*1.5;

  // Entry no Duelista: buff se tiver, nerf se não tiver
  if(duelist){
    attack += hasTag(duelist,"entry") ? 2 : -2;
  }

  // Utilidade: buff crescente até 3 jogadores, depois disso um pequeno nerf
  const utilCount = roster.filter(p=>hasTag(p,"utility")).length;
  if(utilCount>0){
    const bonus = Math.min(utilCount,3)*1.5;
    attack += bonus; defense += bonus;
    if(utilCount>3){ attack -= 1; defense -= 1; }
  }

  // Lurker no Sentinela: buff se tiver, nerf se não tiver
  if(sentinel){
    if(hasTag(sentinel,"lurker")){ attack += 2; defense += 2; }
    else { attack -= 1.5; defense -= 1.5; }
  }

  // Mira Monstra: quanto mais jogadores com a tag, mais buff (sem teto)
  const mmCount = roster.filter(p=>hasTag(p,"mm")).length;
  attack += mmCount*1.5; defense += mmCount*1.5;

  return {attack, defense};
}

  return dict[key] !== undefined ? dict[key] : I18N.pt[key];

function overall(p){ return p.overall; }
function teamOverall(roster){ return Math.round(roster.reduce((s,p)=>s+overall(p),0)/roster.length); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
// Ordem de sorteio do draft: dá um peso maior pra craques com overall 90+ aparecerem,
// sem tirar a aleatoriedade — só aumenta um pouco a chance.
function weightedDrawOrder(arr){
  function pickIdx(weights){
    const total = weights.reduce((s,w)=>s+Math.max(0.01,w),0);
    let r = Math.random()*total;
    for(let i=0;i<weights.length;i++){
      r -= Math.max(0.01,weights[i]);
      if(r<=0) return i;
    }
    return weights.length-1;
  }
  const remaining = [...arr];
  const order = [];
  while(remaining.length){
    const weights = remaining.map(p=>{
      let w = 1;
      if(p.overall>=90) w *= 0.55;
      if((p.tags||[]).includes("campeao_mundial")) w *= 0.55;
      return w;
    });
    const idx = pickIdx(weights);
    order.push(remaining.splice(idx,1)[0]);
  }
  return order.reverse(); // reverso pois o sorteio consome o array via pop() (do final)
}

/* ---------------- TOURNAMENT LOGIC ---------------- */
function decideWinner(teamA, teamB){
  const compA = compositionBonus(teamA.roster, false);
  const compB = compositionBonus(teamB.roster, false);
  const buffA = coachBuff(teamA.coach) + (compA.attack+compA.defense)/2 + chemistryBonus(teamA.roster, teamA.coach);
  const buffB = coachBuff(teamB.coach) + (compB.attack+compB.defense)/2 + chemistryBonus(teamB.roster, teamB.coach);
  const ratingA = teamA.rating + buffA*BUFF_DAMPING;
  const ratingB = teamB.rating + buffB*BUFF_DAMPING;
  const diff = ratingA - ratingB;
  const prob = Math.min(0.94, Math.max(0.06, 0.5 + diff/130));
  return Math.random() < prob ? teamA : teamB;
}

// Decide uma partida em melhor-de-N mapas (mapsToWin=2 → MD3, mapsToWin=3 → MD5).
function decideMatchWinner(teamA, teamB, mapsToWin){
  let wa=0, wb=0;
  while(wa<mapsToWin && wb<mapsToWin){
    if(decideWinner(teamA,teamB)===teamA) wa++; else wb++;
  }
  return wa>wb ? {winner:teamA, loser:teamB} : {winner:teamB, loser:teamA};
}
function matchFormatFor(labelKey){
  return (labelKey==="lbFinal" || labelKey==="grandFinal") ? 3 : 2;
}

// Converte a lista de nomes de uma Seleção em objetos de jogador de verdade (do POOL).
function selecaoPlayerObjects(selecaoName){
  const names = new Set(WC_SELECOES[selecaoName].players.map(n=>n.toLowerCase()));
  return POOL.filter(p=>names.has(p.name.toLowerCase()));
}

// Monta um elenco de IA cobrindo as 5 funções de verdade — tira jogadores do pool compartilhado
// (mutando o array recebido), preferindo sempre alguém que jogue aquela função.
// Casamento bipartido (algoritmo de Kuhn) — usado só no Modo Copa do Mundo, onde os elencos das
// Seleções são pequenos e um sorteio ingênuo pode travar (alguém que só serve pra 1 vaga já foi
// escalado em outra). Garante que sempre existe uma forma válida de fechar as 5 vagas.
function canCompleteRoster(openRoles, availablePlayers){
  const matchRole = {};
  function tryAssign(roleKey, visited){
    for(const p of availablePlayers){
      if(!p.roles.includes(roleKey) || visited.has(p.name)) continue;
      visited.add(p.name);
      if(!matchRole[p.name] || tryAssign(matchRole[p.name], visited)){
        matchRole[p.name] = roleKey;
        return true;
      }
    }
    return false;
  }
  return openRoles.every(r=>tryAssign(r, new Set()));
}
// Monta um elenco válido garantido (usa casamento bipartido) — para Seleções pequenas da Copa,
// em vez do preenchimento guloso simples usado no modo normal.
function buildValidRoster(players){
  const roster = [null,null,null,null,null];
  const matchRole = {}; // nome do jogador -> indice de slot que ele ocupa
  function tryAssign(slotIdx, visited){
    for(const p of players){
      if(!p.roles.includes(SLOT_ORDER[slotIdx]) || visited.has(p.name)) continue;
      visited.add(p.name);
      if(!(p.name in matchRole) || tryAssign(matchRole[p.name], visited)){
        matchRole[p.name] = slotIdx;
        return true;
      }
    }
    return false;
  }
  SLOT_ORDER.forEach((rk,i)=>tryAssign(i, new Set()));
  Object.entries(matchRole).forEach(([name, slotIdx])=>{
    roster[slotIdx] = players.find(p=>p.name===name);
  });
  return roster;
}

function buildAIRoster(sharedPool){
  const roster = [];
  SLOT_ORDER.forEach(roleKey=>{
    const idx = sharedPool.findIndex(p=>p.roles.includes(roleKey));
    if(idx!==-1) roster.push(sharedPool.splice(idx,1)[0]);
  });
  while(roster.length<5 && sharedPool.length){ roster.push(sharedPool.pop()); }
  return roster;
}

// Topologia do "mini-chaveamento suíço" de cada grupo (4 times: você + 3 da IA).
// m1/m2 = rodada 1; m3 = Upper (quem vence está classificado, 2-0); m4 = Lower (quem perde é
// eliminado, 0-2); m5 = decisão entre os dois times 1-1 — vencedor classifica, perdedor cai.
const GROUP_BRACKET_DEF = [
  {id:"m1", aFrom:{seed:0}, bFrom:{seed:1}, labelKey:"groupR1"},
  {id:"m2", aFrom:{seed:2}, bFrom:{seed:3}, labelKey:"groupR1"},
  {id:"m3", aFrom:{m:"m1",res:"w"}, bFrom:{m:"m2",res:"w"}, labelKey:"groupUpper"},
  {id:"m4", aFrom:{m:"m1",res:"l"}, bFrom:{m:"m2",res:"l"}, labelKey:"groupLower"},
  {id:"m5", aFrom:{m:"m3",res:"l"}, bFrom:{m:"m4",res:"w"}, labelKey:"groupDecider"},
];
const GROUP_QUALIFY_IDS = ["m3","m5"]; // vencer aqui classifica
const GROUP_ELIM_IDS = ["m4","m5"];    // perder aqui elimina (2ª derrota)

// Resolve o mini-chaveamento de um grupo 100% controlado pela IA (grupos B/C/D).
function buildGroupQualifiersAI(teams){
  const brk = { seeds: teams, matches: {} };
  GROUP_BRACKET_DEF.forEach(def=>{ brk.matches[def.id] = {winner:null, loser:null}; });
  GROUP_BRACKET_DEF.forEach(def=>{
    const teamA = resolveBracketTeam(def.aFrom, brk);
    const teamB = resolveBracketTeam(def.bFrom, brk);
    brk.matches[def.id] = decideMatchWinner(teamA, teamB, 2);
  });
  return [
    {...brk.matches.m3.winner, isGroupWinner:true},
    {...brk.matches.m5.winner, isGroupWinner:false},
  ];
}

function setupTournament(){
  const playerTeam = {id:"player", isPlayer:true, rating: teamOverall(state.roster)};
  let pool;
  if(state.difficulty==="copa"){
    const rolesNeeded = ["duelist","flex","initiator","controller","sentinel"];
    const otherSelecoes = Object.keys(WC_SELECOES).filter(n=>n!==state.selecao && canCompleteRoster(rolesNeeded, selecaoPlayerObjects(n)));
    pool = shuffle(otherSelecoes.map((name,i)=>({id:"t"+i, name, rating:0})));
  } else {
    pool = shuffle(
      TEAM_NAMES.filter(tm=>tm.name!==state.teamName).map((tm,i)=>({id:"t"+i, name:tm.name, rating:tm.rating}))
    );
  }
  const groupATeams = [playerTeam, pool[0], pool[1], pool[2]];
  const rest = pool.slice(3);
  const groupB = rest.slice(0,4), groupC = rest.slice(4,8), groupD = rest.slice(8,12);
  const aiTeams = [...groupATeams.slice(1), ...groupB, ...groupC, ...groupD];

  if(state.difficulty==="copa"){
    // cada Seleção adversária monta o elenco só com os craques dela mesma, e o coach vem
    // da lista de técnicos daquela Seleção especificamente (não do sorteio do modo normal).
    aiTeams.forEach(tm=>{
      tm.roster = buildValidRoster(shuffle(selecaoPlayerObjects(tm.name)));
      tm.rating = teamOverall(tm.roster);
      const coaches = WC_SELECOES[tm.name].coaches;
      tm.coach = coaches[Math.floor(Math.random()*coaches.length)];
    });
  } else {
    // monta um elenco de 5 jogadores para cada equipe adversária — cobrindo as 5 funções
    // de verdade (igual um draft), em vez de um recorte aleatório do pool.
    const usedNames = new Set(state.roster.map(p=>p.name));
    const availablePlayers = shuffle(POOL.filter(p=>!usedNames.has(p.name)));
    aiTeams.forEach((tm,i)=>{
      tm.roster = buildAIRoster(availablePlayers);
      tm.coach = state.remainingCoaches[i] || null;
    });
  }

  const otherGroupsTop2 = {};
  [["B",groupB],["C",groupC],["D",groupD]].forEach(([letter, teams])=>{
    otherGroupsTop2[letter] = buildGroupQualifiersAI(teams);
  });

  const groupBracket = { seeds: groupATeams, matches: {}, pointerIdx: 0, pending: null };
  GROUP_BRACKET_DEF.forEach(def=>{ groupBracket.matches[def.id] = {winner:null, loser:null}; });

  state.tournament = {
    stage:"groups",
    playerTeam,
    groupATeams,
    groupBracket,
    otherGroupsTop2,
    bracket: null,
  };
  state.campaignStats = { us: state.roster.map((p,i)=>({name:p.name, role:SLOT_ORDER[i], k:0, d:0, a:0})) };
  state.campaignRecords = {singleMap:{kills:RECORDS.singleMap,holder:"aspas"}, md3:{kills:RECORDS.md3,holder:"aspas"}, md5:{kills:RECORDS.md5,holder:"marteen"}};
  state.journey = [];
  advanceGroupBracket();
}

// Verifica se o craque já jogou (mesmo time real, vlr.gg) com alguém já escalado no time,
// ou se já foi treinado pelo Head Coach escolhido — vale mesmo no primeiro sorteio.
function teammateSynergyNote(candidate){
  const ct = PLAYER_TEAM[candidate.name.toLowerCase()] || [];
  if(ct.length===0) return null;
  const names = state.roster.filter(Boolean).filter(p=>{
    const pt = PLAYER_TEAM[p.name.toLowerCase()] || [];
    return pt.some(t=>ct.includes(t));
  }).map(p=>p.name);
  if(state.headCoach){
    const coachTeam = COACH_TEAM[state.headCoach.toLowerCase()];
    if(coachTeam && ct.includes(coachTeam)) names.push(state.headCoach);
  }
  if(names.length===0) return null;
  return names.join(", ");
}

function currentOpponent(){
  const tr = state.tournament;
  if(!tr) return null;
  if(tr.stage==="groups" && tr.groupBracket && tr.groupBracket.pending){
    const p = tr.groupBracket.pending;
    return p.teamA.isPlayer ? p.teamB : p.teamA;
  }
  if(tr.stage==="playoffs" && tr.bracket && tr.bracket.pending){
    const p = tr.bracket.pending;
    return p.teamA.isPlayer ? p.teamB : p.teamA;
  }
  return null;
}

function contextLabel(){
  const tr = state.tournament;
  if(!tr) return "";
  if(tr.stage==="groups"){
    const roundLabel = tr.groupBracket && tr.groupBracket.pending ? bracketLabel(tr.groupBracket.pending.def.labelKey) : "";
    return `${t("groupStageTag")} · ${t("groupWord")} A${roundLabel ? " · "+roundLabel : ""}`;
  }
  if(tr.stage==="playoffs" && tr.bracket && tr.bracket.pending){
    return `${t("playoffsTag")} · ${bracketLabel(tr.bracket.pending.def.labelKey)}`;
  }
  return t("playoffsTag");
}

function resolveBracketTeam(fromDef, bracket){
  if(fromDef.seed!==undefined) return bracket.seeds[fromDef.seed];
  const m = bracket.matches[fromDef.m];
  return fromDef.res==="w" ? m.winner : m.loser;
}

function buildPlayoffBracket(qualifiers){
  const winners = qualifiers.filter(q=>q.isGroupWinner).sort((a,b)=>b.rating-a.rating);
  const runnerups = qualifiers.filter(q=>!q.isGroupWinner).sort((a,b)=>b.rating-a.rating);
  const seeds = [...winners, ...runnerups];
  const matches = {};
  BRACKET_DEF.forEach(def=>{ matches[def.id] = {winner:null, loser:null}; });
  state.tournament.bracket = { seeds, matches, pointerIdx:0, pending:null };
  state.tournament.stage = "playoffs";
}

// Processa o mini-chaveamento do grupo automaticamente até chegar numa partida do jogador.
function advanceGroupBracket(){
  const tr = state.tournament;
  if(tr.stage!=="groups") return;
  const brk = tr.groupBracket;
  brk.pending = null;
  while(brk.pointerIdx < GROUP_BRACKET_DEF.length){
    const def = GROUP_BRACKET_DEF[brk.pointerIdx];
    const teamA = resolveBracketTeam(def.aFrom, brk);
    const teamB = resolveBracketTeam(def.bFrom, brk);
    if(teamA.isPlayer || teamB.isPlayer){
      brk.pending = {def, teamA, teamB};
      startMatch(2); // fase de grupos é sempre MD3
      return;
    }
    brk.matches[def.id] = decideMatchWinner(teamA, teamB, 2);
    brk.pointerIdx++;
  }
}
// Termina de resolver (só IA) o que sobrou do mini-chaveamento do grupo, sem pausar.
function finishGroupBracketAI(){
  const brk = state.tournament.groupBracket;
  while(brk.pointerIdx < GROUP_BRACKET_DEF.length){
    const def = GROUP_BRACKET_DEF[brk.pointerIdx];
    const teamA = resolveBracketTeam(def.aFrom, brk);
    const teamB = resolveBracketTeam(def.bFrom, brk);
    brk.matches[def.id] = decideMatchWinner(teamA, teamB, 2);
    brk.pointerIdx++;
  }
}

// Processa partidas automaticamente até chegar numa partida do jogador, ou até o torneio terminar.
function advanceTournament(){
  const tr = state.tournament;
  if(tr.stage!=="playoffs") return;
  const brk = tr.bracket;
  brk.pending = null;
  while(brk.pointerIdx < BRACKET_DEF.length){
    const def = BRACKET_DEF[brk.pointerIdx];
    const teamA = resolveBracketTeam(def.aFrom, brk);
    const teamB = resolveBracketTeam(def.bFrom, brk);
    if(teamA.isPlayer || teamB.isPlayer){
      brk.pending = {def, teamA, teamB};
      startMatch(matchFormatFor(def.labelKey));
      return;
    }
    const {winner, loser} = decideMatchWinner(teamA, teamB, matchFormatFor(def.labelKey));
    brk.matches[def.id] = {winner, loser};
    brk.pointerIdx++;
  }
  // chaveamento concluído sem mais partidas do jogador pendentes
  const finalMatch = brk.matches["m14"];
  state.endInfo = finalMatch.winner.isPlayer ? {type:"champion"} : {type:"runnerup"};
  finalizeCampaign();
}

  const names = Object.keys(WC_SELECOES).filter(name=>canCompleteRoster(roles, selecaoPlayerObjects(name)));
  if(names.length < 16){
    const unavailable = Object.keys(WC_SELECOES).filter(n=>!names.includes(n));
    return `
    <div class="panel angle" style="text-align:center;">
      <h1 class="hero" style="font-size:24px;">${t("selecaoSelectTitle")}</h1>
      <p class="lead" style="margin-top:10px;">${t("copaNotReady")(names.length, unavailable.map(selecaoLabel).join(", "))}</p>
      <div class="btn-row" style="justify-content:center;margin-top:16px;">
        <button class="btn secondary" id="selecao-back-btn">${t("rulesBackBtn")}</button>
      </div>
    </div>
    `;
  }
  const optionsHTML = names.map(name=>{
    const flags = (WC_SELECAO_FLAGS[name]||[]).map(code=>countryFlag(code)).join(" ");
    return `<button class="team-option angle-sm ${state.selecao===name?'selected':''}" data-selecao="${name}">${flags} ${selecaoLabel(name)}</button>`;
  }).join("");
  return `
  <div class="panel angle">
    <h1 class="hero" style="font-size:24px;">${t("selecaoSelectTitle")}</h1>
    <p class="lead">${t("selecaoSelectLead")}</p>
    <div class="selecao-grid">${optionsHTML}</div>
    <div class="btn-row">
      <button class="btn" id="selecao-continue-btn" ${state.selecao?'':'disabled'}>${t("teamSelectContinue")}</button>
    </div>
  </div>
  `;
}

}

function draftHTML(){
  const filled = state.roster.filter(Boolean).length;
  const slotsHTML = SLOT_ORDER.map((roleKey,i)=>{
    const p = state.roster[i];
    if(p){
      return `<div class="slot filled"><div class="slot-name">${p.name} ${countryFlag(PLAYER_COUNTRY[p.name.toLowerCase()])}</div><div class="slot-role">${roleLabel(roleKey)}</div></div>`;
    }
    return `<div class="slot">${roleLabel(roleKey)}</div>`;
  }).join("");

  let candidateHTML = "";
  if(filled>=5){
    candidateHTML = `
    <div class="panel angle" style="text-align:center;">
      <p class="lead" style="margin-bottom:14px;">${t("rosterComplete")} <span class="mono" style="color:var(--gold)">${teamOverall(state.roster)}</span></p>
      <button class="btn" id="to-match-btn">${t("toMatchBtn")}</button>
    </div>`;
  } else if(state.pendingSlotChoice && state.currentCandidate){
    const c = state.currentCandidate;
    const ov = overall(c);
    const tagChipsHTML = (c.tags && c.tags.length) ? `
      <div class="tag-chips">${c.tags.map(tag=>`<span class="tag-chip">${tagLabel(tag)}</span>`).join("")}</div>
    ` : "";
    const statsBlock = state.difficulty!=="selva" ? `
      <div class="overall-badge">${ov}</div>
      ${tagChipsHTML}
    ` : `<div class="hidden-stats">${t("hiddenStats")}</div>`;
    let openSlots = SLOT_ORDER.map((roleKey,i)=>({roleKey,i})).filter(s=>!state.roster[s.i] && c.roles.includes(s.roleKey));
    if(state.difficulty==="copa"){
      const draftedNames = new Set(state.roster.filter(Boolean).map(p=>p.name));
      const selecaoPlayers = selecaoPlayerObjects(state.selecao).filter(p=>!draftedNames.has(p.name) && p.name!==c.name);
      openSlots = openSlots.filter(s=>{
        const remainingRoles = SLOT_ORDER.filter((rk,idx)=>!state.roster[idx] && idx!==s.i);
        return canCompleteRoster(remainingRoles, selecaoPlayers);
      });
    }

    candidateHTML = `
    <div class="candidate angle">
      <div class="cand-name">${c.name} ${countryFlag(PLAYER_COUNTRY[c.name.toLowerCase()])}</div>
      <div class="cand-meta">${c.roles.map(r=>`<span class="role-pill">${roleLabel(r)}</span>`).join(" ")}</div>
      ${statsBlock}
      <p class="lead" style="margin:10px 0;">${t("chooseSlotPrompt")(c.name)}</p>
      <div class="btn-row" style="justify-content:center;flex-wrap:wrap;">
        ${openSlots.map(s=>`<button class="btn secondary" data-slotidx="${s.i}">${roleLabel(s.roleKey)}</button>`).join("")}
      </div>
    </div>`;
  } else if(state.confirmingCandidate){
    const c = state.confirmingCandidate;
    const ov = overall(c);
    const tagChipsHTML = (c.tags && c.tags.length) ? `
      <div class="tag-chips">${c.tags.map(tag=>`<span class="tag-chip">${tagLabel(tag)}</span>`).join("")}</div>
    ` : "";
    const synergyWith = state.difficulty!=="selva" ? teammateSynergyNote(c) : null;
    const synergyBlock = synergyWith ? `<div class="cr-synergy" style="justify-content:center;margin:8px 0;">🤝 ${t("alreadyPlayedWith")}</div>` : "";
    const statsBlock = state.difficulty!=="selva" ? `
      <div class="overall-badge">${ov}</div>
      ${tagChipsHTML}
      ${synergyBlock}
    ` : `<div class="hidden-stats">${t("hiddenStats")}</div>`;

    candidateHTML = `
    <div class="candidate angle ${synergyWith ? 'synergy-highlight' : ''}">
      <div class="cand-name">${c.name} ${countryFlag(PLAYER_COUNTRY[c.name.toLowerCase()])}</div>
      <div class="cand-meta">${c.roles.map(r=>`<span class="role-pill">${roleLabel(r)}</span>`).join(" ")}</div>
      ${statsBlock}
      <p class="lead" style="margin:10px 0;">${t("confirmDraftPrompt")(c.name)}</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" id="confirm-draft-btn">${t("confirmBtn")}</button>
        <button class="btn secondary" id="back-to-list-btn">${t("backBtn")}</button>
      </div>
    </div>`;
  } else if(state.currentCandidates.length>0){
    const skipsLeft = 2 - state.skipsUsed;
    const rowsHTML = state.currentCandidates.map(c=>{
      const synergyWith = state.difficulty!=="selva" ? teammateSynergyNote(c) : null;
      return `
      <button class="candidate-row angle-sm ${synergyWith ? 'synergy-highlight' : ''}" data-pick="${c.name}">
        <div class="cr-info">
          <div class="cr-name">${c.name} ${countryFlag(PLAYER_COUNTRY[c.name.toLowerCase()])}</div>
          <div class="cr-roles">${c.roles.map(r=>roleLabel(r)).join(" · ")}</div>
          ${state.difficulty!=="selva" && c.tags && c.tags.length ? `<div class="cr-tags">${c.tags.map(tag=>`<span class="cr-tag">${tagLabel(tag)}</span>`).join("")}</div>` : ''}
          ${synergyWith ? `<div class="cr-synergy">🤝 ${t("alreadyPlayedWith")}</div>` : ''}
        </div>
        ${state.difficulty!=="selva" ? `<div class="cr-ovr mono">${overall(c)}</div>` : `<div class="cr-ovr mono">?</div>`}
      </button>
    `;
    }).join("");
    candidateHTML = `
    <div class="panel angle">
      <p class="lead" style="margin-bottom:12px;text-align:center;">${t("pickOneLead")}</p>
      <div class="candidate-list">${rowsHTML}</div>
      <p class="lead" style="margin:12px 0 6px;text-align:center;">${t("skipsLeftLabel")(Math.max(0,skipsLeft))}</p>
      <div class="btn-row" style="justify-content:center;">
        ${skipsLeft>0 ? `<button class="btn secondary" id="skip-batch-btn">${t("skipBtn")}</button>` : ''}
      </div>
    </div>`;
  } else {
    candidateHTML = `
    <div class="panel angle" style="text-align:center;">
      <p class="lead" style="margin-bottom:16px;">${t("drawLead")}</p>
      <button class="btn" id="draw-btn" ${state.pool.length===0?'disabled':''}>${t("drawBtn")}</button>
      ${state.pool.length===0?`<p class="lead" style="margin-top:10px;">${t("poolEmpty")}</p>`:''}
    </div>`;
  }

  return `
  <div class="roster-strip">${slotsHTML}</div>
  <div class="pool-info"><span>${t("poolLabel")} ${state.pool.length}</span><span>${t("filledLabel")(filled)}</span></div>
  ${candidateHTML}
  `;
}

function matchHTML(){
  const opp = currentOpponent();
  const us = teamOverall(state.roster);
  const roundsHTML = state.roundLog.map(r=>`<div class="r ${r}">${r==='win'?'✓':'·'}</div>`).join("");
  const bo = state.mapsToWin*2-1;
  const side = currentSide();
  const sideLabelHTML = side==="attack"
    ? `<span style="color:var(--crimson);">${t("sideAttack")}</span>`
    : `<span style="color:var(--teal);">${t("sideDefense")}</span>`;

  const rosterColHTML = (players, title) => `
    <div class="roster-col">
      <div class="roster-col-title">${title}</div>
      ${players.map(p=>`
        <div class="roster-player">
          <span class="pname">${p.name} ${countryFlag(PLAYER_COUNTRY[p.name.toLowerCase()])}</span>
          <span class="pkda">${p.k}/${p.d}/${p.a}</span>
        </div>`).join("")}
    </div>`;
  const rostersHTML = (state.matchStats.us.length && state.matchStats.them.length) ? `
    <div class="pool-info" style="justify-content:center;margin-top:14px;"><span class="mono">${t("rostersLabel")}</span></div>
    <div class="roster-compare">
      ${rosterColHTML(state.matchStats.us, selecaoLabel(state.teamName))}
      ${rosterColHTML(state.matchStats.them, selecaoLabel(opp.name))}
    </div>` : "";

  const mapFinished = isMapDecided(state.matchScore.us, state.matchScore.them);
  let actionHTML = "";
  if(!mapFinished){
    actionHTML = `<div class="btn-row" style="justify-content:center;"><button class="btn" id="sim-round-btn">${t("simRoundBtn")}</button> <button class="btn secondary" id="sim-all-btn">${t("simAllBtn")}</button></div>`;
  } else {
    const wonMap = state.matchScore.us > state.matchScore.them;
    const prospUs = state.mapsUs + (wonMap?1:0);
    const prospThem = state.mapsThem + (wonMap?0:1);
    const matchDecided = prospUs===state.mapsToWin || prospThem===state.mapsToWin;
    const rec = checkRecords();
    const buildRecordParts = ()=>{
      const parts = [];
      if(matchDecided && rec.seriesBreak){
        const b = rec.seriesBreak;
        const key = b.side==="us" ? "recordSeriesUs" : "recordSeriesThem";
        parts.push(t(key)(b.name, b.kills, rec.prevSeries.kills, rec.prevSeries.holder, "MD"+(rec.bo==="md5"?5:3)));
      }
      if(rec.singleMapBreak){
        const b = rec.singleMapBreak;
        const key = b.side==="us" ? "recordSingleMapUs" : "recordSingleMapThem";
        parts.push(t(key)(b.name, b.kills, rec.prevSingleMap.kills, rec.prevSingleMap.holder));
      }
      return parts;
    };
    if(matchDecided){
      const wonMatch = prospUs>prospThem;
      const parts = buildRecordParts();
      const recordHTML = parts.length ? `<div class="record-banner">${parts.join("<br><br>")}</div>` : "";
      actionHTML = `
      <div class="result-banner ${wonMatch?'win':'loss'}">
        <div class="label">${wonMatch?t("resultWin"):t("resultLoss")}</div>
      </div>
      ${recordHTML}
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" id="continue-btn">${t("continueBtn")}</button>
      </div>`;
    } else {
      const parts = rec.singleMapBreak ? [(()=>{
        const b = rec.singleMapBreak;
        const key = b.side==="us" ? "recordSingleMapUs" : "recordSingleMapThem";
        return t(key)(b.name, b.kills, rec.prevSingleMap.kills, rec.prevSingleMap.holder);
      })()] : [];
      const recordHTML = parts.length ? `<div class="record-banner">${parts.join("<br><br>")}</div>` : "";
      actionHTML = `
      <div class="result-banner ${wonMap?'win':'loss'}">
        <div class="label">${wonMap?t("resultWin"):t("resultLoss")}</div>
      </div>
      ${recordHTML}
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" id="next-map-btn">${t("nextMapBtn")}</button>
      </div>`;
    }
  }

  return `
  <div class="pool-info" style="justify-content:center;"><span class="mono">${contextLabel()}</span></div>
  <div class="pool-info" style="justify-content:center;"><span class="mono">MD${bo} · ${t("mapsScoreLabel")(state.mapsUs, state.mapsThem)} · ${sideLabelHTML}</span></div>
  <div class="panel angle">
    <div class="vs-row">
      <div class="team-block">
        <div class="team-name">${selecaoLabel(state.teamName)}</div>
        <div class="team-sub mono">OVR ${us}</div>
        <div class="team-sub" style="margin-top:2px;">${state.headCoach} ${countryFlag(COACH_COUNTRY[state.headCoach.toLowerCase()])}</div>
      </div>
      <div class="vs-x">${t("vs")}</div>
      <div class="team-block">
        <div class="team-name">${selecaoLabel(opp.name)}</div>
        <div class="team-sub mono">OVR ${opp.rating}</div>
        ${opp.coach ? `<div class="team-sub" style="margin-top:2px;">${opp.coach} ${countryFlag(COACH_COUNTRY[opp.coach.toLowerCase()])}</div>` : ''}
      </div>
    </div>
    <div style="text-align:center;">
      <div class="score mono">${state.matchScore.us}<span class="sep">–</span>${state.matchScore.them}</div>
    </div>
    <div class="round-log">${roundsHTML}</div>
    ${rostersHTML}
    ${actionHTML}
  </div>
  `;
}

function endHTML(){
  const info = state.endInfo || {type:"groups"};
  let icon = "🗺️", titleColor = "var(--crimson)", title = "", lead = "";
  if(info.type==="champion"){
    icon = "🏆"; titleColor = "var(--gold)";
    title = t("championTitle"); lead = t("championLead");
  } else if(info.type==="runnerup"){
    icon = "🥈"; titleColor = "var(--text)";
    title = t("runnerUpTitle"); lead = t("runnerUpLead");
  } else if(info.type==="playoffs"){
    icon = "🗺️";
    title = t("playoffsEliminatedTitle"); lead = t("playoffsEliminatedLead")(bracketLabel(info.stageLabelKey));
  } else {
    icon = "🗺️";
    title = t("groupsEliminatedTitle"); lead = t("groupsEliminatedLead");
  }

  const mvp = info.type==="champion" ? getMVP() : null;
  const mvpHTML = mvp ? `
    <div class="mvp-card angle-sm">
      <div class="mvp-eyebrow">${t("mvpLabel")}</div>
      <div class="mvp-name">${mvp.name} ${countryFlag(PLAYER_COUNTRY[mvp.name.toLowerCase()])}</div>
      <div class="mvp-role">${roleLabel(mvp.role)}</div>
      <div class="mvp-kda">${mvp.k}/${mvp.d}/${mvp.a}</div>
    </div>` : "";

  const journeyHTML = state.journey.length ? `
    <div class="pool-info" style="justify-content:center;margin-top:6px;"><span class="mono">${t("journeyLabel")}</span></div>
    <div class="journey-table">
      ${state.journey.map(j=>`
        <div class="journey-row">
          <div class="jr-stage">${j.stageLabel}</div>
          <div class="jr-opp">${j.opponent}</div>
          <div class="jr-score">${j.score}</div>
          <div class="jr-result ${j.result==='W'?'win':'loss'}">${j.result}</div>
        </div>`).join("")}
    </div>` : "";

  return `
    <div class="panel angle trophy-wrap">
      <div class="trophy-icon">${icon}</div>
      <div class="trophy-title" style="color:${titleColor};">${title}</div>
      <p class="lead">${lead}</p>
      ${state.headCoach ? `<div class="pool-info" style="justify-content:center;"><span class="mono">${t("headCoachLabel")}: ${state.headCoach} ${countryFlag(COACH_COUNTRY[state.headCoach.toLowerCase()])}</span></div>` : ''}
      ${mvpHTML}
      ${journeyHTML}
      <div class="final-roster">
        ${state.roster.map((p,i)=>`<div class="fr-item"><div><div class="n">${p.name} ${countryFlag(PLAYER_COUNTRY[p.name.toLowerCase()])}${mvp && mvp.name===p.name ? '<span class="mvp-tag">MVP</span>' : ''}</div><div class="r">${roleLabel(SLOT_ORDER[i])}</div></div><div class="o mono">${overall(p)}</div></div>`).join("")}
      </div>
      <button class="btn" id="restart-btn">${info.type==="champion"?t("playAgain"):t("tryAgain")}</button>
      <div class="share-row">
        <button class="share-btn" id="share-x-btn">
          <svg width="15" height="15" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 6 L26 26 M26 6 L6 26" stroke="currentColor" stroke-width="4.5" stroke-linecap="square"/>
          </svg>
          ${t("shareXBtn")}
        </button>
      </div>
    </div>`;
}

/* ---------------- HANDLERS ---------------- */
function attachHandlers(){
  document.querySelectorAll(".lang-btn").forEach(el=>{
    el.onclick = ()=>{ state.lang = el.dataset.lang; render(); };
  });
  document.querySelectorAll(".diff-card").forEach(el=>{
    el.onclick = ()=>{ state.difficulty = el.dataset.diff; render(); };
  });
  const startBtn = document.getElementById("start-btn");
  if(startBtn) startBtn.onclick = ()=>{
    state.screen = state.difficulty==="copa" ? "selecaoselect" : "teamselect";
    render();
  };
  const rulesBtn = document.getElementById("rules-btn");
  if(rulesBtn) rulesBtn.onclick = ()=>{
    state.screen = "rules";
    render();
  };
  const rulesBackBtn = document.getElementById("rules-back-btn");
  if(rulesBackBtn) rulesBackBtn.onclick = ()=>{
    state.screen = "intro";
    render();
  };
  const historyBtn = document.getElementById("history-btn");
  if(historyBtn) historyBtn.onclick = async ()=>{
    state.campaignHistoryList = await loadCampaignHistory();
    state.screen = "history";
    render();
  };
  const historyBackBtn = document.getElementById("history-back-btn");
  if(historyBackBtn) historyBackBtn.onclick = ()=>{
    state.screen = "intro";
    render();
  };
  const creatorBtn = document.getElementById("creator-btn");
  if(creatorBtn) creatorBtn.onclick = ()=>{
    state.screen = "creator";
    render();
  };
  const creatorBackBtn = document.getElementById("creator-back-btn");
  if(creatorBackBtn) creatorBackBtn.onclick = ()=>{
    state.screen = "intro";
    render();
  };

  document.querySelectorAll(".team-option[data-selecao]").forEach(el=>{
    el.onclick = ()=>{ state.selecao = el.dataset.selecao; render(); };
  });
  const selecaoContinueBtn = document.getElementById("selecao-continue-btn");
  if(selecaoContinueBtn) selecaoContinueBtn.onclick = ()=>{
    state.teamName = state.selecao;
    state.coachOptions = WC_SELECOES[state.selecao].coaches;
    state.headCoach = null;
    state.screen = "coachselect";
    render();
  };
  const selecaoBackBtn = document.getElementById("selecao-back-btn");
  if(selecaoBackBtn) selecaoBackBtn.onclick = ()=>{
    state.screen = "intro";
    render();
  };

  document.querySelectorAll(".team-option[data-team]").forEach(el=>{
    el.onclick = ()=>{ state.teamName = el.dataset.team; render(); };
  });
  const teamContinueBtn = document.getElementById("team-continue-btn");
  if(teamContinueBtn) teamContinueBtn.onclick = ()=>{
    state.coachOptions = shuffle(COACHES).slice(0, state.difficulty==="classico" ? 6 : 4);
    state.headCoach = null;
    state.screen = "coachselect";
    render();
  };

  document.querySelectorAll(".coach-option").forEach(el=>{
    el.onclick = ()=>{ state.headCoach = el.dataset.coach; render(); };
  });
  const coachContinueBtn = document.getElementById("coach-continue-btn");
  if(coachContinueBtn) coachContinueBtn.onclick = ()=>{
    if(state.difficulty==="copa"){
      state.remainingCoaches = WC_SELECOES[state.selecao].coaches.filter(c=>c!==state.headCoach);
      state.pool = weightedDrawOrder(selecaoPlayerObjects(state.selecao));
    } else {
      state.remainingCoaches = shuffle(COACHES.filter(c=>c!==state.headCoach));
      state.pool = weightedDrawOrder(POOL);
    }
    state.roster = SLOT_ORDER.map(()=>null);
    state.currentCandidate = null;
    state.currentCandidates = [];
    state.confirmingCandidate = null;
    state.pendingSlotChoice = false;
    state.skipsUsed = 0;
    state.screen = "draft";
    render();
  };

  const drawBtn = document.getElementById("draw-btn");
  if(drawBtn) drawBtn.onclick = ()=>{
    let batch;
    if(state.difficulty==="copa"){
      // Seleções são pequenas — nunca "perde" ninguém de vista: recalcula do zero quem ainda
      // não foi escalado e tem vaga aberta compatível, em vez de consumir o pool aos poucos.
      const draftedNames = new Set(state.roster.filter(Boolean).map(p=>p.name));
      const stillAvailable = selecaoPlayerObjects(state.selecao).filter(c=>{
        if(draftedNames.has(c.name)) return false;
        return SLOT_ORDER.some((roleKey,i)=>!state.roster[i] && c.roles.includes(roleKey));
      });
      batch = shuffle(stillAvailable).slice(0,5);
    } else {
      // sorteio inteligente: só entram candidatos com pelo menos 1 vaga aberta compatível;
      // quem não tem vaga nenhuma disponível é descartado do pool sem aparecer.
      batch = [];
      while(batch.length<5 && state.pool.length>0){
        const c = state.pool.pop();
        const hasOpenSlot = SLOT_ORDER.some((roleKey,i)=>!state.roster[i] && c.roles.includes(roleKey));
        if(hasOpenSlot) batch.push(c);
      }
    }
    state.currentCandidates = batch;
    render();
  };
  document.querySelectorAll("[data-pick]").forEach(el=>{
    el.onclick = ()=>{
      const name = el.dataset.pick;
      const c = state.currentCandidates.find(p=>p.name===name);
      state.confirmingCandidate = c;
      render();
    };
  });
  const confirmDraftBtn = document.getElementById("confirm-draft-btn");
  if(confirmDraftBtn) confirmDraftBtn.onclick = ()=>{
    const c = state.confirmingCandidate;
    state.confirmingCandidate = null;
    state.currentCandidates = [];
    let openSlots = SLOT_ORDER.map((roleKey,i)=>i).filter(i=>!state.roster[i] && c.roles.includes(SLOT_ORDER[i]));
    if(state.difficulty==="copa" && openSlots.length>1){
      // Seleções são pequenas — só oferece vagas que não travem o resto do draft depois.
      const draftedNames = new Set(state.roster.filter(Boolean).map(p=>p.name));
      const selecaoPlayers = selecaoPlayerObjects(state.selecao).filter(p=>!draftedNames.has(p.name) && p.name!==c.name);
      openSlots = openSlots.filter(i=>{
        const remainingRoles = SLOT_ORDER.filter((rk,idx)=>!state.roster[idx] && idx!==i);
        return canCompleteRoster(remainingRoles, selecaoPlayers);
      });
    }
    if(openSlots.length===1){
      state.roster[openSlots[0]] = c;
      state.currentCandidate = null;
    } else {
      state.currentCandidate = c;
      state.pendingSlotChoice = true;
    }
    render();
  };
  const backToListBtn = document.getElementById("back-to-list-btn");
  if(backToListBtn) backToListBtn.onclick = ()=>{
    state.confirmingCandidate = null;
    render();
  };
  document.querySelectorAll("[data-slotidx]").forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.dataset.slotidx, 10);
      state.roster[idx] = state.currentCandidate;
      state.currentCandidate = null;
      state.pendingSlotChoice = false;
      render();
    };
  });
  const skipBatchBtn = document.getElementById("skip-batch-btn");
  if(skipBatchBtn) skipBatchBtn.onclick = ()=>{
    state.skipsUsed++;
    state.currentCandidates = [];
    render();
  };
  const toMatchBtn = document.getElementById("to-match-btn");
  if(toMatchBtn) toMatchBtn.onclick = ()=>{
    setupTournament();
    state.screen = "match";
    render();
  };

  const simRoundBtn = document.getElementById("sim-round-btn");
  if(simRoundBtn) simRoundBtn.onclick = ()=>{ simulateRound(); render(); };
  const simAllBtn = document.getElementById("sim-all-btn");
  if(simAllBtn) simAllBtn.onclick = ()=>{
    while(!isMapDecided(state.matchScore.us, state.matchScore.them)){ simulateRound(); }
    render();
  };
  const nextMapBtn = document.getElementById("next-map-btn");
  if(nextMapBtn) nextMapBtn.onclick = ()=>{ finalizeMap(); startNextMap(); render(); };
  const continueBtn = document.getElementById("continue-btn");
  if(continueBtn) continueBtn.onclick = ()=>{ finalizeMap(); handleContinue(); render(); };

  const restartBtn = document.getElementById("restart-btn");
  if(restartBtn) restartBtn.onclick = ()=>{
    resetToIntro();
    render();
  };
  const brandHomeBtn = document.getElementById("brand-home-btn");
  if(brandHomeBtn) brandHomeBtn.onclick = ()=>{
    resetToIntro();
    render();
  };
  const shareXBtn = document.getElementById("share-x-btn");
  if(shareXBtn) shareXBtn.onclick = ()=>{
    const text = buildShareText();
    const webUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "");
    if(!isMobile){
      window.open(webUrl, "_blank", "noopener");
      return;
    }
    // no celular, tenta abrir o app de verdade primeiro (esquema não-oficial, sem garantia da X);
    // se em ~800ms a página não perder o foco (sinal de que o app abriu), cai pro site normalmente.
    const appUrl = `twitter://post?message=${encodeURIComponent(text)}`;
    let appOpened = false;
    const onBlur = ()=>{ appOpened = true; };
    window.addEventListener("blur", onBlur, {once:true});
    window.location.href = appUrl;
    setTimeout(()=>{
      window.removeEventListener("blur", onBlur);
      if(!appOpened) window.open(webUrl, "_blank", "noopener");
    }, 800);
  };
}

function handleContinue(){
  const tr = state.tournament;
  const won = state.mapsUs === state.mapsToWin;

  if(tr.stage==="groups"){
    const brk = tr.groupBracket;
    const pending = brk.pending;
    const oppTeam = pending.teamA.isPlayer ? pending.teamB : pending.teamA;
    state.journey.push({
      stageLabel: `${t("groupStageTag")} · ${t("groupWord")} A · ${bracketLabel(pending.def.labelKey)}`,
      opponent: oppTeam.name,
      result: won ? "W" : "L",
      score: `${state.mapsUs}-${state.mapsThem}`,
    });
    const winner = won ? tr.playerTeam : oppTeam;
    const loser = won ? oppTeam : tr.playerTeam;
    brk.matches[pending.def.id] = {winner, loser};
    brk.pointerIdx++;

    const qualified = won && GROUP_QUALIFY_IDS.includes(pending.def.id);
    const eliminated = !won && GROUP_ELIM_IDS.includes(pending.def.id);
    if(qualified || eliminated){
      finishGroupBracketAI(); // resolve o que sobrou do grupo (só IA) pra fechar os classificados
      if(qualified){
        const top2 = [
          {...brk.matches.m3.winner, isGroupWinner:true},
          {...brk.matches.m5.winner, isGroupWinner:false},
        ];
        const qualifiers = [...top2, ...tr.otherGroupsTop2.B, ...tr.otherGroupsTop2.C, ...tr.otherGroupsTop2.D];
        buildPlayoffBracket(qualifiers);
        advanceTournament();
      } else {
        state.endInfo = {type:"groups"};
        finalizeCampaign();
      }
      return;
    }
    // ainda não decidido (1ª rodada) — segue pro próximo confronto do jogador no grupo
    advanceGroupBracket();
    return;
  }

  if(tr.stage==="playoffs"){
    const brk = tr.bracket;
    const pending = brk.pending;
    const oppTeam = pending.teamA.isPlayer ? pending.teamB : pending.teamA;
    state.journey.push({
      stageLabel: bracketLabel(pending.def.labelKey),
      opponent: oppTeam.name,
      result: won ? "W" : "L",
      score: `${state.mapsUs}-${state.mapsThem}`,
    });
    const winner = won ? tr.playerTeam : oppTeam;
    const loser = won ? oppTeam : tr.playerTeam;
    brk.matches[pending.def.id] = {winner, loser};
    brk.pointerIdx++;

    if(won){
      advanceTournament();
      return;
    }
    // jogador perdeu
    if(pending.def.id === "m14"){
      state.endInfo = {type:"runnerup"};
      finalizeCampaign();
      return;
    }
    if(LB_KEYS.includes(pending.def.labelKey)){
      state.endInfo = {type:"playoffs", stageLabelKey: pending.def.labelKey};
      finalizeCampaign();
      return;
    }
    // derrota no upper bracket: cai para o lower, torneio continua
    advanceTournament();
  }
}

// Inicia uma partida nova (MD3 = mapsToWin 2, MD5 = mapsToWin 3).
function startMatch(mapsToWin){
  state.mapsToWin = mapsToWin;
  state.mapsUs = 0;
  state.mapsThem = 0;
  state.mapHistory = [];
  state.matchScore = {us:0, them:0};
  state.roundLog = [];
  initMatchStats();
  initSeriesStats();
}
// Começa o próximo mapa da mesma partida (mantém o placar de mapas e o total de abates da série).
function startNextMap(){
  state.matchScore = {us:0, them:0};
  state.roundLog = [];
  initMatchStats();
}
// Registra o resultado do mapa atual no placar da partida e acumula os abates na série e na campanha.
function finalizeMap(){
  const wonMap = state.matchScore.us > state.matchScore.them;
  state.mapHistory.push({us:state.matchScore.us, them:state.matchScore.them});
  if(wonMap) state.mapsUs++; else state.mapsThem++;
  state.matchStats.us.forEach((p,i)=>{ if(state.seriesStats.us[i]) state.seriesStats.us[i].k += p.k; });
  state.matchStats.them.forEach((p,i)=>{ if(state.seriesStats.them[i]) state.seriesStats.them[i].k += p.k; });
  if(state.campaignStats){
    state.matchStats.us.forEach((p,i)=>{
      const cs = state.campaignStats.us[i];
      if(cs){ cs.k += p.k; cs.d += p.d; cs.a += p.a; }
    });
  }
  // recorde de mapa único da campanha (vale pro seu time E pro adversário)
  const cr = state.campaignRecords;
  [...state.matchStats.us, ...state.matchStats.them].forEach(p=>{
    if(p.k > cr.singleMap.kills) cr.singleMap = {kills:p.k, holder:p.name};
  });
  // recorde de série (MD3/MD5) da campanha — soma o que já tinha na série + este mapa
  const seriesKey = state.mapsToWin===3 ? "md5" : "md3";
  state.matchStats.us.forEach((p,i)=>{
    const total = (state.seriesStats.us[i] ? state.seriesStats.us[i].k : 0);
    if(total > cr[seriesKey].kills) cr[seriesKey] = {kills:total, holder:p.name};
  });
  state.matchStats.them.forEach((p,i)=>{
    const total = (state.seriesStats.them[i] ? state.seriesStats.them[i].k : 0);
    if(total > cr[seriesKey].kills) cr[seriesKey] = {kills:total, holder:p.name};
  });
}

// Melhor jogador da campanha (MVP), baseado numa nota simples de desempenho acumulado.
function getMVP(){
  if(!state.campaignStats || !state.campaignStats.us.length) return null;
  return state.campaignStats.us.reduce((best, p)=>{
    const score = p.k + p.a*0.5 - p.d*0.3;
    const bestScore = best ? (best.k + best.a*0.5 - best.d*0.3) : -Infinity;
    return score > bestScore ? p : best;
  }, null);
}

// Monta o texto de compartilhamento (X / WhatsApp) com o resumo da campanha.
// Marca a campanha como encerrada e salva um registro dela no histórico (armazenamento pessoal).
// Armazenamento com fallback: usa window.storage quando disponível (preview do Claude), e cai
// pra localStorage quando o site está hospedado de verdade fora daqui (GitHub Pages, etc.) —
// sem isso, o histórico de campanhas simplesmente não funciona fora do preview do Claude.
const HAS_ARTIFACT_STORAGE = typeof window!=="undefined" && window.storage && typeof window.storage.get==="function";
async function storageGetValue(key){
  if(HAS_ARTIFACT_STORAGE){
    try{ const res = await window.storage.get(key, false); return res ? res.value : null; }
    catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSetValue(key, value){
  if(HAS_ARTIFACT_STORAGE){
    try{ await window.storage.set(key, value, false); return; }catch(e){ /* tenta localStorage abaixo */ }
  }
  try{ localStorage.setItem(key, value); }catch(e){ /* armazenamento indisponível — segue o jogo normalmente */ }
}

function finalizeCampaign(){
  state.screen = "end";
  saveCampaignRecord();
}
async function saveCampaignRecord(){
  try{
    const info = state.endInfo || {type:"groups"};
    const wins = state.journey.filter(j=>j.result==="W").length;
    const losses = state.journey.filter(j=>j.result==="L").length;
    const mvp = info.type==="champion" ? getMVP() : null;
    const record = {
      date: new Date().toISOString(),
      resultType: info.type,
      stageLabelKey: info.stageLabelKey || null,
      teamName: state.teamName,
      headCoach: state.headCoach,
      difficulty: state.difficulty,
      overall: teamOverall(state.roster),
      record: `${wins}V-${losses}D`,
      roster: state.roster.map((p,i)=>({name:p.name, role:SLOT_ORDER[i]})),
      mvpName: mvp ? mvp.name : null,
    };
    const raw = await storageGetValue("campaign_history");
    const list = raw ? JSON.parse(raw) : [];
    list.unshift(record);
    if(list.length>50) list.length = 50; // guarda só as 50 mais recentes
    await storageSetValue("campaign_history", JSON.stringify(list));
  } catch(e){ /* armazenamento indisponível — segue o jogo normalmente */ }
}
async function loadCampaignHistory(){
  try{
    const raw = await storageGetValue("campaign_history");
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}

function buildShareText(){
  const info = state.endInfo || {type:"groups"};
  let headline;
  if(info.type==="champion") headline = t("shareHeadlineChampion");
  else if(info.type==="runnerup") headline = t("shareHeadlineRunnerup");
  else if(info.type==="playoffs") headline = t("shareHeadlinePlayoffs")(bracketLabel(info.stageLabelKey));
  else headline = t("shareHeadlineGroups");

  const modeLabel = state.difficulty==="classico" ? t("diffClassicoTitle") : state.difficulty==="copa" ? t("diffCopaTitle") : t("diffSelvaTitle");
  const wins = state.journey.filter(j=>j.result==="W").length;
  const losses = state.journey.filter(j=>j.result==="L").length;
  let mapsWon=0, mapsLost=0;
  state.journey.forEach(j=>{
    const parts = j.score.split("-").map(Number);
    mapsWon += parts[0]||0; mapsLost += parts[1]||0;
  });
  const mvp = info.type==="champion" ? getMVP() : null;

  const lines = [headline, ""];
  lines.push(`${t("shareModeLabel")}: ${modeLabel}`);
  lines.push(`${t("shareCampaignLabel")}: ${wins}V - ${losses}D`);
  lines.push(`${t("shareMapsLabel")}: ${mapsWon}-${mapsLost}`);
  lines.push(`${t("shareOverallLabel")}: ${teamOverall(state.roster)}`);
  if(mvp) lines.push(`${t("shareMvpLabel")}: ${mvp.name}`);
  SLOT_ORDER.forEach((roleKey,i)=>{
    const p = state.roster[i];
    if(p) lines.push(`${t("shareTeamMemberLabel")(roleLabel(roleKey))}: ${p.name}`);
  });
  if(state.headCoach) lines.push(`${t("shareCoachLabel")}: ${state.headCoach}`);
  lines.push("");
  lines.push(t("shareCta"));
  try{
    const href = window.location.href;
    if(/^https?:\/\//.test(href)) lines.push(href);
  }catch(e){}
  return lines.join("\n");
}

function initSeriesStats(){
  state.seriesStats = {
    us: state.matchStats.us.map(p=>({name:p.name, k:0})),
    them: state.matchStats.them.map(p=>({name:p.name, k:0})),
  };
}

// Verifica (sem alterar o estado) se a partida atual — incluindo o mapa em andamento —
// já superou o recorde "a bater" desta partida (que pode já ter sido elevado nesta mesma
// partida por um mapa anterior). Usado para exibir o aviso na tela de resultado.
// Verifica (sem alterar o estado) se o mapa/série atual — incluindo o que está rolando agora —
// já superou o recorde "a bater" da CAMPANHA (que pode já ter sido elevado por qualquer um dos
// dois lados, em qualquer partida anterior desta campanha). Usado para exibir o aviso na tela.
function checkRecords(){
  const bo = state.mapsToWin===3 ? "md5" : "md3";
  const cr = state.campaignRecords;

  function bestBreak(usArr, themArr, currentRecord){
    let best = null;
    function consider(p, side){
      if(p.kills > currentRecord.kills && (!best || p.kills>best.kills)){
        best = {side, name:p.name, kills:p.kills};
      }
    }
    usArr.forEach(x=>consider(x,"us"));
    themArr.forEach(x=>consider(x,"them"));
    return best;
  }

  const singleMapUs = state.matchStats.us.map(p=>({name:p.name, kills:p.k}));
  const singleMapThem = state.matchStats.them.map(p=>({name:p.name, kills:p.k}));
  const singleMapBreak = bestBreak(singleMapUs, singleMapThem, cr.singleMap);

  const seriesUs = state.matchStats.us.map((p,i)=>({name:p.name, kills:(state.seriesStats.us[i]?state.seriesStats.us[i].k:0)+p.k}));
  const seriesThem = state.matchStats.them.map((p,i)=>({name:p.name, kills:(state.seriesStats.them[i]?state.seriesStats.them[i].k:0)+p.k}));
  const seriesBreak = bestBreak(seriesUs, seriesThem, cr[bo]);

  return {singleMapBreak, seriesBreak, bo, prevSingleMap:cr.singleMap, prevSeries:cr[bo]};
}

// Decide se o mapa acabou: precisa de pelo menos 13 rounds E vantagem de 2 — em prorrogação
// (12-12 pra frente), continua até alguém abrir 2 de diferença, igual na vida real.
function isMapDecided(us, them){
  const leader = Math.max(us, them);
  const diff = Math.abs(us-them);
  return leader>=13 && diff>=2;
}

function initMatchStats(){
  const opp = currentOpponent();
  const sideStats = rosterArr => rosterArr.map(p=>({name:p.name, roles:p.roles||[], tags:p.tags||[], overall:p.overall||75, k:0, d:0, a:0}));
  state.matchStats = {
    us: sideStats(state.roster),
    them: sideStats(opp && opp.roster ? opp.roster : []),
  };
}

function weightedPick(weights){
  const total = weights.reduce((s,w)=>s+Math.max(1,w),0);
  let r = Math.random()*total;
  for(let i=0;i<weights.length;i++){
    r -= Math.max(1,weights[i]);
    if(r<=0) return i;
  }
  return weights.length-1;
}
function sampleDistinct(n, k){
  const idx = Array.from({length:n}, (_,i)=>i);
  const out = [];
  const count = Math.min(k, n);
  for(let i=0;i<count;i++){
    const j = Math.floor(Math.random()*idx.length);
    out.push(idx.splice(j,1)[0]);
  }
  return out;
}
// Peso de abate: craques com a tag "mm" (Mira Monstra) e overall 95+ têm chance ampliada de
// puxar os kills da rodada (mais forte em duelistas), abrindo caminho — nem sempre, só nas
// partidas monstruosas — para baterem os recordes reais de abates. Entry/Operator dão um empurrão menor.
// Elegível pra sistema de recorde: é Duelista OU tem Mira Monstra OU tem Clutch (qualquer um dos
// três já basta, não precisa ser tudo junto). Precisa também ter overall alto — senão fica fácil demais.
function isRecordCandidate(p){
  if((p.overall||0) < 89) return false;
  const roles = p.roles||[];
  const tags = p.tags||[];
  return roles.includes("duelist") || tags.includes("mm") || tags.includes("clutch");
}
function killWeight(p){
  let w = 10; // piso: todo mundo tem chance real de abater, mesmo sem destaque nenhum
  w += (p.overall - 75) * 0.3;
  const tags = p.tags||[];
  if(tags.includes("entry")) w += 1.5;
  if(tags.includes("operator")) w += 1;
  if(tags.includes("clutch")) w += 1.2;
  if(isRecordCandidate(p)) w += ((p.roles||[]).includes("duelist") ? 5.5 : 3.2);
  return w;
}
// Peso de assistência: craques com utilidade/IGL/lurker tendem a puxar mais assistências.
function assistWeight(p){
  let w = 10;
  w += (p.overall - 75) * 0.3;
  const tags = p.tags||[];
  if(tags.includes("utility")) w += 1.5;
  if(tags.includes("igl")) w += 1;
  if(tags.includes("lurker")) w += 0.8;
  return w;
}
function updateMatchStats(weWin){
  const winSide = weWin ? state.matchStats.us : state.matchStats.them;
  const loseSide = weWin ? state.matchStats.them : state.matchStats.us;
  if(!winSide.length || !loseSide.length) return;
  const killCount = 3 + Math.floor(Math.random()*3); // 3 a 5 baixas na rodada
  const diedIdx = sampleDistinct(loseSide.length, killCount);

  // rodada de ACE: craques com Mira Monstra (95+) ou Duelistas com Clutch (93+) têm uma chance
  // bem rara de fechar a rodada sozinhos — é o que permite (raramente) alcançar recordes como o
  // de 47 abates num mapa único, que exigem dominância extrema em várias rodadas.
  const aceCandidates = winSide.filter(isRecordCandidate);
  if(aceCandidates.length && Math.random()<0.22){
    const acePlayer = aceCandidates[Math.floor(Math.random()*aceCandidates.length)];
    diedIdx.forEach(idx=>{ loseSide[idx].d++; });
    acePlayer.k += killCount;
  } else {
    diedIdx.forEach(idx=>{
      loseSide[idx].d++;
      const killerIdx = weightedPick(winSide.map(killWeight));
      winSide[killerIdx].k++;
      if(Math.random()<0.55 && winSide.length>1){
        let assisterIdx = weightedPick(winSide.map(assistWeight));
        if(assisterIdx===killerIdx) assisterIdx = (assisterIdx+1)%winSide.length;
        winSide[assisterIdx].a++;
      }
    });
  }
  // chance de uma baixa "de troca" do lado perdedor
  if(Math.random()<0.2){
    const tradedIdx = weightedPick(loseSide.map(killWeight));
    loseSide[tradedIdx].k++;
    const victimIdx = Math.floor(Math.random()*winSide.length);
    winSide[victimIdx].d++;
  }
  // rodada de destaque: craques com Mira Monstra (95+) ou Duelistas com Clutch (93+) têm uma
  // chance rara de puxar 1 abate extra na rodada.
  const stars = winSide.filter(isRecordCandidate);
  if(stars.length && Math.random()<0.09){
    const idx = winSide.indexOf(stars[Math.floor(Math.random()*stars.length)]);
    winSide[idx].k++;
  }
}

// Lado atual (ataque/defesa) do jogador no mapa em andamento — troca a cada 12 rounds, igual real.
function currentSide(){
  const totalRounds = state.matchScore.us + state.matchScore.them;
  return (Math.floor(totalRounds/12) % 2 === 0) ? "attack" : "defense";
}

const DEFENSE_EDGE = 1.5; // defesa tem uma vantagem estatística pequena sobre o ataque, sempre
const PISTOL_ECON_BONUS = 3; // quem vence a pistola (rodada 1 ou 13) leva vantagem só na rodada seguinte

function simulateRound(){
  const opp = currentOpponent();
  const ourSide = currentSide();
  const theirSide = ourSide==="attack" ? "defense" : "attack";
  const ourComp = compositionBonus(state.roster, true);
  const theirComp = compositionBonus(opp.roster, false);
  const ourBuff = coachBuff(state.headCoach) + ourComp[ourSide] + chemistryBonus(state.roster, state.headCoach);
  const theirBuff = coachBuff(opp.coach) + theirComp[theirSide] + chemistryBonus(opp.roster, opp.coach);

  // vantagem estatística da defesa (independente de composição/química)
  const ourDefenseEdge = ourSide==="defense" ? DEFENSE_EDGE : 0;
  const theirDefenseEdge = theirSide==="defense" ? DEFENSE_EDGE : 0;

  // economia de pistola: só vale na rodada IMEDIATAMENTE seguinte à rodada 1 ou à rodada 13
  const roundsPlayed = state.matchScore.us + state.matchScore.them;
  let ourPistolBonus = 0, theirPistolBonus = 0;
  if(roundsPlayed===1 || roundsPlayed===13){
    const pistolWinnerIdx = roundsPlayed===1 ? 0 : 12;
    if(state.roundLog[pistolWinnerIdx]==="win") ourPistolBonus = PISTOL_ECON_BONUS;
    else theirPistolBonus = PISTOL_ECON_BONUS;
  }

  const us = teamOverall(state.roster) + ourBuff*BUFF_DAMPING + ourDefenseEdge + ourPistolBonus;
  const oppRating = opp.rating + theirBuff*BUFF_DAMPING + theirDefenseEdge + theirPistolBonus;
  const diff = us - oppRating;
  const baseProb = 0.5 + diff/130;
  const prob = Math.min(0.94, Math.max(0.06, baseProb));
  const weWin = Math.random() < prob;
  if(weWin){ state.matchScore.us++; state.roundLog.push("win"); }
  else { state.matchScore.them++; state.roundLog.push("loss"); }
  updateMatchStats(weWin);
}



render();
