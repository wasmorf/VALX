  if(confirmDraftBtn) confirmDraftBtn.onclick = ()=>{
    const c = state.confirmingCandidate;
    state.confirmingCandidate = null;
    state.currentCandidates = [];
    let openSlots = SLOT_ORDER.map((roleKey,i)=>i).filter(i=>!state.roster[i] && c.roles.includes(SLOT_ORDER[i]));
    if(state.difficulty==="copa" && openSlots.length>1){
      // Seleções são pequenas — só oferece vagas que não travem o resto do draft depois.
      const draftedNames = new Set(state.roster.filter(Boolean).map(p=>p.name));
      const selecaoPlayers = selecaoPlayerObjects(state.selecao).filter(p=>!draftedNames.has(p.name) && p.name!==c.name);
      openSlots = openSlots.filter(i=>{
        const remainingRoles = SLOT_ORDER.filter((rk,idx)=>!state.roster[idx] && idx!==i);
        return canCompleteRoster(remainingRoles, selecaoPlayers);
      });
    }
    if(openSlots.length===1){
      state.roster[openSlots[0]] = c;
      state.currentCandidate = null;
    } else {
      state.currentCandidate = c;
      state.pendingSlotChoice = true;
    }
    render();
  };
  const backToListBtn = document.getElementById("back-to-list-btn");
  if(backToListBtn) backToListBtn.onclick = ()=>{
    state.confirmingCandidate = null;
    render();
  };
  document.querySelectorAll("[data-slotidx]").forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.dataset.slotidx, 10);
      state.roster[idx] = state.currentCandidate;
      state.currentCandidate = null;
      state.pendingSlotChoice = false;
      render();
    };
  });
  const skipBatchBtn = document.getElementById("skip-batch-btn");
  if(skipBatchBtn) skipBatchBtn.onclick = ()=>{
    state.skipsUsed++;
    state.currentCandidates = [];
    render();
  };
  const toMatchBtn = document.getElementById("to-match-btn");
  if(toMatchBtn) toMatchBtn.onclick = ()=>{
    setupTournament();
    state.screen = "match";
    render();
  };

  const simRoundBtn = document.getElementById("sim-round-btn");
  if(simRoundBtn) simRoundBtn.onclick = ()=>{ simulateRound(); render(); };
  const simAllBtn = document.getElementById("sim-all-btn");
  if(simAllBtn) simAllBtn.onclick = ()=>{
    while(!isMapDecided(state.matchScore.us, state.matchScore.them)){ simulateRound(); }
    render();
  };
  const nextMapBtn = document.getElementById("next-map-btn");
  if(nextMapBtn) nextMapBtn.onclick = ()=>{ finalizeMap(); startNextMap(); render(); };
  const continueBtn = document.getElementById("continue-btn");
  if(continueBtn) continueBtn.onclick = ()=>{ finalizeMap(); handleContinue(); render(); };

  const restartBtn = document.getElementById("restart-btn");
  if(restartBtn) restartBtn.onclick = ()=>{
    resetToIntro();
    render();
  };
  const brandHomeBtn = document.getElementById("brand-home-btn");
  if(brandHomeBtn) brandHomeBtn.onclick = ()=>{
    resetToIntro();
    render();
  };
  const ascensaoShareXBtn = document.getElementById("ascensao-share-x-btn");
  if(ascensaoShareXBtn) ascensaoShareXBtn.onclick = ()=>{
    const text = buildAscensaoShareText();
    const webUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "");
    if(isMobile){
      window.location.href = webUrl;
    } else {
      window.open(webUrl, "_blank", "noopener");
    }
  };
  const shareXBtn = document.getElementById("share-x-btn");
  if(shareXBtn) shareXBtn.onclick = ()=>{
    const text = buildShareText();
    const webUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "");
    // Usa sempre a URL normal do X — se o app estiver instalado, o próprio celular (iOS/Android)
    // já abre ele automaticamente a partir desse link (Universal Links), sem precisar de nenhum
    // truque de esquema customizado (tipo "twitter://"), que é frágil e o Safari bloqueia quando
    // acionado de forma assíncrona (ex: dentro de um setTimeout), mesmo vindo de um clique real.
    if(isMobile){
      window.location.href = webUrl;
    } else {
      window.open(webUrl, "_blank", "noopener");
    }
  };
}

function handleContinue(){
  const tr = state.tournament;
  const won = state.mapsUs === state.mapsToWin;

  if(tr.stage==="regionalGroups"){
    const g = tr.regionalGroups.myGroup;
    const pending = g.pending;
    const oppTeam = pending.teamA.isPlayer ? pending.teamB : pending.teamA;
    const {atual, total} = regionalPlayerRoundNumber(g.schedule, pending.roundIdx);
    state.journey.push({
      stageLabel: `${t("groupStageTag")} · ${t("groupWord")} ${tr.myGroupLetter} · ${t("regionalRoundLabel")(atual, total)}`,
      opponent: oppTeam.name,
      result: won ? "W" : "L",
      score: `${state.mapsUs}-${state.mapsThem}`,
    });
    const winner = won ? tr.playerTeam : oppTeam;
    const loser = won ? oppTeam : tr.playerTeam;
    // soma o placar de rounds de verdade dos mapas que o jogador acabou de jogar
    let playerRounds = 0, oppRounds = 0;
    state.mapHistory.forEach(m=>{ playerRounds += m.us; oppRounds += m.them; });
    const roundsA = pending.teamA.isPlayer ? playerRounds : oppRounds;
    const roundsB = pending.teamB.isPlayer ? playerRounds : oppRounds;
    registrarResultadoGrupoRegional(g.standings, pending.teamA, pending.teamB, {winner, loser}, roundsA, roundsB);
    g.matchIdxInRound++;
    advanceRegionalGroups();
    return;
  }

  if(tr.stage==="groups"){
    const brk = tr.groupBracket;
    const pending = brk.pending;
    const oppTeam = pending.teamA.isPlayer ? pending.teamB : pending.teamA;
    state.journey.push({
      stageLabel: `${t("groupStageTag")} · ${t("groupWord")} A · ${bracketLabel(pending.def.labelKey)}`,
      opponent: oppTeam.name,
      result: won ? "W" : "L",
      score: `${state.mapsUs}-${state.mapsThem}`,
    });
    const winner = won ? tr.playerTeam : oppTeam;
    const loser = won ? oppTeam : tr.playerTeam;
    brk.matches[pending.def.id] = {winner, loser};
    brk.pointerIdx++;

    const qualified = won && GROUP_QUALIFY_IDS.includes(pending.def.id);
    const eliminated = !won && GROUP_ELIM_IDS.includes(pending.def.id);
    if(qualified || eliminated){
      finishGroupBracketAI(); // resolve o que sobrou do grupo (só IA) pra fechar os classificados
      if(qualified){
        const top2 = [
          {...brk.matches.m3.winner, isGroupWinner:true},
          {...brk.matches.m5.winner, isGroupWinner:false},
        ];
        const qualifiers = [...top2, ...tr.otherGroupsTop2.B, ...tr.otherGroupsTop2.C, ...tr.otherGroupsTop2.D];
        buildPlayoffBracket(qualifiers);
        advanceTournament();
      } else {
        ascensaoOrFinalize({type:"groups"});
      }
      return;
    }
    // ainda não decidido (1ª rodada) — segue pro próximo confronto do jogador no grupo
    advanceGroupBracket();
    return;
  }

  if(tr.stage==="playoffs"){
    const brk = tr.bracket;
    const pending = brk.pending;
    const oppTeam = pending.teamA.isPlayer ? pending.teamB : pending.teamA;
    state.journey.push({
      stageLabel: bracketLabel(pending.def.labelKey),
      opponent: oppTeam.name,
      result: won ? "W" : "L",
      score: `${state.mapsUs}-${state.mapsThem}`,
    });
    const winner = won ? tr.playerTeam : oppTeam;
    const loser = won ? oppTeam : tr.playerTeam;
    brk.matches[pending.def.id] = {winner, loser};
    brk.pointerIdx++;

    if(won){
      advanceTournament();
      return;
    }
    // jogador perdeu
    const finalId = brk.def ? brk.def[brk.def.length-1].id : "m14";
    if(pending.def.id === finalId){
      ascensaoOrFinalize({type:"runnerup"});
      return;
    }
    if(LB_KEYS.includes(pending.def.labelKey)){
      ascensaoOrFinalize({type:"playoffs", stageLabelKey: pending.def.labelKey});
      return;
    }
    // derrota no upper bracket: cai para o lower, torneio continua
    advanceTournament();
  }
}

// Inicia uma partida nova (MD3 = mapsToWin 2, MD5 = mapsToWin 3).
function startMatch(mapsToWin){
  state.mapsToWin = mapsToWin;
  state.mapsUs = 0;
  state.mapsThem = 0;
  state.mapHistory = [];
  state.matchScore = {us:0, them:0};
  state.roundLog = [];
  initMatchStats();
  initSeriesStats();
}
// Começa o próximo mapa da mesma partida (mantém o placar de mapas e o total de abates da série).
function startNextMap(){
  state.matchScore = {us:0, them:0};
  state.roundLog = [];
  initMatchStats();
}
// Registra o resultado do mapa atual no placar da partida e acumula os abates na série e na campanha.
function finalizeMap(){
  const wonMap = state.matchScore.us > state.matchScore.them;
  state.mapHistory.push({us:state.matchScore.us, them:state.matchScore.them});
  if(wonMap) state.mapsUs++; else state.mapsThem++;
  state.matchStats.us.forEach((p,i)=>{ if(state.seriesStats.us[i]) state.seriesStats.us[i].k += p.k; });
  state.matchStats.them.forEach((p,i)=>{ if(state.seriesStats.them[i]) state.seriesStats.them[i].k += p.k; });
  if(state.campaignStats){
    state.matchStats.us.forEach((p,i)=>{
      const cs = state.campaignStats.us[i];
      if(cs){ cs.k += p.k; cs.d += p.d; cs.a += p.a; }
    });
  }
  // recorde de mapa único da campanha (vale pro seu time E pro adversário)
  const cr = state.campaignRecords;
  [...state.matchStats.us, ...state.matchStats.them].forEach(p=>{
    if(p.k > cr.singleMap.kills) cr.singleMap = {kills:p.k, holder:p.name};
  });
  // recorde de série (MD3/MD5) da campanha — soma o que já tinha na série + este mapa
  const seriesKey = state.mapsToWin===3 ? "md5" : "md3";
  state.matchStats.us.forEach((p,i)=>{
    const total = (state.seriesStats.us[i] ? state.seriesStats.us[i].k : 0);
    if(total > cr[seriesKey].kills) cr[seriesKey] = {kills:total, holder:p.name};
  });
  state.matchStats.them.forEach((p,i)=>{
    const total = (state.seriesStats.them[i] ? state.seriesStats.them[i].k : 0);
    if(total > cr[seriesKey].kills) cr[seriesKey] = {kills:total, holder:p.name};
  });
}

// Melhor jogador da campanha (MVP), baseado numa nota simples de desempenho acumulado.
function getMVP(){
  if(!state.campaignStats || !state.campaignStats.us.length) return null;
  return state.campaignStats.us.reduce((best, p)=>{
    const score = p.k + p.a*0.5 - p.d*0.3;
    const bestScore = best ? (best.k + best.a*0.5 - best.d*0.3) : -Infinity;
    return score > bestScore ? p : best;
  }, null);
}

// Monta o texto de compartilhamento (X / WhatsApp) com o resumo da campanha.
// Marca a campanha como encerrada e salva um registro dela no histórico (armazenamento pessoal).
// Armazenamento com fallback: usa window.storage quando disponível (preview do Claude), e cai
// pra localStorage quando o site está hospedado de verdade fora daqui (GitHub Pages, etc.) —
// sem isso, o histórico de campanhas simplesmente não funciona fora do preview do Claude.
const HAS_ARTIFACT_STORAGE = typeof window!=="undefined" && window.storage && typeof window.storage.get==="function";
async function storageGetValue(key){
  if(HAS_ARTIFACT_STORAGE){
    try{ const res = await window.storage.get(key, false); return res ? res.value : null; }
    catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSetValue(key, value){
  if(HAS_ARTIFACT_STORAGE){
    try{ await window.storage.set(key, value, false); return; }catch(e){ /* tenta localStorage abaixo */ }
  }
  try{ localStorage.setItem(key, value); }catch(e){ /* armazenamento indisponível — segue o jogo normalmente */ }
}

// Ponto central: quando um estágio do torneio chega ao fim (elimina ou fecha o chaveamento),
// decide se finaliza a campanha normal OU passa pro próximo estágio do Rumo à Ascensão
// (Regional -> Mundial -> Copa do Mundo, se for o ano certo).
// Decide se a colocação alcançada nos playoffs Regionais/Mundiais classifica pro próximo
// estágio, baseado em ONDE o jogador foi eliminado (sem precisar do chaveamento inteiro
// resolvido, já que na campanha ao vivo o resto do chaveamento pode não ter rodado ainda).
function ascensaoQualifiesFromPlayoffs(qualifyCount, endInfo){
  if(endInfo.type==="champion") return true;
  if(endInfo.type==="runnerup") return qualifyCount>=2;
  const labelKey = endInfo.stageLabelKey;
  if(labelKey==="lbFinal") return qualifyCount>=3;
  if(labelKey==="lbSemi") return qualifyCount>=4;
  return false; // lbR1/lbR2 — eliminado cedo demais, nunca classifica
}
// Controlador central do Rumo à Ascensão ao vivo: decide o que acontece quando um estágio
// termina (Regional -> Mundial -> Copa do Mundo, se for o ano certo -> fim da temporada).
// Registra os craques do elenco atual como campeões Mundiais/Copa do Mundo dessa campanha —
// eles ganham o bônus de overall até o fim das 16 temporadas. Se o próprio personagem foi o
// MVP daquela conquista, conta mais uma pro contador de MVPs da carreira.
function ascensaoRegisterChampions(mvp){
  const c = state.carreira;
  if(!c.campeoesMundiais) c.campeoesMundiais = [];
  if(!c.campeoesMundiaisCoach) c.campeoesMundiaisCoach = [];
  state.roster.filter(Boolean).forEach(p=>{
    if(!c.campeoesMundiais.some(n=>n.toLowerCase()===p.name.toLowerCase())) c.campeoesMundiais.push(p.name);
  });
  if(state.headCoach && !c.campeoesMundiaisCoach.some(n=>n.toLowerCase()===state.headCoach.toLowerCase())){
    c.campeoesMundiaisCoach.push(state.headCoach);
  }
  if(mvp && mvp.isCharacter){
    c.mvpCount = (c.mvpCount||0) + 1;
  }
}
// Igual acima, mas pro título Regional (bônus menor) — jogadores e o técnico do time que
// ganhou o Regional entram nessa lista separada.
function ascensaoRegisterRegionalChampions(mvp){
  const c = state.carreira;
  if(!c.campeoesRegionais) c.campeoesRegionais = [];
  if(!c.campeoesRegionaisCoach) c.campeoesRegionaisCoach = [];
  state.roster.filter(Boolean).forEach(p=>{
    if(!c.campeoesRegionais.some(n=>n.toLowerCase()===p.name.toLowerCase())) c.campeoesRegionais.push(p.name);
  });
  if(state.headCoach && !c.campeoesRegionaisCoach.some(n=>n.toLowerCase()===state.headCoach.toLowerCase())){
    c.campeoesRegionaisCoach.push(state.headCoach);
  }
  if(mvp && mvp.isCharacter){
    c.mvpCount = (c.mvpCount||0) + 1;
  }
}
function ascensaoHandleStageEnd(endInfo){
  const tr = state.tournament;
  const c = state.carreira;
  const phase = tr.ascensaoPhase;

  if(phase==="regional"){
    const regionalPlacement = {type: endInfo.type, stageLabelKey: endInfo.stageLabelKey};
    let qualificou;
    if(endInfo.type==="groups"){
      qualificou = false;
    } else if(endInfo.type==="champion" || endInfo.type==="runnerup"){
      qualificou = REGIONAL_MUNDIAL_QUALIFY_COUNT[c.regiao] >= (endInfo.type==="champion" ? 1 : 2);
    } else {
      const qualifyCount = REGIONAL_MUNDIAL_QUALIFY_COUNT[c.regiao];
      qualificou = ascensaoQualifiesFromPlayoffs(qualifyCount, endInfo);
    }
    tr.ascensaoRegionalPlacement = regionalPlacement;
    const mvpRegional = endInfo.type==="champion" ? getMVP() : null;
    if(endInfo.type==="champion") ascensaoRegisterRegionalChampions(mvpRegional);
    if(qualificou){
      ascensaoShowStageSummary(t("ascensaoRegionalLabel"), regionalPlacement, null, {type:"mundial"}, true, mvpRegional);
      return;
    }
    // não classificou pro Mundial — mesmo assim, se for ano de Copa, joga a Copa do Mundo.
    if(isAscensaoWorldCupSeason(c.temporada)){
      ascensaoShowStageSummary(t("ascensaoRegionalLabel"), regionalPlacement, null, {type:"worldcup", regionalPlacement, qualificou:false}, false, mvpRegional);
    } else {
      ascensaoShowStageSummary(t("ascensaoRegionalLabel"), regionalPlacement, null, {type:"finish", regionalPlacement, qualificou:false}, false, mvpRegional);
    }
    return;
  }
  if(phase==="mundial"){
    let mundialResultado;
    let mvpMundial = null;
    if(endInfo.type==="groups") mundialResultado = "worldGroups";
    else if(endInfo.type==="champion"){ mundialResultado = "champion"; mvpMundial = getMVP(); ascensaoRegisterChampions(mvpMundial); }
    else if(endInfo.type==="runnerup") mundialResultado = "runnerup";
    else mundialResultado = "worldPlayoffs";
    const proxima = isAscensaoWorldCupSeason(c.temporada)
      ? {type:"worldcup", regionalPlacement: tr.ascensaoRegionalPlacement, qualificou:true, mundialResultado}
      : {type:"finish", regionalPlacement: tr.ascensaoRegionalPlacement, qualificou:true, mundialResultado};
    ascensaoShowStageSummary(t("ascensaoMundialLabel"), null, mundialResultado, proxima, undefined, mvpMundial);
    return;
  }
  if(phase==="worldcup"){
    let copaResultado;
    let mvpCopa = null;
    if(endInfo.type==="groups") copaResultado = "groups";
    else if(endInfo.type==="champion"){ copaResultado = "champion"; mvpCopa = getMVP(); ascensaoRegisterChampions(mvpCopa); }
    else if(endInfo.type==="runnerup") copaResultado = "runnerup";
    else copaResultado = "playoffs";
    ascensaoShowStageSummary(t("ascensaoWorldCupLabel"), null, copaResultado, {
      type:"finish", regionalPlacement: tr.ascensaoRegionalPlacement, qualificou: tr.ascensaoQualificou,
      mundialResultado: tr.ascensaoMundialResultado, copaResultado,
    }, undefined, mvpCopa);
    return;
  }
}
// Mostra um resumo da competição que acabou de terminar (com o caminho de partidas dela) e
// espera o jogador clicar em "Continuar" antes de seguir pra próxima etapa da temporada.
function ascensaoShowStageSummary(nomeCompeticao, regionalPlacement, resultadoGenerico, proximaAcao, qualificou, mvp){
  const c = state.carreira;
  c.stageSummary = {
    nomeCompeticao,
    label: regionalPlacement ? ascensaoRegionalPlacementLabel(regionalPlacement) : ascensaoResultLabel(resultadoGenerico),
    qualificadoLabel: qualificou!==undefined ? ascensaoQualifiedLabel(qualificou) : null,
    journey: state.journey.slice(state.journeyStageStart || 0),
    mvp: mvp || null,
  };
  c.pendingNextAction = proximaAcao;
  state.screen = "ascensaoStageSummary";
}
// Executa a próxima etapa da temporada depois que o jogador confirma o resumo da competição.
function ascensaoAdvanceFromSummary(){
  const c = state.carreira;
  const acao = c.pendingNextAction;
  c.pendingNextAction = null;
  c.stageSummary = null;
  if(acao.type==="mundial"){
    setupAscensaoMundialStage();
  } else if(acao.type==="worldcup"){
    setupAscensaoWorldCupStage(acao.regionalPlacement, acao.qualificou, acao.mundialResultado);
  } else if(acao.type==="finish"){
    ascensaoFinishSeason(acao.regionalPlacement, acao.qualificou, acao.mundialResultado, acao.copaResultado);
  }
}
// Monta e começa a fase Mundial ao vivo (16 times, os classificados de todas as 6 regiões).
function setupAscensaoMundialStage(){
  const c = state.carreira;
  state.screen = "match";
  state.journeyStageStart = state.journey.length;
  const playerOrgTeam = state.tournament.playerTeam;
  const regionalPlacementSalvo = state.tournament.ascensaoRegionalPlacement;
  const snapshotDaMinhaRegiao = state.tournament.ascensaoRegionalTransferSnapshot;
  const snapshotDeCoachDaMinhaRegiao = state.tournament.ascensaoRegionalCoachSnapshot;
  playerOrgTeam.isPlayer = true;
  state.campaignStats = { us: playerOrgTeam.roster.map((p,i)=>({name:p.name, role:SLOT_ORDER[i], isCharacter:p.isCharacter, country:p.country, k:0, d:0, a:0})) };
  const worldQualifiers = [playerOrgTeam];
  const usadosGlobalmente = new Set(playerOrgTeam.roster.filter(Boolean).map(p=>p.name));
  const usadosGlobalmenteCoach = new Set([playerOrgTeam.coach].filter(Boolean));
  Object.keys(TEAM_REGIONS).forEach(r=>{
    const n = REGIONAL_MUNDIAL_QUALIFY_COUNT[r];
    // pra minha própria região, reaproveita o resultado REAL da fase Regional (já rodou o
    // mercado de verdade) em vez de simular de novo — evita craque duplicado entre o meu
    // time e outro time da mesma região que participaram do mesmo mercado.
    const transferencias = (r===c.regiao && snapshotDaMinhaRegiao) ? snapshotDaMinhaRegiao : simulateRegionalTransfers(r, r===c.regiao ? c.time : null, usadosGlobalmente);
    const transferenciasCoach = (r===c.regiao && snapshotDeCoachDaMinhaRegiao) ? snapshotDeCoachDaMinhaRegiao : simulateRegionalCoachTransfers(r, r===c.regiao ? c.time : null, transferencias, usadosGlobalmenteCoach);
    if(r!==c.regiao){
      TEAM_REGIONS[r].forEach(org=>{
        if(transferencias[org]) c.orgRostersSnapshot[org] = {players: transferencias[org], coach: transferenciasCoach[org] || c.orgRostersSnapshot[org].coach};
      });
      ascensaoDedupeSnapshot(c.orgRostersSnapshot, TEAM_REGIONS[r]);
    }
    let selecionados;
    if(r===c.regiao){
      const outrosDaRegiao = TEAM_REGIONS[r].filter(org=>org!==c.time);
      selecionados = shuffle(outrosDaRegiao).slice(0, n-1);
    } else {
      selecionados = shuffle(TEAM_REGIONS[r]).slice(0,n);
    }
    selecionados.forEach(org=>{
      const time = buildAscensaoOrgTeam(org, false, transferencias[org], transferenciasCoach[org]);
      worldQualifiers.push(time);
      time.roster.filter(Boolean).forEach(p=>usadosGlobalmente.add(p.name));
      if(time.coach) usadosGlobalmenteCoach.add(time.coach);
    });
  });
  state.roster = playerOrgTeam.roster;
  state.teamName = playerOrgTeam.name;
  state.headCoach = playerOrgTeam.coach;
  const allTeams = shuffle(worldQualifiers);
  const groupA = allTeams.slice(0,4), groupB = allTeams.slice(4,8), groupC = allTeams.slice(8,12), groupD = allTeams.slice(12,16);
  const myGroup = [groupA,groupB,groupC,groupD].find(g=>g.some(tm=>tm.isPlayer));
  const others = [groupA,groupB,groupC,groupD].filter(g=>g!==myGroup);
  const otherGroupsTop2 = {};
  ["B","C","D"].forEach((letra,i)=>{
    const g = others[i];
    const brkAI = { seeds: shuffle(g), matches: {} };
    GROUP_BRACKET_DEF.forEach(d=>{ brkAI.matches[d.id] = {winner:null,loser:null}; });
    GROUP_BRACKET_DEF.forEach(d=>{
      const a = resolveBracketTeam(d.aFrom, brkAI), b = resolveBracketTeam(d.bFrom, brkAI);
      brkAI.matches[d.id] = decideMatchWinner(a, b, 2);
    });
    otherGroupsTop2[letra] = [
      {...brkAI.matches.m3.winner, isGroupWinner:true},
      {...brkAI.matches.m5.winner, isGroupWinner:false},
    ];
  });
  state.tournament = {
    stage: "groups",
    playerTeam: playerOrgTeam,
    otherGroupsTop2,
    ascensaoPhase: "mundial",
    ascensaoRegionalPlacement: regionalPlacementSalvo,
    groupBracket: { seeds: shuffle(myGroup), matches: {}, pointerIdx:0, pending:null },
  };
  GROUP_BRACKET_DEF.forEach(d=>{ state.tournament.groupBracket.matches[d.id] = {winner:null, loser:null}; });
  advanceGroupBracket();
}
// Monta e começa a Copa do Mundo ao vivo (16 Seleções, 4 grupos estilo GSL, playoffs de 8) —
// o personagem entra na Seleção do seu país, substituindo um craque real na função dele.
function setupAscensaoWorldCupStage(regionalPlacement, qualificou, mundialResultado){
  const c = state.carreira;
  state.tournament = {ascensaoRegionalPlacement: regionalPlacement, ascensaoQualificou: qualificou, ascensaoMundialResultado: mundialResultado};
  state.screen = "match";
  state.journeyStageStart = state.journey.length;
  const myRoster = buildAscensaoNationalTeam();
  const playerTeam = {id:"player", isPlayer:true, name:c.nacao, roster:myRoster, coach:WC_SELECOES[c.nacao].coaches[0], rating:teamOverall(myRoster)};
  state.roster = myRoster;
  state.teamName = c.nacao;
  state.headCoach = playerTeam.coach;
  const outrasNacoes = Object.keys(WC_SELECOES).filter(n=>n!==c.nacao);
  const aiTeams = outrasNacoes.map(nacao=>{
    const roster = ascensaoApplyChampionBonus(buildBestRoster(ascensaoSelecaoPlayerObjects(nacao)));
    return {id:nacao, name:nacao, roster, coach:WC_SELECOES[nacao].coaches[0], rating:teamOverall(roster)};
  });
  const allTeams = shuffle([playerTeam, ...aiTeams]);
  const groupA = allTeams.slice(0,4), groupB = allTeams.slice(4,8), groupC = allTeams.slice(8,12), groupD = allTeams.slice(12,16);
  const myGroup = [groupA,groupB,groupC,groupD].find(g=>g.some(tm=>tm.isPlayer));
  const others = [groupA,groupB,groupC,groupD].filter(g=>g!==myGroup);
  const otherGroupsTop2 = {};
  ["B","C","D"].forEach((letra,i)=>{
    const g = others[i];
    const brkAI = { seeds: shuffle(g), matches: {} };
    GROUP_BRACKET_DEF.forEach(d=>{ brkAI.matches[d.id] = {winner:null,loser:null}; });
    GROUP_BRACKET_DEF.forEach(d=>{
      const a = resolveBracketTeam(d.aFrom, brkAI), b = resolveBracketTeam(d.bFrom, brkAI);
      brkAI.matches[d.id] = decideMatchWinner(a, b, 2);
    });
    otherGroupsTop2[letra] = [
      {...brkAI.matches.m3.winner, isGroupWinner:true},
      {...brkAI.matches.m5.winner, isGroupWinner:false},
    ];
  });
  state.tournament = {
    stage: "groups",
    playerTeam,
    otherGroupsTop2,
    ascensaoPhase: "worldcup",
    ascensaoRegionalPlacement: regionalPlacement,
    ascensaoQualificou: qualificou,
    ascensaoMundialResultado: mundialResultado,
    groupBracket: { seeds: shuffle(myGroup), matches: {}, pointerIdx:0, pending:null },
  };
  GROUP_BRACKET_DEF.forEach(d=>{ state.tournament.groupBracket.matches[d.id] = {winner:null, loser:null}; });
  state.campaignStats = { us: myRoster.map((p,i)=>({name:p.name, role:SLOT_ORDER[i], isCharacter:p.isCharacter, country:p.country, k:0, d:0, a:0})) };
  advanceGroupBracket();
}
// Fecha a temporada: guarda o resultado (e o da Copa do Mundo, se rolou) no histórico e mostra
// a tela de resumo da temporada, com o caminho de partidas que o jogador acabou de jogar.
// Sorteia se o craque recebe uma oferta de transferência de outro time (~25% de chance) —
// guarda a oferta em state.carreira.oferta e retorna true se rolou.
// Proximidade entre regiões — usada pra pesar de onde as ofertas de transferência vêm.
// BR/LAS são vizinhas, APAC/CHN são vizinhas, NA e EMEA ficam mais isoladas.
// De qual região esportiva cada país costuma fazer parte — usado pra saber a "região de casa"
// do craque pela nacionalidade dele (não pelo time atual).
const COUNTRY_TO_REGION = {
  US:"NA", CA:"NA", MX:"NA",
  BR:"BR",
  AR:"LAS", CL:"LAS", BO:"LAS", CO:"LAS", EC:"LAS", GY:"LAS", PY:"LAS", PE:"LAS", SR:"LAS", UY:"LAS", VE:"LAS",
  KR:"APAC", VN:"APAC", PH:"APAC", SG:"APAC", ID:"APAC", MY:"APAC", TH:"APAC",
  CN:"CHN",
  TR:"EMEA", RU:"EMEA", PL:"EMEA", UA:"EMEA", GB:"EMEA", FR:"EMEA", MA:"EMEA", DK:"EMEA", NL:"EMEA",
  LT:"EMEA", FI:"EMEA", SE:"EMEA", LV:"EMEA", CZ:"EMEA", BE:"EMEA", EE:"EMEA", MD:"EMEA", DE:"EMEA", ES:"EMEA",
};
const ASCENSAO_REGION_PROXIMITY = {
  BR: ["LAS"], LAS: ["BR"],
  APAC: ["CHN"], CHN: ["APAC"],
  NA: [], EMEA: [],
};
function ascensaoOrgOfferWeight(orgRegiao, minhaRegiao, minhaRegiaoDeCasa){
  if(orgRegiao===minhaRegiao) return 4;
  if(orgRegiao===minhaRegiaoDeCasa) return 4; // região do seu país também prioriza igual
  if((ASCENSAO_REGION_PROXIMITY[minhaRegiao]||[]).includes(orgRegiao)) return 3;
  return 1;
}
// Sorteia N itens sem repetir, respeitando pesos (quanto maior o peso, mais chance de sair).
function weightedSampleWithoutReplacement(items, weights, count){
  const pool = items.map((item,i)=>({item, weight:weights[i]}));
  const resultado = [];
  for(let k=0; k<count && pool.length>0; k++){
    const total = pool.reduce((s,p)=>s+p.weight, 0);
    let r = Math.random()*total;
    let idx = 0;
    for(; idx<pool.length; idx++){
      r -= pool[idx].weight;
      if(r<=0) break;
    }
    idx = Math.min(idx, pool.length-1);
    resultado.push(pool[idx].item);
    pool.splice(idx, 1);
  }
  return resultado;
}
function ascensaoRollTransferOffer(){
  const c = state.carreira;
  const baseRosters = c.orgRostersSnapshot || ASCENSAO_TEAM_ROSTERS;
  if(Math.random()>=0.82) return false;
  const candidatos = Object.entries(TEAM_REGIONS).flatMap(([regiao,orgs])=>orgs.map(org=>({org,regiao})))
    .filter(o=>o.org!==c.time && baseRosters[o.org]);
  if(candidatos.length===0) return false;
  const quantidade = Math.min(candidatos.length, Math.floor(Math.random()*4)); // 0 a 3
  if(quantidade===0) return false;
  const minhaRegiaoDeCasa = COUNTRY_TO_REGION[c.nacionalidade];
  const pesos = candidatos.map(o=>ascensaoOrgOfferWeight(o.regiao, c.regiao, minhaRegiaoDeCasa));
  // sorteia bem mais candidatos do que precisa, porque alguns vão ser descartados por não
  // terem vaga pra nenhuma função que o craque escolheu (principal ou secundária).
  const sorteados = weightedSampleWithoutReplacement(candidatos, pesos, Math.min(candidatos.length, quantidade*3));
  // usa o elenco ATUAL (depois das transferências dessa temporada), não o elenco original —
  // simula uma vez por região dos escolhidos e reaproveita.
  const transferenciasPorRegiao = {};
  const transferenciasCoachPorRegiao = {};
  const ofertasComFuncao = [];
  for(const o of sorteados){
    if(ofertasComFuncao.length>=quantidade) break;
    if(!transferenciasPorRegiao[o.regiao]){
      transferenciasPorRegiao[o.regiao] = simulateRegionalTransfers(o.regiao, o.regiao===c.regiao ? c.time : null);
      transferenciasCoachPorRegiao[o.regiao] = simulateRegionalCoachTransfers(o.regiao, o.regiao===c.regiao ? c.time : null, transferenciasPorRegiao[o.regiao]);
    }
    const jogadores = transferenciasPorRegiao[o.regiao][o.org] || baseRosters[o.org].players;
    const coach = transferenciasCoachPorRegiao[o.regiao][o.org] || baseRosters[o.org].coach;
    const realPlayers = jogadores.map(n=>POOL.find(p=>p.name.toLowerCase()===n.toLowerCase())).filter(Boolean);
    const rosterComPersonagem = buildTeamWithCharacterRandomRole(realPlayers);
    const personagemNoTime = rosterComPersonagem.find(p=>p && p.isCharacter);
    if(!personagemNoTime) continue; // não coube em nenhuma função que o craque escolheu — não oferece
    const funcaoNaOferta = SLOT_ORDER[rosterComPersonagem.indexOf(personagemNoTime)];
    ofertasComFuncao.push({ org: o.org, regiao: o.regiao, jogadores, coach, funcao: funcaoNaOferta });
  }
  if(ofertasComFuncao.length===0) return false;
  c.ofertas = ofertasComFuncao;
  return true;
}
// Atualiza a "forma" de cada organização com base no retrospecto REAL dela na temporada
// inteira (todas as vitórias e derrotas, não só contra o jogador) — quem teve mais derrota
// que vitória fica "mal" (mais chance de buscar reforço na próxima), quem teve saldo positivo
// fica "bem" (menos chance de mexer no time).
function ascensaoUpdateOrgForm(){
  const c = state.carreira;
  if(!c.orgForm) c.orgForm = {};
  const sr = c.seasonResults || {};
  Object.entries(sr).forEach(([org, rec])=>{
    if(!(org in c.orgForm)) c.orgForm[org] = 0;
    const saldo = rec.losses - rec.wins; // positivo = temporada ruim, negativo = temporada boa
    const delta = Math.max(-2, Math.min(2, Math.round(saldo/2)));
    c.orgForm[org] = Math.max(-4, Math.min(4, c.orgForm[org] + delta));
  });
  c.seasonResults = {};
}
function ascensaoFinishSeason(regionalPlacement, regionalQualificou, mundialResultado, copaResultado){
  const c = state.carreira;
  const entry = {temporada:c.temporada, time:c.time, regiao:c.regiao, regionalPlacement, regionalQualificou, journey: state.journey};
  if(mundialResultado) entry.mundialResultado = mundialResultado;
  if(copaResultado) entry.copaResultado = copaResultado;
  c.historico.push(entry);
  ascensaoUpdateOrgForm();
  c.temporada += 1;
  state.difficulty = null;
  state.screen = "ascensaoSeason";
}
function ascensaoOrFinalize(endInfo){
  state.endInfo = endInfo;
  if(state.difficulty==="ascensao"){
    ascensaoHandleStageEnd(endInfo);
  } else {
    finalizeCampaign();
  }
}
function finalizeCampaign(){
  state.screen = "end";
  saveCampaignRecord();
}
async function saveCampaignRecord(){
  try{
    const info = state.endInfo || {type:"groups"};
    const wins = state.journey.filter(j=>j.result==="W").length;
    const losses = state.journey.filter(j=>j.result==="L").length;
    const mvp = info.type==="champion" ? getMVP() : null;
    const record = {
      date: new Date().toISOString(),
      resultType: info.type,
      stageLabelKey: info.stageLabelKey || null,
      teamName: state.teamName,
      headCoach: state.headCoach,
      difficulty: state.difficulty,
      regionalRegiao: state.regionalRegiao || null,
      overall: teamOverall(state.roster),
      record: `${wins}V-${losses}D`,
      roster: state.roster.map((p,i)=>({name:p.name, role:SLOT_ORDER[i]})),
      mvpName: mvp ? mvp.name : null,
    };
    const raw = await storageGetValue("campaign_history");
    const list = raw ? JSON.parse(raw) : [];
    list.unshift(record);
    if(list.length>50) list.length = 50; // guarda só as 50 mais recentes
    await storageSetValue("campaign_history", JSON.stringify(list));
  } catch(e){ /* armazenamento indisponível — segue o jogo normalmente */ }
}
// Salva o resumo de uma carreira COMPLETA do Rumo à Ascensão em "Campanhas Anteriores" —
// mesmo histórico compartilhado dos outros modos, só que com um formato de registro próprio.

    const raw = await storageGetValue("campaign_history");

// Monta o texto de compartilhamento do FIM DE CARREIRA do Rumo à Ascensão — nome, funções,
// títulos por competição e quantas vezes foi MVP.

// Escolhe a frase de call-to-action certa pro compartilhamento, de acordo com o modo atual.
function shareCtaText(){
  if(state.difficulty==="copa") return t("shareCtaCopa");
  if(state.difficulty==="regional") return t("shareCtaRegional");
  return t("shareCta");

function buildShareText(){

  let headline;
  if(info.type==="champion") headline = state.difficulty==="regional" ? t("shareHeadlineRegionalChampion")(state.regionalRegiao) : t("shareHeadlineChampion");
  else if(info.type==="runnerup") headline = state.difficulty==="regional" ? t("shareHeadlineRegionalRunnerup")(state.regionalRegiao) : t("shareHeadlineRunnerup");
  else if(info.type==="playoffs") headline = t("shareHeadlinePlayoffs")(bracketLabel(info.stageLabelKey));
  else headline = t("shareHeadlineGroups");

  const modeLabel = state.difficulty==="classico" ? t("diffClassicoTitle") : state.difficulty==="copa" ? t("diffCopaTitle") : state.difficulty==="regional" ? (state.regionalSelva ? t("selvaModeRegionalTitle") : t("regionalModeBtn")) : t("diffSelvaTitle");
  const wins = state.journey.filter(j=>j.result==="W").length;
  const losses = state.journey.filter(j=>j.result==="L").length;
  let mapsWon=0, mapsLost=0;
  state.journey.forEach(j=>{
    const parts = j.score.split("-").map(Number);
    mapsWon += parts[0]||0; mapsLost += parts[1]||0;
  });

  lines.push(`${t("shareOverallLabel")}: ${teamOverall(state.roster)}`);
  if(mvp) lines.push(`${t("shareMvpLabel")}: ${mvp.name}`);
  SLOT_ORDER.forEach((roleKey,i)=>{
    const p = state.roster[i];
    if(p) lines.push(`${t("shareTeamMemberLabel")(roleLabel(roleKey))}: ${p.name}`);
  });
  if(state.headCoach) lines.push(`${t("shareCoachLabel")}: ${state.headCoach}`);

  lines.push(shareCtaText());
  try{

    if(/^https?:\/\//.test(href)) lines.push(href);
  }catch(e){}
  return lines.join("\n");
}

function initSeriesStats(){
  state.seriesStats = {
    us: state.matchStats.us.map(p=>({name:p.name, k:0})),
    them: state.matchStats.them.map(p=>({name:p.name, k:0})),
  };
}

// Verifica (sem alterar o estado) se a partida atual — incluindo o mapa em andamento —
// já superou o recorde "a bater" desta partida (que pode já ter sido elevado nesta mesma
// partida por um mapa anterior). Usado para exibir o aviso na tela de resultado.
// Verifica (sem alterar o estado) se o mapa/série atual — incluindo o que está rolando agora —
// já superou o recorde "a bater" da CAMPANHA (que pode já ter sido elevado por qualquer um dos
// dois lados, em qualquer partida anterior desta campanha). Usado para exibir o aviso na tela.
function checkRecords(){
  const bo = state.mapsToWin===3 ? "md5" : "md3";
  const cr = state.campaignRecords;

  function bestBreak(usArr, themArr, currentRecord){
    let best = null;
    function consider(p, side){
      if(p.kills > currentRecord.kills && (!best || p.kills>best.kills)){
        best = {side, name:p.name, kills:p.kills};
      }
    }
    usArr.forEach(x=>consider(x,"us"));
    themArr.forEach(x=>consider(x,"them"));
    return best;
  }

  const singleMapUs = state.matchStats.us.map(p=>({name:p.name, kills:p.k}));
  const singleMapThem = state.matchStats.them.map(p=>({name:p.name, kills:p.k}));
  const singleMapBreak = bestBreak(singleMapUs, singleMapThem, cr.singleMap);

  const seriesUs = state.matchStats.us.map((p,i)=>({name:p.name, kills:(state.seriesStats.us[i]?state.seriesStats.us[i].k:0)+p.k}));
  const seriesThem = state.matchStats.them.map((p,i)=>({name:p.name, kills:(state.seriesStats.them[i]?state.seriesStats.them[i].k:0)+p.k}));
  const seriesBreak = bestBreak(seriesUs, seriesThem, cr[bo]);

  return {singleMapBreak, seriesBreak, bo, prevSingleMap:cr.singleMap, prevSeries:cr[bo]};
}

// Decide se o mapa acabou: precisa de pelo menos 13 rounds E vantagem de 2 — em prorrogação
// (12-12 pra frente), continua até alguém abrir 2 de diferença, igual na vida real.
function isMapDecided(us, them){
  const leader = Math.max(us, them);
  const diff = Math.abs(us-them);
  return leader>=13 && diff>=2;
}

function initMatchStats(){
  const opp = currentOpponent();
  const sideStats = rosterArr => rosterArr.map((p,i)=>({name:p.name, slot:SLOT_ORDER[i], roles:p.roles||[], tags:p.tags||[], overall:p.overall||75, isCharacter:p.isCharacter, country:p.country, k:0, d:0, a:0}));
  state.matchStats = {
    us: sideStats(state.roster),
    them: sideStats(opp && opp.roster ? opp.roster : []),
  };
}

function weightedPick(weights){
  const total = weights.reduce((s,w)=>s+Math.max(1,w),0);
  let r = Math.random()*total;
  for(let i=0;i<weights.length;i++){
    r -= Math.max(1,weights[i]);
    if(r<=0) return i;
  }
  return weights.length-1;
}
function sampleDistinct(n, k){
  const idx = Array.from({length:n}, (_,i)=>i);
  const out = [];
  const count = Math.min(k, n);
  for(let i=0;i<count;i++){
    const j = Math.floor(Math.random()*idx.length);
    out.push(idx.splice(j,1)[0]);
  }
  return out;
}
// Peso de abate: craques com a tag "mm" (Mira Monstra) e overall 95+ têm chance ampliada de
// puxar os kills da rodada (mais forte em duelistas), abrindo caminho — nem sempre, só nas
// partidas monstruosas — para baterem os recordes reais de abates. Entry/Operator dão um empurrão menor.
// Elegível pra sistema de recorde: é Duelista OU tem Mira Monstra OU tem Clutch (qualquer um dos
// três já basta, não precisa ser tudo junto). Precisa também ter overall alto — senão fica fácil demais.
function isRecordCandidate(p){
  if((p.overall||0) < 89) return false;
  const roles = p.roles||[];
  const tags = p.tags||[];
  return roles.includes("duelist") || tags.includes("mm") || tags.includes("clutch");
}
function killWeight(p){
  let w = 10; // piso: todo mundo tem chance real de abater, mesmo sem destaque nenhum
  w += (p.overall - 75) * 0.3;
  const tags = p.tags||[];
  if(tags.includes("entry") && p.slot==="duelist") w += 1.5;
  if(tags.includes("operator")) w += 1;
  if(tags.includes("clutch")) w += 1.2;
  if(isRecordCandidate(p)) w += ((p.roles||[]).includes("duelist") ? 5.5 : 3.2);
  return w;
}
// Peso de assistência: craques com utilidade/IGL/lurker tendem a puxar mais assistências.
function assistWeight(p){
  let w = 10;
  w += (p.overall - 75) * 0.3;
  const tags = p.tags||[];
  if(tags.includes("utility")) w += 1.5;
  if(tags.includes("igl")) w += 1;
  if(tags.includes("lurker")) w += 0.8;
  return w;
}
function updateMatchStats(weWin){
  const winSide = weWin ? state.matchStats.us : state.matchStats.them;
  const loseSide = weWin ? state.matchStats.them : state.matchStats.us;
  if(!winSide.length || !loseSide.length) return;
  const killCount = 3 + Math.floor(Math.random()*3); // 3 a 5 baixas na rodada
  const diedIdx = sampleDistinct(loseSide.length, killCount);

  // rodada de ACE: craques com Mira Monstra (95+) ou Duelistas com Clutch (93+) têm uma chance
  // bem rara de fechar a rodada sozinhos — é o que permite (raramente) alcançar recordes como o
  // de 47 abates num mapa único, que exigem dominância extrema em várias rodadas.
  const aceCandidates = winSide.filter(isRecordCandidate);
  if(aceCandidates.length && Math.random()<0.22){
    const acePlayer = aceCandidates[Math.floor(Math.random()*aceCandidates.length)];
    diedIdx.forEach(idx=>{ loseSide[idx].d++; });
    acePlayer.k += killCount;
  } else {
    diedIdx.forEach(idx=>{
      loseSide[idx].d++;
      const killerIdx = weightedPick(winSide.map(killWeight));
      winSide[killerIdx].k++;
      if(Math.random()<0.55 && winSide.length>1){
        let assisterIdx = weightedPick(winSide.map(assistWeight));
        if(assisterIdx===killerIdx) assisterIdx = (assisterIdx+1)%winSide.length;
        winSide[assisterIdx].a++;
      }
    });
  }
  // chance de uma baixa "de troca" do lado perdedor
  if(Math.random()<0.2){
    const tradedIdx = weightedPick(loseSide.map(killWeight));
    loseSide[tradedIdx].k++;
    const victimIdx = Math.floor(Math.random()*winSide.length);
    winSide[victimIdx].d++;
  }
  // rodada de destaque: craques com Mira Monstra (95+) ou Duelistas com Clutch (93+) têm uma
  // chance rara de puxar 1 abate extra na rodada.
  const stars = winSide.filter(isRecordCandidate);
  if(stars.length && Math.random()<0.09){
    const idx = winSide.indexOf(stars[Math.floor(Math.random()*stars.length)]);
    winSide[idx].k++;
  }
}

// Lado atual (ataque/defesa) do jogador no mapa em andamento — troca a cada 12 rounds, igual real.
function currentSide(){
  const totalRounds = state.matchScore.us + state.matchScore.them;
  return (Math.floor(totalRounds/12) % 2 === 0) ? "attack" : "defense";
}

const DEFENSE_EDGE = 1.5; // defesa tem uma vantagem estatística pequena sobre o ataque, sempre
const PISTOL_ECON_BONUS = 3; // quem vence a pistola (rodada 1 ou 13) leva vantagem só na rodada seguinte

function simulateRound(){
  const opp = currentOpponent();
  const ourSide = currentSide();
  const theirSide = ourSide==="attack" ? "defense" : "attack";
  const ourComp = compositionBonus(state.roster, true);
  const theirComp = compositionBonus(opp.roster, false);
  const ourBuff = coachBuff(state.headCoach) + ourComp[ourSide] + chemistryBonus(state.roster, state.headCoach);
  const theirBuff = coachBuff(opp.coach) + theirComp[theirSide] + chemistryBonus(opp.roster, opp.coach);

  // vantagem estatística da defesa (independente de composição/química)
  const ourDefenseEdge = ourSide==="defense" ? DEFENSE_EDGE : 0;
  const theirDefenseEdge = theirSide==="defense" ? DEFENSE_EDGE : 0;

  // economia de pistola: só vale na rodada IMEDIATAMENTE seguinte à rodada 1 ou à rodada 13
  const roundsPlayed = state.matchScore.us + state.matchScore.them;
  let ourPistolBonus = 0, theirPistolBonus = 0;
  if(roundsPlayed===1 || roundsPlayed===13){
    const pistolWinnerIdx = roundsPlayed===1 ? 0 : 12;
    if(state.roundLog[pistolWinnerIdx]==="win") ourPistolBonus = PISTOL_ECON_BONUS;
    else theirPistolBonus = PISTOL_ECON_BONUS;
  }

  const us = teamOverall(state.roster) + ourBuff*BUFF_DAMPING + ourDefenseEdge + ourPistolBonus;
  const oppRating = opp.rating + theirBuff*BUFF_DAMPING + theirDefenseEdge + theirPistolBonus;
  const diff = us - oppRating;
  const baseProb = 0.5 + diff/130;
  const prob = Math.min(0.94, Math.max(0.06, baseProb));
  const weWin = Math.random() < prob;
  if(weWin){ state.matchScore.us++; state.roundLog.push("win"); }
  else { state.matchScore.them++; state.roundLog.push("loss"); }
  updateMatchStats(weWin);
}
